<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>JARVIS — Voice Interface</title>
<style>
:root{
  --bg:#04070c;
  --hue:190;
  --accent:hsl(var(--hue) 100% 60%);
  --accent-dim:hsl(var(--hue) 80% 45%);
  --text:hsl(var(--hue) 30% 88%);
  --muted:hsl(var(--hue) 20% 45%);
  --panel:hsla(var(--hue),40%,60%,0.06);
  /* The one colour on this screen that is not the accent. Everything the HUD
     says is cyan; gold is reserved for "this, now" -- the block that just
     arrived and the row being spoken about. Kept as a hue so the glow can be
     mixed at several strengths without four near-identical literals. */
  --gold:44;
  --line:hsla(var(--hue),70%,60%,0.18);
  /* The orb's full size, in one place because three things need it: the orb
     itself, every breakpoint that shrinks it, and the rule that gives it back
     when the windows are folded away into the corner. */
  --orbSize:min(66vh,680px);
  /* How big the windows are. Everything inside a card is sized in em off this,
     so one number grows the card, its text and its width together -- which is
     what browser zoom does to the whole page, and this does to the windows
     alone. Overwritten from localStorage on load, and by the +/- buttons. */
  --ds:1.3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:'SF Mono','JetBrains Mono','Cascadia Mono',ui-monospace,Menlo,Consolas,monospace;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;
  transition:--hue 600ms;
}
/* minmax(0,…) on the middle row so the stage is the part that gives way. The
   header and the footer are written in pixels and the window is not: zooming in
   takes the difference out of whatever can shrink, and the only thing that
   should is the space the orb stands in. */
#app{position:fixed;inset:0;display:grid;
  grid-template-columns:minmax(240px,22vw) 1fr minmax(240px,22vw);
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:0;}

/* ---------- ambient background ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 52%, hsla(var(--hue),90%,45%,0.13), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%, hsla(var(--hue),90%,40%,0.10), transparent 70%),
    var(--bg);
  transition:background 600ms ease;}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(hsla(var(--hue),80%,60%,.05) 1px,transparent 1px),
    linear-gradient(90deg,hsla(var(--hue),80%,60%,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 20%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 20%,transparent 85%);}
#vignette{position:fixed;inset:0;z-index:6;pointer-events:none;
  box-shadow:inset 0 0 240px 40px rgba(0,0,0,.9);}
#scan{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}

/* ---------- top bar ---------- */
header{grid-column:1/4;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding:18px 26px 10px;gap:20px;min-width:0}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:19px;letter-spacing:.42em;font-weight:600;color:var(--accent);
  text-shadow:0 0 18px hsla(var(--hue),100%,60%,.55);}
.brand span{font-size:10px;letter-spacing:.22em;color:var(--muted)}
/* The status row is one line that scrolls sideways, never a block that wraps.
   Wrapped, it grew the header a row at a time, and since the header's height is
   taken off the top of a fixed-height grid, a third row of pills pushed the
   footer -- the text field included -- off the bottom of the window. Zooming in
   made that happen on a screen with plenty of room on it. */
.pills{display:flex;gap:8px;flex-wrap:nowrap;justify-content:flex-start;
  min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
/* Right-aligned by a margin rather than by justify-content: a flex row that
   overflows and is justified to its end loses the beginning off the left edge,
   and no amount of scrolling brings it back. An auto margin gives way instead. */
.pills>:first-child{margin-left:auto}
.pills::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.14em;
  padding:6px 11px;border:1px solid var(--line);border-radius:100px;
  background:var(--panel);color:var(--muted);white-space:nowrap;text-transform:uppercase}
.pill b{color:var(--text);font-weight:500}
/* The language switch looks like the pills around it and says both languages,
   the one being spoken lit and the other dimmed, so what a tap does is on it. */
.lang-switch{font-family:inherit;cursor:pointer;transition:.25s}
.lang-switch:hover,.lang-switch:focus-visible{color:var(--accent);border-color:hsla(var(--hue),90%,60%,.55);
  box-shadow:0 0 18px hsla(var(--hue),100%,60%,.16);outline:none}
.lang-switch b span{color:var(--muted);opacity:.45;transition:color .25s,opacity .25s}
.lang-switch b span.on{color:var(--accent);opacity:1;text-shadow:0 0 8px hsla(var(--hue),100%,60%,.45)}
/* Memory and the tour are appended to this row by their own modules, so their
   place in the DOM is whichever module ran first. Where they sit is a layout
   decision, so it is made here rather than left to that: both after the status
   pills, memory before the tour. */
.mem-open{order:1}
.tour-open{order:2}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent);animation:blip 2.4s ease-in-out infinite}
.dot.warn{background:#f5a524;box-shadow:0 0 8px #f5a524}
.dot.off{background:#3a4553;box-shadow:none;animation:none}
.dot.err{background:#ff5f6d;box-shadow:0 0 8px #ff5f6d;animation:none}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
.clock{text-align:right;line-height:1.15}
.clock .t{font-size:26px;font-weight:300;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.clock .d{font-size:9.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}

/* ---------- side panels ---------- */
aside{z-index:3;padding:8px 22px 22px;display:flex;flex-direction:column;gap:14px;min-height:0}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:12px 14px;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
/* the class sets display:flex, which outranks the browser's rule for [hidden] */
.panel[hidden]{display:none}
.panel::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,hsla(var(--hue),100%,65%,.5),transparent)}
.panel h2{font-size:9.5px;letter-spacing:.26em;color:var(--muted);
  text-transform:uppercase;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.panel h2 em{font-style:normal;color:hsla(var(--hue),70%,60%,.7)}

/* transcript */
/* margin-top:auto on the first message keeps the column bottom-anchored;
   justify-content:flex-end would do the same but makes the overflow unscrollable */
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;
  -webkit-user-select:text;user-select:text;cursor:text;
  scrollbar-width:thin;scrollbar-color:hsla(var(--hue),60%,55%,.35) transparent}
#log .msg:first-child{margin-top:auto}
.msg{font-size:12px;line-height:1.5;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.msg .who{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  display:block;margin-bottom:3px}
.msg.user .txt{color:#dfe9f2}
.msg.ai .who{color:var(--accent)}
.msg.ai .txt{color:hsl(var(--hue) 55% 78%)}
.msg.sys .txt{color:var(--muted);font-size:10.5px;font-style:italic}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- context panel ----
   The context column is two panels, and they do not want the space evenly: the
   blocks grow with the conversation and the five system readings never do. So
   context takes the column and system takes the height of its own rows. */
#contextPanel{flex:1 1 auto;min-height:0}
#systemPanel{flex:0 0 auto}
/* No scrollbar in either direction. Horizontally there is nothing to reach:
   every child is allowed to be narrower than its content. Vertically the sheet
   is trimmed to what fits instead -- the top of it is what is relevant now, and
   a block pushed off the bottom is one the conversation has moved past. */
#ctxGroups{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px}
#ctxEmpty{font-size:10.5px;line-height:1.5;font-style:italic;color:var(--muted)}
/* The padding is negative-margined back out so an unlit block sits exactly
   where it did before, and a lit one has room for its ring. */
.ctxgroup{padding:7px;margin:-7px;border:1px solid transparent;border-radius:11px;
  transition:border-color .6s ease,background .6s ease}
.ctxgroup+.ctxgroup{margin-top:0}
.ctxgroup .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:8px;
  color:hsla(var(--hue),70%,62%,.75)}
.ctxgroup .gh .when{letter-spacing:.14em;color:var(--muted);flex:0 0 auto}

/* entities */
/* minmax(0,…) rather than 1fr: a plain 1fr track is floored at the width of the
   widest thing in it, so one long reading widened the column and took the panel
   sideways with it. */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:hsla(var(--hue),40%,50%,.05);
  min-width:0;transition:.35s}
.tile.on{border-color:hsla(var(--hue),90%,60%,.5);background:hsla(var(--hue),90%,55%,.11);
  box-shadow:0 0 18px hsla(var(--hue),100%,55%,.13) inset}
.tile .n{font-size:9px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:15px;font-weight:300;margin-top:3px;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
.tile.on .v{color:var(--accent);text-shadow:0 0 12px hsla(var(--hue),100%,60%,.5)}

/* ---- the gold: a row that is being spoken about ----
   It used to mark two things: a reading that had just landed on the context
   panel, and the row of a list the sentence is about. Two golds on one screen
   is two meanings, and the panel is a standing sheet of figures rather than a
   feed of news -- so the panel keeps none of it and the windows keep all of it.
   The rhythm is stated once in `rowGlow` and once next to it in the script. */

/* meters */
.meter{margin-bottom:9px}
.meter .lab{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.meter .lab b{color:var(--text);font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:3px;background:hsla(var(--hue),40%,50%,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent-dim),var(--accent));
  box-shadow:0 0 10px hsla(var(--hue),100%,60%,.7);transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* pipeline */
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.1em;
  padding:5px 0;color:var(--muted);transition:.3s;text-transform:uppercase}
.step i{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:8px;font-style:normal;transition:.3s}
.step.done{color:hsl(var(--hue) 40% 70%)}
.step.done i{border-color:hsla(var(--hue),80%,55%,.6);color:var(--accent)}
.step.active{color:var(--accent);text-shadow:0 0 12px hsla(var(--hue),100%,60%,.45)}
.step.active i{border-color:var(--accent);background:hsla(var(--hue),100%,60%,.18);
  box-shadow:0 0 14px hsla(var(--hue),100%,60%,.5);animation:pulseStep 1s ease-in-out infinite}
.step .ms{margin-left:auto;font-size:9px;opacity:.75;font-variant-numeric:tabular-nums}
@keyframes pulseStep{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ---------- center stage ---------- */
/* A size container, so the orb can be measured against the stage it stands on
   rather than against the window. Browser zoom shrinks this middle band much
   faster than it shrinks the window -- the header and footer keep their pixel
   heights -- so an orb sized in vh outgrew the room it had and the status line
   ended up printed across its rings. */
main{position:relative;display:grid;place-items:center;z-index:2;min-height:0;
  container-type:size}
/* ---- display surface: content in place of the orb ---- */
#orb{transition:width .5s cubic-bezier(.22,.61,.36,1),height .5s cubic-bezier(.22,.61,.36,1),
     transform .5s cubic-bezier(.22,.61,.36,1),opacity .35s ease}
main.showing #orb{position:absolute;left:18px;bottom:18px;width:132px;height:132px;opacity:.85;
  /* the corner is a control now, so it has to stay clickable whatever a wide
     window does with the space around it */
  cursor:pointer;z-index:4}
main.showing #stateText{align-self:end;margin-left:170px;text-align:left}

/* Folded away: the windows step aside and the orb takes the middle back, at the
   size it has when nothing is being shown. The last window keeps the corner the
   orb just left, as a thumbnail -- so the two views swap places rather than one
   of them disappearing, and either one is a click away from the other. */
main.showing.collapsed #display{display:none}
main.showing.collapsed #orb{position:static;left:auto;bottom:auto;opacity:1;
  width:var(--orbFit);height:var(--orbFit)}
main.showing.collapsed #stateText{align-self:auto;margin-left:0;padding-left:0;text-align:center}
#dispDock{position:absolute;left:18px;bottom:18px;width:196px;height:128px;display:none;z-index:3}
main.showing.collapsed #dispDock{display:block}

/* One card per thing shown. The whole middle of the screen is a desk: the
   windows he has finished with lie on it as thumbnails, in rows from the top
   left, as many as the desk has room for; the one he is talking about stands
   on top of them at full size. A window is shown, then seen going down onto
   the desk, and only then does the next one go up -- so what the desk holds
   is always a picture of what has been said so far. The desk ends where the
   orb in the corner and the state line begin; the number is the breakpoint's,
   and `sizeStage` raises it when the line grows taller than expected. */
#display{position:absolute;display:none;left:14px;right:14px;top:14px;
  bottom:var(--dispBottom,162px);font-size:calc(15px * var(--ds))}
main.showing #display{display:block}
/* The window is a frame, not a bag: it is the same height whether it holds a
   three-line forecast or twelve mails, and a list longer than the frame scrolls
   inside it. Centred over the desk, so it goes down onto the desk from the
   middle and comes back up to it. The vh cap keeps it clear of the state
   line; the em is what the size control moves; `--stageH` is the measured
   room and only ever a cap. */
#dispStage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;width:min(72ch,94%);height:min(58vh,32em,var(--stageH,58vh));z-index:2}
#dispStage:empty{display:none}
#dispStage .dcard{height:100%;max-height:none;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
/* The desk. A grid of fixed cells, filled in the order the windows went down,
   clipped at the bottom: what would fall off the desk is thrown away first, in
   `makeRoom`, so nothing is ever half shown. */
#dispStrip{--thumbW:196px;--thumbH:128px;
  position:absolute;inset:34px 0 0 0;display:grid;
  grid-template-columns:repeat(auto-fill,var(--thumbW));grid-auto-rows:var(--thumbH);
  gap:12px;justify-content:center;align-content:start;overflow:hidden;
  transition:opacity .35s ease}
/* Something on the stage: the desk steps back, so the eye finds the window. */
#dispStage:not(:empty) ~ #dispStrip{opacity:.5}
/* The gap a thumbnail left when it was brought back up to full size. It goes
   back down into it, so what lies where on the desk never changes under you. */
.dslot{border:1px dashed hsla(var(--hue),80%,60%,.22);border-radius:14px}

/* The size control. Deliberately not browser zoom: that grows the header, the
   panels and the transcript along with it, and the complaint was about the
   windows only. */
#dispZoom{position:absolute;top:0;right:0;z-index:3;display:flex;align-items:center;gap:6px;
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#dispZoom button{width:26px;height:24px;line-height:22px;padding:0;cursor:pointer;
  font-family:inherit;font-size:14px;color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:6px}
#dispZoom button:hover,#dispZoom button:focus-visible{color:#e8f1f8;
  border-color:hsla(var(--hue),80%,60%,.5);outline:none}
#dispZoom b{min-width:4ch;text-align:center;font-weight:400;font-variant-numeric:tabular-nums}

.dcard{position:relative;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;
  max-height:min(66vh,42em);
  padding:18px 20px 16px;
  background:linear-gradient(180deg,rgba(10,18,26,.86),rgba(8,14,20,.92));
  border:1px solid hsla(var(--hue),80%,60%,.28);border-radius:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 18px 60px -20px hsla(var(--hue),90%,40%,.5);
  animation:dispIn .38s cubic-bezier(.22,.61,.36,1) both}
@keyframes dispIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* Everything below hangs off .dcard rather than #display, because a card is not
   always inside #display: folded away, the lead card lives in the corner dock
   and still has to look like itself. */
/* `flex:none` on the heading is what keeps the name of the window on it. The
   card is a fixed height now, so a list longer than the card overflows it, and
   a flex item's default is to give way: the title was squashed from 16px to 7
   and then to nothing, worst on the mail window because it is the longest list.
   The body is the one part that may take what is left. */
.dcard h3{flex:none;margin:0;font-size:.8em;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;
  color:hsla(var(--hue),85%,72%,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .body{flex:1 1 auto;overflow-x:hidden;overflow-y:auto;min-height:0;scrollbar-width:none}
.dcard .body::-webkit-scrollbar{display:none}
.dclose,.dmin{position:absolute;top:10px;width:24px;height:24px;line-height:22px;
  text-align:center;border:1px solid var(--line);border-radius:6px;background:transparent;
  color:var(--muted);font-size:14px;cursor:pointer;padding:0}
.dclose{right:12px}
.dmin{right:44px}
.dclose:hover,.dclose:focus-visible,.dmin:hover,.dmin:focus-visible{color:#e8f1f8;
  border-color:hsla(var(--hue),80%,60%,.5);outline:none}

/* A thumbnail is the same card at a distance: same markup, scaled down, so what
   you glance at is recognisably the thing you were shown a minute ago. Its own
   font-size pins it: a thumbnail is a fixed-size landmark, so the size control
   above must not drag it along. */
#dispStrip .dcard,#dispDock .dcard{flex:0 0 auto;width:var(--thumbW,196px);height:var(--thumbH,128px);
  padding:9px 11px;gap:5px;font-size:11.5px;
  overflow:hidden;cursor:pointer;box-shadow:0 10px 26px -16px hsla(var(--hue),90%,40%,.6);
  animation:none}
#dispStrip .dcard:hover,#dispStrip .dcard:focus-visible,
#dispDock .dcard:hover,#dispDock .dcard:focus-visible{border-color:hsla(var(--hue),85%,65%,.6);outline:none}
#dispStrip .body,#dispDock .body{overflow:hidden;pointer-events:none;
  transform:scale(.5);transform-origin:top left;width:200%;height:200%}
#dispStrip .dclose,#dispDock .dclose,#dispStrip .dmin,#dispDock .dmin{display:none}
/* The dock is the one place a card is the way back to somewhere, so it says so. */
#dispDock .dcard{width:100%;height:100%;border-color:hsla(var(--hue),85%,65%,.5)}

.dcard img{display:block;max-width:100%;max-height:min(62vh,34em);margin:0 auto;
  border-radius:8px;object-fit:contain}
.dcard .cap{font-size:.87em;color:var(--muted);text-align:center}
.dcard .agenda-date{font-size:.78em;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 .35em;padding:0 .15em .4em;border-bottom:1px solid hsla(var(--hue),80%,60%,.22);
  text-shadow:0 0 12px hsla(var(--hue),100%,60%,.35)}
.dcard .fallback{padding:28px;text-align:center;color:var(--muted);font-size:.87em;
  border:1px dashed var(--line);border-radius:8px}

.dcard table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:1em}
.dcard td{padding:.47em .55em;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:baseline;
  transition:background .45s ease,color .45s ease}
.dcard tr:last-child td{border-bottom:0}
.dcard td.k{color:var(--muted);font-weight:300}
/* A subject line is as long as somebody felt like making it, and the window is
   a fixed width. It wraps; it never widens the table. */
.dcard td{overflow-wrap:anywhere}
.dcard td.k{width:38%}
.dcard td.v{text-align:right;font-variant-numeric:tabular-nums;color:#e8f1f8}
.dcard td.v small{display:block;color:var(--muted);font-size:.73em;font-variant-numeric:normal}

/* A row the assistant marked: this one wants something from you. It is a
   property of the mail rather than of the sentence, so it does not breathe and
   it does not go out; it is the quieter of the two golds for that reason. It is
   written before `tr.hot` so the row being spoken about still wins while lit. */
/* A row he named is raised to the top so it is in view. The gold itself is only
   `tr.hot` while he is on it -- once that fades, the row looks like the others
   again. Keeping a warm tint after the blink made every spoken row stay lit. */
.dcard tr.flag td{background:hsla(var(--gold),95%,55%,.07)}
.dcard tr.flag td.k{color:hsl(var(--gold) 85% 74%);
  box-shadow:inset 3px 0 0 hsla(var(--gold),95%,60%,.75)}
.dcard tr.flag td.v{color:hsl(var(--gold) 20% 96%)}

/* The row he is talking about right now: out of a list of twelve mails, this
   is the one the sentence is about. It lights when the words reach it, blinks
   once, and stays gold -- steadily, no longer breathing -- until the next row
   takes it or its time is up. One blink is the arrival; the gold after it is
   where he is. */
@keyframes rowGlow{
  0%,100%{background:hsla(var(--gold),95%,55%,.10)}
  50%    {background:hsla(var(--gold),96%,60%,.28)}
}
.dcard tr.hot td{background:hsla(var(--gold),95%,55%,.14);color:hsl(var(--gold) 25% 95%)}
.dcard tr.hot td.k{color:hsl(var(--gold) 90% 72%);box-shadow:inset 3px 0 0 hsl(var(--gold) 95% 60%)}
.dcard tr.hot td.v{text-shadow:0 0 14px hsla(var(--gold),100%,62%,.45)}
.dcard tr.hot td.v small{color:hsla(var(--gold),55%,78%,.8)}
.dcard tr.hot.pulsing td{animation:rowGlow 1.7s ease-in-out 1}
.dcard tr.hot.fading td{background:transparent;color:var(--text);animation:none;
  transition:background var(--rowFade) linear,color var(--rowFade) linear}
.dcard tr.hot.fading td.k{color:var(--muted);box-shadow:none;
  transition:color var(--rowFade) linear,box-shadow var(--rowFade) linear}
.dcard tr.hot.fading td.v{text-shadow:0 0 0 transparent;transition:text-shadow var(--rowFade) linear}
.dcard tr.hot.fading td.v small{color:var(--muted);transition:color var(--rowFade) linear}
/* Handed the gold over before its time was up: another row lit and only one
   row on the screen holds the gold at a time. It leaves in a
   blink rather than over the full fade, so the two are never lit together. */
.dcard tr.hot{--rowFade:2500ms}
.dcard tr.hot.cut{--rowFade:380ms}
@media (prefers-reduced-motion:reduce){ .dcard tr.hot.pulsing td{animation:none} }

.dcard .note{font-size:1em;font-weight:300;line-height:1.55;color:#e8f1f8;
  white-space:pre-wrap;overflow-wrap:anywhere}
.dcard svg{width:100%;height:auto;display:block}
.dcard svg .axis{stroke:rgba(255,255,255,.12);stroke-width:1}
.dcard svg .line{fill:none;stroke:hsl(var(--hue),85%,62%);stroke-width:2;
  stroke-linejoin:round;stroke-linecap:round}
.dcard svg .area{fill:hsla(var(--hue),85%,55%,.14)}
.dcard svg .dot{fill:hsl(var(--hue),90%,70%)}
.dcard svg text{fill:var(--muted);font-size:10px}

/* ---- the weather card ----
   A forecast is looked at, not read: a sky, two temperatures, whether to take a
   coat. Everything in here is drawn from the readings the pack handed over;
   nothing is a row. The icons are inline SVG so they take the card's own hue
   and its gold, and stay sharp at thumbnail size. */
/* The weather, as a picture of the sky. The card's whole body is the sky for
   the weather it is -- a blue day, an indigo night, a slate rain -- and in it
   the sun turns and breathes, the clouds drift, the rain falls, the stars
   blink. Over that, laid out the way a weather app lays it out: the
   temperature it is now, large; the condition in words; today's high and low;
   the sun's clocks; and the days after as tiles along the bottom. */
.dcard .wx{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:.3em;height:100%;min-height:0;text-align:center;overflow:hidden;border-radius:10px;
  margin:0 -.35em;padding:.4em .9em .7em}
.dcard .wx>*{position:relative;z-index:1}
.dcard .wx[data-sky=day]{background:linear-gradient(180deg,#2f6fc7 0%,#1c478f 42%,#0d2247 78%,#0a1626 100%)}
.dcard .wx[data-sky=night]{background:linear-gradient(180deg,#0c1431 0%,#172654 45%,#0b1226 100%)}
.dcard .wx[data-sky=grey]{background:linear-gradient(180deg,#5b7191 0%,#33465f 45%,#131d2c 100%)}
.dcard .wx[data-sky=rain]{background:linear-gradient(180deg,#3d5470 0%,#22354c 45%,#0d1620 100%)}
.dcard .wx[data-sky=storm]{background:linear-gradient(180deg,#2c3150 0%,#1a1e35 45%,#0a0c17 100%)}
.dcard .wx[data-sky=snow]{background:linear-gradient(180deg,#7d93b3 0%,#3f557a 45%,#152034 100%)}
.dcard .wx[data-night]:not([data-sky=night])::after{content:'';position:absolute;inset:0;z-index:0;
  background:rgba(4,8,24,.42);pointer-events:none}
.dcard .wx-scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
.dcard .wx svg{display:block}
.dcard .wx-hero{display:flex;align-items:center;justify-content:flex-end;width:100%;flex:none;
  min-height:40%;padding-right:.4em}
.dcard .wx-tempbox{text-align:right;text-shadow:0 2px 22px rgba(0,0,0,.55)}
.dcard .wx-temp{display:block;font-size:5.2em;font-weight:300;line-height:1;color:#fff;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.dcard .wx-cond{font-size:1.5em;font-weight:600;color:#eaf2ff;line-height:1.15;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.dcard .wx-range{display:flex;gap:1.8em;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(234,242,255,.72);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.dcard .wx-range b{font-weight:600;color:#fff;letter-spacing:0;margin-left:.35em}
.dcard .wx-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1.6em;font-size:.95em;
  color:rgba(234,242,255,.8);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.dcard .wx-meta span{display:flex;align-items:center;gap:.4em;white-space:nowrap}
.dcard .wx-meta svg{width:1.6em;height:1.6em;flex:none}
.dcard .wx-meta .on{color:#9fd8ff}
.dcard .wx-tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.5em;width:100%;
  flex:none;margin-top:.2em}
.dcard .wx-tile{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.55em .3em .5em;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.14);border-radius:.75em;min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px -14px rgba(0,0,0,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dcard .wx-tile .d{font-size:.78em;color:rgba(234,242,255,.72);text-transform:capitalize;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dcard .wx-tile .ico{width:2.7em;height:2.7em}
.dcard .wx-tile b{font-size:1.3em;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.dcard .wx-tile small{font-size:.82em;color:rgba(234,242,255,.7);font-variant-numeric:tabular-nums}
/* The icons' own colours, and the sky's. The sun is the gold everything else
   on the screen lights up in, the clouds white with the light behind them, rain
   and snow take the cool end. Gradients come from the one <defs> block the
   script puts in the page. */
.dcard .wx .sun{fill:url(#wxSunG)}
.dcard .wx .ray{stroke:hsl(var(--gold) 90% 62%);stroke-width:3;stroke-linecap:round}
.dcard .wx .moon{fill:url(#wxMoonG)}
.dcard .wx .cloud{fill:url(#wxCloudG)}
.dcard .wx .cloud.dark{fill:url(#wxCloudDarkG)}
.dcard .wx .drop{stroke:#9fd8ff;stroke-width:3;stroke-linecap:round}
.dcard .wx .flake{fill:#f4f8ff}
.dcard .wx .bolt{fill:hsl(var(--gold) 95% 60%)}
.dcard .wx .gust{stroke:rgba(232,241,248,.75);stroke-width:3;stroke-linecap:round;fill:none}
.dcard .wx .fogline{stroke:rgba(232,241,248,.5);stroke-width:3;stroke-linecap:round}
.dcard .wx .warn{fill:none;stroke:hsl(var(--gold) 95% 60%);stroke-width:3;stroke-linejoin:round}
.dcard .wx .arrow{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.dcard .wx .dropico{fill:currentColor}
.dcard .wx .horizon{stroke:rgba(232,241,248,.55);stroke-width:3;stroke-linecap:round}
.dcard .wx .sunhalf{fill:url(#wxSunG)}
.dcard .wx .sunway{fill:none;stroke:rgba(232,241,248,.85);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
/* The sky in motion. Every moving thing turns about its own middle. */
.wx-scene .sun-g,.wx-scene .moon-g,.wx-scene .rays,.wx-scene .cloud,.wx-scene .drop,.wx-scene .flake,
.wx-scene .star,.wx-scene .fog,.wx-scene .gust,.wx-scene .warn-g{transform-box:fill-box;transform-origin:center}
.wx-scene .glow{fill:url(#wxSunGlowG);opacity:.55}
.wx-scene .glow.moon{fill:url(#wxMoonGlowG)}
.wx-scene .sun-g{animation:wxBreathe 7s ease-in-out infinite}
.wx-scene .rays{animation:wxSpin 80s linear infinite}
.wx-scene .rays .ray{stroke-width:4;opacity:.7}
.wx-scene .cloud{animation:wxDrift var(--d,18s) ease-in-out infinite alternate;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.wx-scene .drop{stroke-width:2.6;animation:wxFall 1.1s linear infinite}
.wx-scene .drop.hard{animation-duration:.8s}
.wx-scene .flake{animation:wxSnow 4.2s linear infinite}
.wx-scene .flake.hail{animation:wxFall .9s linear infinite;fill:#dbe9ff}
.wx-scene .bolt{animation:wxFlash 5.5s ease-out infinite;filter:drop-shadow(0 0 10px hsl(var(--gold) 95% 60%))}
.wx-scene .star{fill:#fff;animation:wxTwinkle var(--d,3s) ease-in-out infinite}
.wx-scene .fog{animation:wxFog var(--d,8s) ease-in-out infinite}
.wx-scene .gust{animation:wxGust var(--d,3.4s) ease-in infinite}
.wx-scene .warn-g{animation:wxBreathe 2.2s ease-in-out infinite}
.wx-scene .ground{fill:url(#wxGroundG)}
@keyframes wxSpin{to{transform:rotate(360deg)}}
@keyframes wxBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes wxDrift{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
@keyframes wxFall{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(48px);opacity:0}}
@keyframes wxSnow{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,60px);opacity:0}}
@keyframes wxFlash{0%,80%,86%,100%{opacity:0}82%,84%{opacity:1}}
@keyframes wxTwinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes wxFog{0%,100%{opacity:.3;transform:translateX(0)}50%{opacity:.7;transform:translateX(14px)}}
@keyframes wxGust{0%{transform:translateX(-50px);opacity:0}25%{opacity:1}100%{transform:translateX(80px);opacity:0}}
/* A thumbnail is a still; a wall of moving skies would be the only thing on the screen. */
#dispStrip .wx-scene *,#dispDock .wx-scene *{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){ .wx-scene *{animation:none} }

@media (prefers-reduced-motion:reduce){
  #orb{transition:none}
  .dcard{animation:none}
}
#frame{position:absolute;inset:22px 10px 14px;pointer-events:none}
#frame span{position:absolute;width:26px;height:26px;
  border:1px solid hsla(var(--hue),90%,60%,.30);transition:border-color .5s}
#frame span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
#frame span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
#frame span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
#frame span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
/* The size it is allowed to be: never wider than the stage, and never so tall
   that it reaches down into the strip the state text sits in. The orb is
   centred, so the room left under it is half of what it does not use; the text
   needs its 14px inset, its two lines, and a gap above them. The floor keeps it
   a visible thing on a stage too short for either rule to be kind. */
#orb{--orbFit:min(var(--orbSize),100cqw,calc(100cqh - 164px));
  width:var(--orbFit);height:var(--orbFit);display:block}
/* A short stage stops centring the orb. Centred, the room under it is half of
   what it does not use, so every pixel the status line needs costs the orb two
   -- and on a stage this short that is the difference between an orb and a bead.
   Sat at the top it pays for that strip once. */
@container (max-height:400px){
  #orb{align-self:start;--orbFit:min(var(--orbSize),100cqw,calc(100cqh - 95px))}
}
/* Past this even that is a bead with the words printed over it. The stage gives
   the orb up and keeps the words. */
@container (max-height:150px){ #orb{display:none} }
/* Level with the frame's bottom corners (#frame is inset 14px from the bottom),
   so the status line reads as part of the frame rather than as something
   floating above it. */
#stateText{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;width:100%}
#stateLabel{font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--accent);
  text-shadow:0 0 22px hsla(var(--hue),100%,60%,.6);transition:.3s}
#liveText{margin-top:14px;font-size:17px;font-weight:300;color:#e8f1f8;min-height:26px;
  letter-spacing:.02em;padding:0 8%;line-height:1.4}
#liveText .ghost{color:var(--muted)}

/* ---------- footer ---------- */
footer{grid-column:1/4;z-index:3;padding:0 26px 18px;display:flex;align-items:center;gap:18px}
/* min-width:0 is what keeps the field and the buttons on screen. A canvas
   carries its width attribute as an intrinsic size, and sizeWave() sets that
   attribute to the strip's pixel width times the device ratio -- a number far
   larger than the strip itself. Without min-width:0 that intrinsic size becomes
   the flex item's automatic minimum, so the strip refuses to shrink when the
   window does. Zooming in shrinks the window in CSS pixels, the strip stays the
   width it was, and everything after it -- the text field, the mic button -- is
   pushed off the right edge. Worse, it latches: sizeWave() re-measures the
   element it has already inflated, so the strip never gets small again. */
#wave{flex:1;min-width:0;height:52px;display:block;opacity:.85}
.controls{display:flex;gap:7px}
.btn{font-family:inherit;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 14px;border-radius:8px;cursor:pointer;transition:.25s;
  border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.btn:hover{border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 20px hsla(var(--hue),100%,60%,.2)}
.btn.primary{border-color:hsla(var(--hue),90%,60%,.55);color:var(--accent)}
.btn.live{background:hsla(0,90%,60%,.15);border-color:hsla(0,90%,60%,.6);color:#ff7b7b}
.hint{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* ask input */
.ask{display:flex}
.ask input{font-family:inherit;font-size:11px;letter-spacing:.08em;color:var(--text);
  width:230px;padding:9px 12px;border-radius:8px;outline:none;user-select:text;
  border:1px solid var(--line);background:var(--panel);transition:.25s}
.ask input::placeholder{color:var(--muted)}
.ask input:focus{border-color:hsla(var(--hue),90%,60%,.55);color:var(--accent);
  box-shadow:0 0 18px hsla(var(--hue),100%,60%,.16)}

/* Two pieces of furniture only the phone layout has. They sit in the markup on
   every screen so nothing has to be built at runtime; the size comes from the
   phone breakpoint and from nowhere else. */
#sheetGrip,#btnTalk{display:none}

/* ---------- a short window ----------
   Triggered by browser zoom as much as by a small screen: zoom shrinks the page
   in CSS pixels, and everything the header and footer spend is spent before the
   stage gets anything. Past this point they say the same things in less height.
   Height only -- a wide, short window is still a desktop across. */
@media (max-height:640px){
  header{padding:9px 26px 5px}
  .brand h1{font-size:15px}
  .brand span{display:none}
  .clock .t{font-size:19px}
  .clock .d{font-size:8.5px}
  footer{padding:0 26px 10px}
  footer .hint{display:none}
}

@media(max-width:1100px){
  /* minmax(0,…) rather than 1fr: a plain 1fr track is floored at the width of the
     widest thing in it, and the status pills are a row that never wraps, so the
     grid was free to grow wider than the window and carry the footer's controls
     off the right-hand edge with it. */
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
  /* grid-column:1 on all three, not min-width alone. The header and the footer
     carry `grid-column:1/4` from the desktop layout, and against a one-column
     grid that spans two columns which do not exist -- so the browser makes them,
     and the stage, which asks for no column at all, was auto-placed into one:
     a strip of nothing beside the panels. The footer then took the row the stage
     should have had, and the text field floated in the middle of the window with
     the orb nowhere to be seen. */
  header,footer,main{grid-column:1;min-width:0}
  /* The panels take the height of their own content, and on a short window that
     is most of it. They keep what they need and the stage gets the rest. */
  aside:first-of-type{max-height:32dvh}
  /* Two things that say nothing the rest of the screen does not: the wordmark's
     subtitle, and a row of keyboard shortcuts on a layout this narrow. */
  .brand span{display:none}
  footer .hint{display:none}
  .pills{min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  aside:first-of-type{grid-row:2;flex-direction:row;padding-bottom:0;min-width:0}
  aside:last-of-type{display:none}
  :root{--orbSize:min(46vh,380px)}
  .ask input{width:130px}
}

/* ---------- phone ----------
   Everything past this line is inside one breakpoint, so a wider screen reads
   none of it and the layout above is the desktop's, unchanged. */
@media(max-width:720px),(max-height:520px) and (pointer:coarse){
  :root{--foot:64px;--grip:42px}

  /* A fixed element on iOS is the size of the *large* viewport, so inset:0 puts
     the footer underneath the address bar. dvh follows the visible one. */
  /* minmax(0,…) rather than 1fr: a plain 1fr floors the track at the widest
     thing inside it, and the status pills are a nowrap row that never ends.
     Without it the whole grid grows past the screen and the footer's button
     lands beyond the right edge. */
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    bottom:auto;height:100vh;height:100dvh}
  header,footer,main{grid-column:1;min-width:0}

  /* header: one line of identity, one scrolling line of status */
  header{flex-wrap:wrap;gap:6px 12px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
  .brand{order:1;flex:1;min-width:0}
  .brand h1{font-size:15px;letter-spacing:.3em}
  .brand span{display:none}
  .clock{order:2}
  .clock .t{font-size:19px}
  .clock .d{font-size:8px;letter-spacing:.14em}
  .pills{order:3;flex:0 0 100%;min-width:0;flex-wrap:nowrap;justify-content:flex-start;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    margin:0 -14px;padding:0 14px 2px}
  .pills::-webkit-scrollbar{display:none}
  /* a finger needs more than the 25px a pill is worth on a desktop */
  .pill,.mem-open,.tour-open{flex:0 0 auto;min-height:40px;padding:0 13px;
    display:flex;align-items:center}

  /* centre stage: the orb keeps the middle, the grip takes the bottom strip */
  main{padding-bottom:var(--grip)}
  #frame{display:none}
  :root{--orbSize:min(60vw,300px)}
  :root{--orbSize:min(60vw,42dvh)}
  #stateText{bottom:calc(var(--grip) + 8px)}
  #stateLabel{font-size:10px;letter-spacing:.34em}
  #liveText{font-size:15px;margin-top:10px;padding:0 16px}

  main.showing #orb{left:12px;bottom:calc(var(--grip) + 10px);width:76px;height:76px}
  main.showing #stateText{margin-left:0;padding-left:98px;text-align:left}
  main.showing #liveText{padding:0}
  main.showing.collapsed #liveText{padding:0 16px}
  #dispDock{left:12px;bottom:calc(var(--grip) + 10px);width:128px;height:86px}
  /* the desk ends above the orb in the corner: its bottom, its 76px, and a gap */
  #display{left:12px;right:12px;top:8px;--dispBottom:calc(var(--grip) + 98px)}

  /* A phone starts closer to the text size the screen already uses; the control
     is still there for anyone who wants more. */
  :root{--ds:1}
  #dispStage{width:100%;height:min(46dvh,var(--stageH,46dvh))}
  #dispStrip{--thumbW:128px;--thumbH:86px;gap:8px;inset:30px 0 0 0}
  .dcard{padding:14px 14px 12px}
  #dispStrip .dcard,#dispDock .dcard{padding:8px 9px;font-size:11px}
  #dispDock .dcard{width:100%;height:100%}
  #dispStrip .body,#dispDock .body{transform:scale(.4);width:250%;height:250%}
  .dclose{width:34px;height:34px;line-height:32px;top:7px;right:8px}

  /* the transcript as a sheet: parked above the footer, pulled up by its grip */
  aside:first-of-type{
    position:fixed;left:0;right:0;z-index:12;
    bottom:calc(var(--foot) + env(safe-area-inset-bottom));
    height:min(62dvh,520px);
    flex-direction:column;gap:8px;padding:0 12px 12px;
    background:linear-gradient(180deg,rgba(8,14,20,.9),rgba(5,9,14,.98));
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 -18px 50px -24px hsla(var(--hue),90%,40%,.7);
    transform:translateY(var(--sheet-y,calc(100% - var(--grip))));
    transition:transform .32s cubic-bezier(.22,.61,.36,1)}
  body.sheet-open aside:first-of-type{--sheet-y:0px}
  aside:first-of-type.dragging{transition:none}

  #sheetGrip{display:flex;align-items:center;justify-content:center;gap:9px;
    flex:0 0 var(--grip);width:100%;height:var(--grip);padding:0;
    font-family:inherit;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--muted);background:none;border:0;cursor:pointer;
    touch-action:none;-webkit-tap-highlight-color:transparent}
  #sheetGrip .bar{flex:0 0 38px;width:38px;height:3px;border-radius:3px;
    background:hsla(var(--hue),80%,60%,.45);transition:.25s}
  body.sheet-open #sheetGrip .bar{background:var(--accent);
    box-shadow:0 0 10px hsla(var(--hue),100%,60%,.7)}
  /* once it is up, the panel's own heading says the same word */
  body.sheet-open #sheetGrip .lab{display:none}

  .panel{padding:10px 12px}
  #logPanel{flex:1}
  #pipePanel{flex:0 0 auto}
  .msg{font-size:13px}

  /* footer: a field and a button, and nothing that needs a keyboard.
     It outranks the sheet on purpose: a parked sheet is only translated, so its
     lower half still lies across this strip and would swallow every tap meant
     for the button. An opaque footer on top both hides and outranks it. */
  footer{z-index:14;align-items:center;gap:10px;
    height:calc(var(--foot) + env(safe-area-inset-bottom));
    padding:0 12px env(safe-area-inset-bottom);
    background:linear-gradient(180deg,rgba(5,9,14,.94),rgba(4,7,12,1))}
  #wave,.hint,#btnMic{display:none}
  .ask{flex:1;min-width:0}
  /* under 16px iOS zooms the page in when the field takes focus */
  .ask input{width:100%;font-size:16px;padding:12px 14px}

  #btnTalk{display:grid;place-items:center;flex:0 0 54px;
    width:54px;height:54px;padding:0;border-radius:50%;
    border:1px solid hsla(var(--hue),90%,60%,.5);
    background:hsla(var(--hue),90%,55%,.12);color:var(--accent);
    touch-action:none;-webkit-tap-highlight-color:transparent;
    transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
  #btnTalk i{width:15px;height:22px;border-radius:8px;background:currentColor;
    box-shadow:0 0 14px hsla(var(--hue),100%,60%,.55)}
  #btnTalk.held{transform:scale(.94);color:#ff8f8f;
    background:hsla(0,90%,60%,.2);border-color:hsla(0,90%,60%,.7);
    box-shadow:0 0 30px hsla(0,90%,60%,.35)}
}

/* A phone on its side has about 390px of height, and the header above was
   about to take a quarter of it. */
@media(max-height:520px) and (pointer:coarse){
  :root{--foot:56px}
  header{gap:4px 10px;padding:calc(6px + env(safe-area-inset-top)) 14px 4px}
  .pill,.mem-open,.tour-open{min-height:34px}
  .clock .d{display:none}
  aside:first-of-type{height:min(78dvh,300px)}
  /* the state line sits a fixed distance off the bottom, so on a short screen the
     orb has to give way or the two of them share the same pixels */
  :root{--orbSize:min(46vw,30dvh)}
  #stateText{bottom:calc(var(--grip) + 4px)}
  #liveText{font-size:14px;margin-top:6px}
}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>

<div id="app">
  <header>
    <div class="brand">
      <h1>J.A.R.V.I.S</h1>
      <span id="brandSub">local pipeline</span>
    </div>
    <div class="pills">
      <div class="pill"><i class="dot off" id="dHa"></i>House <b id="haState">unknown</b></div>
      <div class="pill"><i class="dot off" id="dMic"></i>Mic <b id="micState">OFF</b></div>
      <div class="pill"><i class="dot off" id="dWs"></i>Brain <b id="wsState">offline</b></div>
      <div class="pill"><i class="dot off" id="dVoice"></i>Voice <b id="voiceState">local</b></div>
      <div class="pill">Latency <b id="lat">—</b></div>
      <div class="pill" id="planPill"><i class="dot off" id="dPlan"></i>Plan <b id="planState">—</b></div>
      <button class="pill lang-switch" id="langBtn" type="button" title="Switch language">Lang <b><span data-lang="en" class="on">EN</span>/<span data-lang="nl">NL</span></b></button>
    </div>
    <div class="clock"><div class="t" id="clockT">--:--</div><div class="d" id="clockD"></div></div>
  </header>

  <aside>
    <button id="sheetGrip" type="button" aria-expanded="false" aria-controls="logPanel">
      <span class="bar"></span><span class="lab">Conversation</span>
    </button>
    <div class="panel" id="logPanel" style="flex:1">
      <h2>Conversation <em id="turnCount">0 turns</em></h2>
      <div id="log"></div>
    </div>
    <div class="panel" id="pipePanel">
      <h2>Pipeline</h2>
      <div class="steps" id="steps">
        <div class="step" data-s="stt"><i>1</i>Speech → text<span class="ms"></span></div>
        <div class="step" data-s="llm"><i>2</i>Intent · Claude<span class="ms"></span></div>
        <div class="step" data-s="act"><i>3</i>Execute<span class="ms"></span></div>
        <div class="step" data-s="tts"><i>4</i>Text → speech<span class="ms"></span></div>
      </div>
    </div>
  </aside>

  <main>
    <div id="frame"><span></span><span></span><span></span><span></span></div>
    <canvas id="orb" title="click to switch between the orb and the windows"></canvas>
    <section id="display" aria-live="polite">
      <div id="dispZoom">
        <button id="dzOut" type="button" aria-label="smaller windows" title="smaller">&minus;</button>
        <b id="dzVal">100%</b>
        <button id="dzIn" type="button" aria-label="bigger windows" title="bigger">+</button>
      </div>
      <div id="dispStage"></div>
      <div id="dispStrip"></div>
    </section>
    <div id="dispDock" title="back to the windows"></div>
    <div id="stateText">
      <div id="stateLabel">standby</div>
      <div id="liveText"><span class="ghost">press space to talk, or type below</span></div>
    </div>
  </main>

  <aside>
    <div class="panel" id="contextPanel">
      <h2>Context</h2>
      <div id="ctxGroups"></div>
    </div>
    <div class="panel" id="systemPanel">
      <h2>System</h2>
      <div id="meters"></div>
    </div>
  </aside>

  <footer>
    <canvas id="wave"></canvas>
    <form class="ask" id="askForm" autocomplete="off">
      <input id="ask" type="text" placeholder="type a command…" spellcheck="false" aria-label="type a command">
    </form>
    <div class="controls">
      <button class="btn primary" id="btnMic">Enable mic</button>
      <button id="btnTalk" type="button" aria-label="hold to talk"><i></i></button>
    </div>
    <div class="hint">space = talk · enter = send · 1-4 = states</div>
  </footer>
</div>

<div id="vignette"></div><div id="scan"></div>

<script>
'use strict';

/* ============================== state ============================== */
const HUES = { idle:200, listening:190, thinking:275, speaking:165, error:0 };
const LABELS = { idle:'standby', listening:'listening', thinking:'processing', speaking:'responding', error:'error' };

const S = {
  mode:'idle',
  amp:0,          // smoothed 0..1 input level
  bins:new Float32Array(64),
  t:0,
  hue:HUES.idle,
  targetHue:HUES.idle,
  turns:0,
  micOn:false
};

const $ = s => document.querySelector(s);
const lerp=(a,b,n)=>a+(b-a)*n;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// HTML escape for SVG/innerHTML builders. Must stay above renderWeather / restoreStickyDesk:
// those run at load and used to hit a TDZ when esc lived next to the websocket helpers.
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Spoken language. Declared early because restoreStickyDesk may render weather
// before the speech block below runs; a late let made renderWeather hit a TDZ
// on `typeof speechLang` (typeof does not protect let/const in the same scope).
let speechLang='en', speechTag='en-GB';

function setMode(m){
  if(S.mode===m) return;
  S.mode=m;
  S.targetHue=HUES[m];
  $('#stateLabel').textContent=LABELS[m];
}

/* ============================== audio ============================== */
let actx=null, analyser=null, freq=null, stream=null;

async function enableMic(){
  if(S.micOn) return true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(stream);
    analyser = actx.createAnalyser();
    analyser.fftSize=512;
    analyser.smoothingTimeConstant=0.72;
    src.connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    S.micOn=true;
    $('#dMic').className='dot';
    $('#micState').textContent='LIVE';
    $('#btnMic').textContent='Mic active';
    $('#btnMic').classList.add('live');
    sys('microphone stream acquired — '+(actx.sampleRate/1000).toFixed(1)+' kHz');
    return true;
  }catch(e){
    sys('mic geweigerd — visuals draaien op gesimuleerd signaal');
    return false;
  }
}

function readAudio(){
  if(!analyser){
    // simulated signal so the visuals still look alive without a mic
    const base = S.mode==='listening'?0.42 : S.mode==='speaking'?0.55 : 0.06;
    const n = (Math.sin(S.t*3.1)*0.5+Math.sin(S.t*7.7)*0.3+Math.sin(S.t*13.3)*0.2);
    const v = clamp(base*(0.55+0.45*n) + (S.mode==='thinking'?0.10:0), 0, 1);
    S.amp = lerp(S.amp, v, 0.15);
    for(let i=0;i<64;i++){
      const f = Math.sin(S.t*(2+i*0.11)+i)*0.5+0.5;
      S.bins[i]=lerp(S.bins[i], S.amp*f*(1-i/110), 0.2);
    }
    return;
  }
  analyser.getByteFrequencyData(freq);
  let sum=0;
  const N=freq.length;
  for(let i=0;i<64;i++){
    // log-ish bucketing across the useful range
    const lo = Math.floor(Math.pow(i/64,1.7)*N*0.7);
    const hi = Math.max(lo+1, Math.floor(Math.pow((i+1)/64,1.7)*N*0.7));
    let m=0; for(let j=lo;j<hi;j++) m=Math.max(m,freq[j]);
    const v=m/255;
    S.bins[i]=lerp(S.bins[i], v, 0.35);
    sum+=v;
  }
  const level = clamp((sum/64)*2.1, 0, 1);
  S.amp = lerp(S.amp, level, level>S.amp?0.45:0.09);
}

/* ============================== display surface ============================== */
/* Content the assistant pushes to the screen. The orb stays alive in the corner,
   so you can still see what he is doing while you look at what he showed. */
const dispEl = $('#display'), dispStage = $('#dispStage'), dispStrip = $('#dispStrip');
const dispDock = $('#dispDock'), mainEl = document.querySelector('main');
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)');
/* How long a window is read before the next one may step it down, and how long
   it lies on the desk before the next goes up. The first is what makes "shown,
   then put down, then the next" a sequence rather than a shuffle when two
   answers arrive in the same breath; the second is the beat in which the eye
   sees where it landed. */
const DWELL_MS = 900, SETTLE_MS = 160;

/* Cards live in three places -- the stage, the strip under it, and the corner
   dock the folded-away view leaves behind -- so anything counting them has to
   look in all three. */
function allCards(){
  return [...dispStage.children, ...dispStrip.children, ...dispDock.children]
    .filter(n => n.classList.contains('dcard'));
}

/* Closing a window throws away the only copy of what was in it, which is exactly
   when you notice you wanted it. The brain keeps the contents, so telling it
   which one went is enough to be able to ask for it back in words. */
function noteClosed(card, reason){
  const id = card && card._d && card._d.id;
  if(!id || !connOk()) return;
  try{ ws.send(JSON.stringify({kind:'display_closed', id, reason})); }catch(e){}
}

function dropCard(card, reason){
  if(!card) return;
  if(card.classList.contains('dslot')){         // the gap a raised window left: it will not go back
    if(card._for) card._for._slot=null;
    card.remove();
    return;
  }
  if(card._slot) card._slot.remove();
  clearTimeout(card._d.timer);
  clearInterval(card._d.refresh);
  const wasDocked = card.parentElement===dispDock;
  noteClosed(card, reason||'closed');
  card.remove();
  if(!allCards().length){
    mainEl.classList.remove('showing','collapsed');
    // the canvas backing store follows the element size, so re-fit once it settled
    setTimeout(sizeOrb, 520);
    return;
  }
  // Losing the docked card leaves the fold with nothing to point at, so the
  // fold is undone. Losing the one on the stage leaves the desk, at full
  // brightness: that is the overview, and any thumbnail is a click from full size.
  if(wasDocked) mainEl.classList.remove('collapsed');
  setTimeout(sizeOrb, 520);
}

function clearDisplay(id, reason){
  for(const card of allCards()) if(!id || card._d.id===id) dropCard(card, reason);
}

/** Clears anything that was only meant to live until the next question. */
let dispGen=0;                                 // which question the desk belongs to
function clearTransientDisplay(){
  dispGen++;                                   // whatever is still on its way up belongs to the last one
  dropDisplays();
  // Sticky desk windows survive the next question: they are the standing set
  // (weather, agenda, mail, PRs, notes), not a one-shot answer.
  for(const card of allCards()) if(card._d.untilNextTurn && !card._d.sticky) dropCard(card,'next-turn');
}

function renderImage(p){
  const wrap=document.createElement('div');
  const img=document.createElement('img');
  img.alt=p.alt||'';
  img.src=p.url;
  img.onerror=()=>{
    const f=document.createElement('div');
    f.className='fallback';
    f.textContent='image unavailable';
    wrap.replaceChildren(f);
  };
  wrap.appendChild(img);
  if(p.caption){
    const c=document.createElement('div');
    c.className='cap'; c.textContent=p.caption;
    wrap.appendChild(c);
  }
  return {node:wrap, title:p.alt||'image', after:()=>{
    if(!p.refreshMs) return null;
    // a camera: same source, fresh bytes
    return setInterval(()=>{
      const u=new URL(p.url, location.origin);
      u.searchParams.set('_', Date.now());
      img.src=u.pathname+u.search;
    }, Math.max(1000,p.refreshMs));
  }};
}

/* Which row of a dated list is today's.
   A table with one row per night -- what the nightly pass over the notes read
   -- has exactly one row that is about now, and that is the row the eye wants
   first. Whoever built the panel wrote the label, so this reads the shapes a
   date gets written in rather than demanding one of them. */
const MONTHS={jan:1,feb:2,mrt:3,maa:3,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,
              aug:8,sep:9,okt:10,oct:10,nov:11,dec:12};
function isToday(label){
  const s=String(label||'').toLowerCase().trim();
  if(!s) return false;
  if(/\b(vandaag|vannacht|today|tonight)\b/.test(s)) return true;
  const now=new Date(), d=now.getDate(), mo=now.getMonth()+1, y=now.getFullYear();
  if(s.includes(y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'))) return true;
  let m=s.match(/\b(\d{1,2})[-\/.](\d{1,2})(?:[-\/.](\d{2,4}))?\b/);
  if(m && +m[1]===d && +m[2]===mo && (!m[3] || +m[3]===y || +m[3]===y%100)) return true;
  m=s.match(/\b(\d{1,2})\s*([a-z]{3,})\.?/);
  if(m && +m[1]===d && MONTHS[m[2].slice(0,3)]===mo) return true;
  m=s.match(/\b([a-z]{3,})\.?\s*(\d{1,2})\b/);
  if(m && +m[2]===d && MONTHS[m[1].slice(0,3)]===mo) return true;
  return false;
}

/* Lighting a row, on the one clock the whole screen uses: five breaths, then
   out slowly. Both callers want exactly this -- the row he has just reached,
   and today's row of a dated table -- and a second copy of the timing was how
   today's row ended up staying lit for the rest of the conversation.

   One row at a time. Things can follow each other faster than five breaths --
   three agenda entries in one sentence -- and three rows blinking together say
   "look here" three times over. The row that was lit hands the gold on and
   leaves in a blink, so what is blinking is always what he is saying now. */
let litRow=null;                               // {tr,timers} of the row lit now

function cutRow(){
  if(!litRow) return;
  const {tr,timers}=litRow; litRow=null;
  for(const t of timers) clearTimeout(t);
  tr.classList.remove('pulsing');
  tr.classList.add('fading','cut');
  // Held on the row rather than in a local, because the row may be lit again
  // before it finishes leaving -- and an unclaimed timer then strips the gold
  // off it half a second into its new turn.
  tr._cut=setTimeout(()=>tr.classList.remove('hot','fading','cut'), CTX_CUT_MS);
}

function lightRow(tr){
  cutRow();                                    // only one gold row on the screen
  clearTimeout(tr._cut);                       // it is back before it had left
  tr.dataset.lit='1';                          // it had its turn; never again
  tr.classList.remove('fading','cut');
  tr.classList.add('hot','pulsing');
  const timers=[
    setTimeout(()=>tr.classList.remove('pulsing'), ROW_PULSE_MS),
    setTimeout(()=>{
      litRow=null;                             // its turn is over; nothing to cut
      tr.classList.add('fading');
      setTimeout(()=>tr.classList.remove('hot','fading'), CTX_FADE_MS);
    }, CTX_GLOW_MS)
  ];
  litRow={tr,timers};
}

function agendaDateHeading(p){
  // Packs may send an explicit date; otherwise today's agenda rows are times
  // only (the day is implied), so the window itself names the day.
  if(p && typeof p.date==='string' && p.date.trim()) return p.date.trim();
  const loc=(typeof speechLang==='string' && speechLang.startsWith('nl')) ? 'nl-NL' : 'en-GB';
  try{
    return new Intl.DateTimeFormat(loc,{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  }catch(e){
    return new Date().toDateString();
  }
}

function renderPanel(p){
  const table=document.createElement('table');
  // A quiet list is one where every row is being talked about, so lighting them
  // one by one says nothing. It keeps no rows for markRows either: no row of it
  // can be the row he has reached, and none of them may hold the reveal back.
  const quiet=p.quiet===true;
  // The rows travel back with the node: a list of twelve mails is only useful
  // if the one he is talking about can be picked out of it, and that needs the
  // row element next to the words it was built from.
  const rows=[], subjects=[];
  for(const row of p.rows||[]){
    const tr=document.createElement('tr');
    const k=document.createElement('td'); k.className='k'; k.textContent=row.label;
    const v=document.createElement('td'); v.className='v'; v.textContent=row.value;
    if(row.hint){ const s=document.createElement('small'); s.textContent=row.hint; v.appendChild(s); }
    // Marked by the assistant: out of a list of mails, these are the ones he
    // judged to want an answer. A standing mark, not an arrival.
    if(row.mark) tr.classList.add('flag');
    tr.append(k,v); table.appendChild(tr);
    // Today is lit the moment the list goes up, rather than waiting for a word:
    // it is not news arriving halfway through a sentence, it is where you are
    // in the list. It counts the same five breaths as everything else.
    if(!quiet && isToday(row.label)) lightRow(tr);
    const subject=[row.label,row.value].join(' ');
    subjects.push(subject);                    // quiet or not: a word said about it is about it
    if(!quiet) rows.push({tr, subject});
  }
  const topic=stickyTopicOf(p) || windowTopic(p.title||'');
  let node=table;
  // Agenda rows for today are clock times with no day; name the day above them.
  if(topic==='agenda'){
    const wrap=document.createElement('div');
    const heading=document.createElement('div');
    heading.className='agenda-date';
    heading.textContent=agendaDateHeading(p);
    wrap.append(heading, table);
    node=wrap;
  }
  return {node, title:p.title||'overview', rows, subjects, ordered:p.ordered===true};
}

function renderChart(p){
  const pts=(p.points||[]).filter(x=>Number.isFinite(x.value));
  if(pts.length<2) return {node:Object.assign(document.createElement('div'),
    {className:'fallback',textContent:'not enough data points'}), title:p.title||'trend'};

  const W=640,H=260,L=44,R=12,T=14,B=26;
  const vals=pts.map(x=>x.value);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(lo===hi){ lo-=1; hi+=1; }
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const x=i=>L+(W-L-R)*(i/(pts.length-1));
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));

  const line=pts.map((pt,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(pt.value).toFixed(1)}`).join(' ');
  const area=`${line} L${x(pts.length-1).toFixed(1)},${(H-B).toFixed(1)} L${x(0).toFixed(1)},${(H-B).toFixed(1)} Z`;
  const unit=p.unit?' '+p.unit:'';
  const fmt=v=>(Math.abs(v)>=100?Math.round(v):Math.round(v*10)/10).toLocaleString('nl-NL');
  const last=pts[pts.length-1];

  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label',`${p.title||'trend'}: van ${fmt(pts[0].value)}${unit} naar ${fmt(last.value)}${unit}`);
  svg.innerHTML =
    `<path class="area" d="${area}"/>`+
    `<path class="line" d="${line}"/>`+
    `<circle class="dot" cx="${x(pts.length-1).toFixed(1)}" cy="${y(last.value).toFixed(1)}" r="3.5"/>`+
    `<line class="axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>`+
    `<text x="4" y="${(y(hi-pad)+4).toFixed(1)}">${esc(fmt(hi-pad)+unit)}</text>`+
    `<text x="4" y="${(y(lo+pad)+4).toFixed(1)}">${esc(fmt(lo+pad)+unit)}</text>`+
    `<text x="${L}" y="${H-8}">${esc(pts[0].label??'')}</text>`+
    `<text x="${W-R}" y="${H-8}" text-anchor="end">${esc(last.label??'')}</text>`;
  return {node:svg, title:p.title||'trend'};
}

/* ---- weather ----
   Home Assistant's condition enum, drawn. Every icon is the same 64x64 box, so a
   day in the strip and the sky over the card are the same picture at two sizes.
   Anything the enum does not cover is a cloud: a provider that invents a
   condition is read out by the assistant, and a plain cloud is a better picture
   of "we do not know" than a question mark. */
const WX_CLOUD='M18 46 H44 A9 9 0 0 0 44 28 A13 13 0 0 0 22 32 A8 8 0 0 0 18 46 Z';
function wxSun(cx,cy,r){
  let out=`<circle class="sun" cx="${cx}" cy="${cy}" r="${r}"/>`;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, x1=cx+Math.cos(a)*(r+4), y1=cy+Math.sin(a)*(r+4),
          x2=cx+Math.cos(a)*(r+9), y2=cy+Math.sin(a)*(r+9);
    out+=`<line class="ray" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  return out;
}
function wxDrops(xs,long){
  return xs.map(x=>`<line class="drop" x1="${x}" y1="50" x2="${x-3}" y2="${long?60:57}"/>`).join('');
}
function wxFlakes(xs){
  return xs.map(x=>`<circle class="flake" cx="${x}" cy="55" r="2.2"/>`).join('');
}
const WX_ICONS={
  'sunny':()=>wxSun(32,32,11),
  'clear-night':()=>'<path class="moon" d="M40 12 A20 20 0 1 0 52 44 A15 15 0 0 1 40 12 Z"/>',
  'partlycloudy':()=>wxSun(42,22,8)+`<path class="cloud" d="${WX_CLOUD}" transform="translate(-4 4) scale(.92)"/>`,
  'cloudy':()=>`<path class="cloud" d="${WX_CLOUD}"/>`,
  'rainy':()=>`<path class="cloud" d="${WX_CLOUD}" transform="translate(0 -6)"/>`+wxDrops([26,34,42]),
  'pouring':()=>`<path class="cloud dark" d="${WX_CLOUD}" transform="translate(0 -6)"/>`+wxDrops([22,29,36,43],true),
  'lightning':()=>`<path class="cloud dark" d="${WX_CLOUD}" transform="translate(0 -8)"/>`+
                  '<path class="bolt" d="M35 36 L27 50 L33 50 L29 62 L41 44 L35 44 L39 36 Z"/>',
  'lightning-rainy':()=>`<path class="cloud dark" d="${WX_CLOUD}" transform="translate(0 -8)"/>`+
                  wxDrops([22,44])+'<path class="bolt" d="M35 36 L27 50 L33 50 L29 62 L41 44 L35 44 L39 36 Z"/>',
  'snowy':()=>`<path class="cloud" d="${WX_CLOUD}" transform="translate(0 -6)"/>`+wxFlakes([25,33,41]),
  'snowy-rainy':()=>`<path class="cloud" d="${WX_CLOUD}" transform="translate(0 -6)"/>`+wxDrops([26,42])+wxFlakes([34]),
  'hail':()=>`<path class="cloud dark" d="${WX_CLOUD}" transform="translate(0 -6)"/>`+
             [24,32,40].map(x=>`<circle class="flake" cx="${x}" cy="56" r="2.6"/>`).join(''),
  'fog':()=>`<path class="cloud" d="${WX_CLOUD}" transform="translate(0 -10)"/>`+
            '<line class="fogline" x1="16" y1="48" x2="48" y2="48"/><line class="fogline" x1="22" y1="55" x2="42" y2="55"/>',
  'windy':()=>'<path class="gust" d="M8 24 H38 A5 5 0 1 0 33 19"/><path class="gust" d="M8 34 H48 A5 5 0 1 1 43 39"/>'+
              '<path class="gust" d="M14 44 H34 A4 4 0 1 0 30 40"/>',
  'windy-variant':()=>`<path class="cloud" d="${WX_CLOUD}" transform="translate(4 -8) scale(.85)"/>`+
              '<path class="gust" d="M6 46 H36 A5 5 0 1 1 31 51"/><path class="gust" d="M12 56 H28 A4 4 0 1 0 24 52"/>',
  'exceptional':()=>'<path class="warn" d="M32 10 L56 52 H8 Z"/><line class="drop" x1="32" y1="26" x2="32" y2="38"/>'+
                   '<circle class="flake" cx="32" cy="45" r="2"/>'
};
function wxIcon(condition, cls){
  const draw=WX_ICONS[String(condition||'').toLowerCase()]||WX_ICONS.cloudy;
  return `<svg class="${cls||'ico'}" viewBox="0 0 64 64" aria-hidden="true">${draw()}</svg>`;
}
const WX_DROP_ICO='<svg viewBox="0 0 24 24" aria-hidden="true"><path class="dropico" d="M12 2 C12 2 5 10.5 5 15 A7 7 0 0 0 19 15 C19 10.5 12 2 12 2 Z"/></svg>';
function wxArrowIco(bearing){
  // the arrow flies with the wind: a bearing is where it comes from
  const rot=Number.isFinite(bearing) ? ((bearing+180)%360) : 0;
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><path class="arrow" d="M32 56 V12 M20 24 L32 12 L44 24" transform="rotate(${rot} 32 32)"/></svg>`;
}
const wxNum=v=>Number.isFinite(v) ? Math.round(v).toLocaleString('nl-NL') : null;

/* The gradients every weather picture refers to, once, in the page. An inline
   SVG can use a gradient defined in any other inline SVG of the same document,
   so the icons and the scene share these rather than each carrying a copy. */
document.body.insertAdjacentHTML('beforeend',
  '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'+
  '<radialGradient id="wxSunG"><stop offset="0" stop-color="#fff8dc"/><stop offset=".5" stop-color="#ffd767"/><stop offset="1" stop-color="#f5a623"/></radialGradient>'+
  '<radialGradient id="wxSunGlowG"><stop offset="0" stop-color="#ffd767" stop-opacity=".9"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>'+
  '<radialGradient id="wxMoonG"><stop offset="0" stop-color="#fffdf2"/><stop offset="1" stop-color="#d8d3b6"/></radialGradient>'+
  '<radialGradient id="wxMoonGlowG"><stop offset="0" stop-color="#e8e4c8" stop-opacity=".7"/><stop offset=".5" stop-color="#c9d3ff" stop-opacity=".2"/><stop offset="1" stop-color="#c9d3ff" stop-opacity="0"/></radialGradient>'+
  '<linearGradient id="wxCloudG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b7c6d8"/></linearGradient>'+
  '<linearGradient id="wxCloudDarkG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93a5bb"/><stop offset="1" stop-color="#4f6078"/></linearGradient>'+
  '<linearGradient id="wxGroundG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/></linearGradient>'+
  '</defs></svg>');

/* The sky over the card: what the condition looks like, moving.
   A 400x280 picture laid over the whole card and cropped to it, the sun or the
   moon at the left where the temperature is not, the clouds across the upper
   half, the weather falling out of them. Every element is a class the
   stylesheet animates; a reduced-motion setting stills them all. */
const WX_CLOUD_BIG='M22 52 H84 A14 14 0 0 0 86 24 A21 21 0 0 0 47 14 A17 17 0 0 0 18 26 A13 13 0 0 0 22 52 Z';
function sceneCloud(x,y,scale,dark,dur,delay){
  return `<g class="cloud${dark?' dark':''}" style="--d:${dur}s;animation-delay:${delay}s">`+
    `<path d="${WX_CLOUD_BIG}" transform="translate(${x} ${y}) scale(${scale})"/></g>`;
}
function sceneRain(count, hard){
  let out='<g class="rain">';
  for(let i=0;i<count;i++){
    const x=112+i*(hard?9:14)+(i%2)*4, y=98+(i%3)*6;
    out+=`<line class="drop${hard?' hard':''}" style="animation-delay:${(-(i*0.17)%1.1).toFixed(2)}s" x1="${x}" y1="${y}" x2="${x-4}" y2="${y+14}"/>`;
  }
  return out+'</g>';
}
function sceneSnow(count, hail){
  let out='<g class="snow">';
  for(let i=0;i<count;i++){
    const x=118+i*13+(i%2)*5, y=100+(i%3)*8;
    out+=`<circle class="flake${hail?' hail':''}" style="animation-delay:${(-(i*0.53)%4.2).toFixed(2)}s" cx="${x}" cy="${y}" r="${hail?3.2:2.6}"/>`;
  }
  return out+'</g>';
}
function sceneStars(){
  let out='<g class="stars">';
  for(let i=0;i<22;i++){
    const x=(i*167+41)%400, y=(i*89+13)%96+4, r=0.9+(i%3)*0.5;
    out+=`<circle class="star" style="--d:${(2.4+(i%5)*0.6).toFixed(1)}s;animation-delay:${(-(i*0.7)%4).toFixed(1)}s" cx="${x}" cy="${y}" r="${r}"/>`;
  }
  return out+'</g>';
}
function sceneSun(){
  let rays='';
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6, x1=100+Math.cos(a)*36, y1=58+Math.sin(a)*36, x2=100+Math.cos(a)*45, y2=58+Math.sin(a)*45;
    rays+=`<line class="ray" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  return `<g class="sun-g"><circle class="glow" cx="100" cy="58" r="64"/><g class="rays">${rays}</g><circle class="sun" cx="100" cy="58" r="27"/></g>`;
}
function sceneMoon(){
  return '<g class="moon-g"><circle class="glow moon" cx="104" cy="58" r="56"/>'+
    '<path class="moon" d="M112 28 A30 30 0 1 0 129 80 A23 23 0 0 1 112 28 Z"/></g>';
}
function wxScene(condition, night){
  const c=String(condition||'').toLowerCase();
  const clear=c==='sunny'||c==='clear-night';
  const partly=c==='partlycloudy';
  const dark=/pouring|lightning|hail/.test(c);
  let out='';
  if(night) out+=sceneStars();
  if(clear||partly) out+= night?sceneMoon():sceneSun();
  if(partly){
    out+=sceneCloud(120,56,.95,false,20,-6);
  }else if(!clear && c!=='windy' && c!=='exceptional'){
    out+=sceneCloud(206,18,.7,dark,18,-4)+sceneCloud(104,46,1.05,dark,23,-11);
    if(c==='cloudy'||c==='fog') out+=sceneCloud(258,66,.55,false,15,-2);
  }
  if(/rainy|pouring|snowy-rainy/.test(c) && c!=='snowy') out+=sceneRain(c==='pouring'?16:9, c==='pouring');
  if(/^snowy|hail/.test(c)) out+=sceneSnow(c==='hail'?7:9, c==='hail');
  if(/lightning/.test(c)) out+='<path class="bolt" d="M168 100 L154 132 L166 132 L156 160 L182 122 L170 122 L180 100 Z"/>';
  if(c==='fog'){
    for(let i=0;i<3;i++) out+=`<line class="fogline fog" style="--d:${7+i*1.5}s;animation-delay:${-i*2}s" x1="${70+i*20}" y1="${104+i*14}" x2="${300-i*25}" y2="${104+i*14}"/>`;
  }
  if(/windy/.test(c)){
    for(let i=0;i<3;i++) out+=`<path class="gust" style="--d:${3.2+i*.5}s;animation-delay:${-i*1.1}s" d="M${60+i*30} ${40+i*24} H${150+i*30} A7 7 0 1 ${i%2} ${143+i*30} ${33+i*24}"/>`;
  }
  if(c==='exceptional') out+='<g class="warn-g"><path class="warn" d="M100 22 L145 100 H55 Z"/><line class="drop" x1="100" y1="48" x2="100" y2="72"/><circle class="flake" cx="100" cy="86" r="3"/></g>';
  out+='<rect class="ground" x="0" y="200" width="400" height="80"/>';
  return `<svg class="wx-scene" viewBox="0 0 400 280" preserveAspectRatio="xMidYMin slice" aria-hidden="true">${out}</svg>`;
}

/* Which sky the condition is under, and whether it is night here. Night is
   read off the sun's clocks when the card has them, off the hour when not. */
function wxSky(c, night){
  if(/lightning/.test(c)) return 'storm';
  if(/rainy|pouring|hail/.test(c)) return 'rain';
  if(/^snowy/.test(c)) return 'snow';
  if(c==='cloudy'||c==='fog'||/^windy/.test(c)) return 'grey';
  return night?'night':'day';
}
function wxNight(sun, condition){
  if(condition==='clear-night') return true;
  const now=new Date(), m=now.getHours()*60+now.getMinutes();
  const at=t=>{ const x=/^(\d{1,2}):(\d{2})/.exec(t||''); return x ? (+x[1])*60+(+x[2]) : null; };
  const rise=at(sun&&sun.rise), set=at(sun&&sun.set);
  if(rise!==null && set!==null) return m<rise || m>set;
  return m<6*60 || m>21*60;
}

/* The sun coming up or going down: half a sun on the horizon, and which way it
   is going. The two clocks on the weather card. */
function wxSunIco(up){
  return '<svg viewBox="0 0 64 64" aria-hidden="true">'+
    '<path class="sunhalf" d="M17 40 A15 15 0 0 1 47 40 Z"/>'+
    '<line class="ray" x1="32" y1="14" x2="32" y2="20"/><line class="ray" x1="14" y1="22" x2="18.5" y2="26.5"/>'+
    '<line class="ray" x1="50" y1="22" x2="45.5" y2="26.5"/>'+
    '<line class="horizon" x1="6" y1="44" x2="58" y2="44"/>'+
    (up ? '<path class="sunway" d="M32 60 V50 M26.5 55.5 L32 50 L37.5 55.5"/>'
        : '<path class="sunway" d="M32 50 V60 M26.5 54.5 L32 60 L37.5 54.5"/>')+
    '</svg>';
}

/* A tile along the bottom: a day after today, or an hour of today when the
   provider has no days after today to show. */
function wxTile(label, condition, big, small){
  return `<div class="wx-tile"><span class="d">${esc(label||'')}</span>${wxIcon(condition)}`+
    `${big!==null?`<b>${big}</b>`:''}${small?`<small>${small}</small>`:''}</div>`;
}

function renderWeather(p){
  const days=Array.isArray(p.days)?p.days:[];
  const today=days[0];
  const wrap=document.createElement('div'); wrap.className='wx';
  if(!today){
    wrap.className='fallback'; wrap.textContent='no forecast';
    return {node:wrap, title:p.title||'weather'};
  }
  const units=p.units||{}, unit=units.temperature||'°';
  // "14°" on the card, the way a weather app writes it; the letter is on the tiles' unit only
  // when the unit has no degree sign to stand in for it.
  const deg=esc(unit.includes('°') ? '°' : unit);
  const now=p.now||{};
  const condition=now.condition||today.condition;
  const summary=now.summary||today.summary||condition||'';
  const temp=wxNum(Number.isFinite(now.temperature)?now.temperature:today.high);
  const hi=wxNum(today.high), lo=wxNum(today.low);
  const en=speechLang==='en';
  const words=en?{high:'high',low:'low'}:{high:'hoog',low:'laag'};
  const night=wxNight(p.sun, String(condition||'').toLowerCase());
  const sky=wxSky(String(condition||'').toLowerCase(), night);
  wrap.dataset.sky=sky;
  if(night) wrap.dataset.night='1';

  let html=wxScene(condition, night)+
    `<div class="wx-hero"><div class="wx-tempbox">`+
    `${temp!==null?`<span class="wx-temp">${temp}${deg}</span>`:''}`+
    `${summary?`<div class="wx-cond" title="${esc(summary)}">${esc(summary)}</div>`:''}</div></div>`;
  const range=[];
  if(hi!==null) range.push(`<span>${words.high}<b>${hi}${deg}</b></span>`);
  if(lo!==null) range.push(`<span>${words.low}<b>${lo}${deg}</b></span>`);
  if(range.length) html+=`<div class="wx-range">${range.join('')}</div>`;

  const meta=[];
  const sun=p.sun||{};
  if(sun.rise) meta.push(`<span>${wxSunIco(true)}${esc(sun.rise)}</span>`);
  if(sun.set) meta.push(`<span>${wxSunIco(false)}${esc(sun.set)}</span>`);
  if(Number.isFinite(today.precipitationChance)){
    const c=Math.round(today.precipitationChance);
    meta.push(`<span class="${c>=50?'on':''}">${WX_DROP_ICO}${c} %</span>`);
  }else if(Number.isFinite(today.precipitation)){
    meta.push(`<span class="${today.precipitation>=1?'on':''}">${WX_DROP_ICO}${esc(String(today.precipitation))} ${esc(units.precipitation||'mm')}</span>`);
  }
  if(Number.isFinite(today.windSpeed)||today.windDirection){
    const speed=Number.isFinite(today.windSpeed)?`${wxNum(today.windSpeed)} ${esc(units.windSpeed||'')}`:'';
    meta.push(`<span>${wxArrowIco(today.windBearing)}${[speed,esc(today.windDirection||'')].filter(Boolean).join(' ')}</span>`);
  }
  if(meta.length) html+=`<div class="wx-meta">${meta.join('')}</div>`;

  // The days after today; failing those, today by the hour, five of them spread
  // over what is left of the day.
  let tiles='';
  if(days.length>1){
    tiles=days.slice(1,6).map(d=>wxTile(d.label, d.condition, wxNum(d.high)!==null?wxNum(d.high)+deg:null,
      wxNum(d.low)!==null?wxNum(d.low)+deg:'')).join('');
  }else if(Array.isArray(p.hours) && p.hours.length){
    const hours=p.hours, step=Math.max(1,Math.ceil(hours.length/5));
    tiles=hours.filter((h,i)=>i%step===0).slice(0,5).map(h=>{
      const rain=Number.isFinite(h.precipitationChance)?`${Math.round(h.precipitationChance)} %`
               : Number.isFinite(h.precipitation)&&h.precipitation>0?`${esc(String(h.precipitation))} ${esc(units.precipitation||'mm')}`:'';
      return wxTile(h.label, h.condition, wxNum(h.temperature)!==null?wxNum(h.temperature)+deg:null, rain);
    }).join('');
  }
  if(tiles) html+=`<div class="wx-tiles">${tiles}</div>`;
  wrap.innerHTML=html;
  return {node:wrap, title:p.title||'weather'};
}

function renderNote(p){
  const d=document.createElement('div');
  d.className='note'; d.textContent=p.body||'';
  return {node:d, title:p.title||'note'};
}

/* Move a card between the stage, the strip and the dock, travelling from where
   it was to where it lands: measure, move, put it back with a transform, then
   let go. `from` may be passed in for the one case where the move and the
   measurement cannot happen in that order: folding the windows away hides the
