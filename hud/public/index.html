   stage, so where the card *was* has to be read before the class goes on. */
function glide(card, into, from, replacing, before){
  from = from || card.getBoundingClientRect();
  if(replacing && replacing.parentElement===into) into.replaceChild(card, replacing);
  else if(before && before.parentElement===into) into.insertBefore(card, before);
  else into.appendChild(card);
  if(REDUCED.matches) return Promise.resolve();
  const to=card.getBoundingClientRect();
  if(!to.width || !to.height) return Promise.resolve();
  card.style.transition='none';
  card.style.transformOrigin='top left';
  card.style.transform='translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) '+
                       'scale('+(from.width/to.width)+','+(from.height/to.height)+')';
  // Settled when the transform has run its course, or a little after it should
  // have: a card removed mid-flight fires no transitionend, and nothing may wait
  // on it for ever.
  return new Promise(resolve=>{
    let done=false;
    const land=e=>{
      if(e && (e.target!==card || e.propertyName!=='transform')) return;   // a row's glow, not the flight
      if(done) return; done=true; card.removeEventListener('transitionend',land); resolve();
    };
    card.addEventListener('transitionend', land);
    setTimeout(land, 520);
    // A forced layout between the two writes is what makes the second one a
    // flight rather than a jump: the card is measured standing where it came
    // from before it is told to go. A frame callback would do the same, and
    // does not come on a screen that is not drawing frames.
    void card.offsetWidth;
    card.style.transition='transform .42s cubic-bezier(.22,.61,.36,1)';
    card.style.transform='';
  });
}

function makeCard(m, r){
  const card=document.createElement('article');
  card.className='dcard';
  card.tabIndex=0;
  const stickyPreview=stickyTopicOf(m.payload);
  // Sticky desk windows have no close control: they are furniture, and a
  // mis-tap used to wipe the only copy of today's weather.
  const minimize=document.createElement('button');
  minimize.type='button'; minimize.className='dmin'; minimize.title='minimize';
  minimize.setAttribute('aria-label','minimize'); minimize.textContent='-';
  minimize.addEventListener('click', e=>{ e.stopPropagation(); minimizeCard(card); });
  const h=document.createElement('h3'); h.textContent=r.title;
  const body=document.createElement('div'); body.className='body';
  body.appendChild(r.node);
  if(!stickyPreview){
    const close=document.createElement('button');
    close.type='button'; close.className='dclose'; close.title='close';
    close.setAttribute('aria-label','close'); close.textContent='\u00d7';
    close.addEventListener('click', e=>{ e.stopPropagation(); dropCard(card,'closed'); });
    card.append(close);
  }
  card.append(minimize,h,body);
  card.addEventListener('click', ()=>{
    if(card.parentElement===dispDock) expandDisplay();
    else if(card.parentElement===dispStrip) promote(card);
  });
  const dismiss=m.dismiss||{mode:'next-turn'};
  // What the sentence could be about. Empty for anything that is not a list.
  card._rows = r.rows || [];
  // Every row's words, lit or not, quiet or not: what a sentence that names one
  // of them is about, which is what keeps another window's word from counting.
  card._subjects = r.subjects || card._rows.map(row=>row.subject);
  // The rows are in the order they will be spoken about, so the gold walks.
  card._ordered = r.ordered===true;
  card._d={
    id:m.id,
    type:m.payload.type,
    title:String(m.payload.title||'').trim().toLowerCase(),
    shownAt: performance.now(),
    untilNextTurn: dismiss.mode==='next-turn',
    timer: dismiss.mode==='timeout'
      ? setTimeout(()=>dropCard(card,'timeout'), Math.max(2000, dismiss.ms||30000))
      : null,
    refresh: r.after ? r.after() : null
  };
  return card;
}

/** Keep this window on screen, but put it down on the desk. Settles when it has landed.
    A window that came up off the desk goes back into the gap it left there. */
function minimizeCard(card){
  if(card.parentElement!==dispStage) return Promise.resolve();
  const slot=card._slot; card._slot=null;
  if(slot && slot.parentElement===dispStrip) return glide(card, dispStrip, null, slot);
  makeRoom(1);
  // Sticky desk windows return to their STICKY_ORDER slot, not the end of the strip.
  const topic=card._d && card._d.sticky ? card._d.stickyTopic : '';
  const before=topic ? stickyInsertBefore(topic) : null;
  return glide(card, dispStrip, null, null, before);
}

/** Bring a thumbnail back to full size; what was being read goes down onto the desk. */
function promote(card){
  const lead=dispStage.firstElementChild;
  if(lead===card) return;
  // The gap it leaves is kept for it, so it goes back to where it lay.
  const slot=document.createElement('div');
  slot.className='dslot'; slot._for=card;
  dispStrip.insertBefore(slot, card);
  card._slot=slot;
  if(lead) minimizeCard(lead);
  glide(card, dispStage);
  setTimeout(sizeOrb, 520);
}

/* The newest thumbnail on the desk, skipping the gaps. */
function lastThumb(){
  for(let n=dispStrip.lastElementChild; n; n=n.previousElementSibling){
    if(n.classList.contains('dcard')) return n;
  }
  return null;
}

/* A click beside the window -- on the desk, or on the empty middle around it
   -- puts the window down. The same as its own minimize button, from anywhere. */
function clickBeside(e){
  if(e.target!==mainEl && e.target!==dispEl && e.target!==dispStrip) return;
  const lead=dispStage.firstElementChild;
  if(lead) minimizeCard(lead);
}
mainEl.addEventListener('click', clickBeside);

/* ---- how many the desk holds ----
   Whole cells only, counted from the desk's own size, so a smaller window is a
   smaller desk rather than a desk with half a thumbnail hanging off it. Null
   while the desk is not on screen: a desk with no size has no answer, and
   "none" would throw every window away. */
function deskCapacity(){
  const r=dispStrip.getBoundingClientRect();
  if(!r.width || !r.height) return null;
  const cs=getComputedStyle(dispStrip);
  const w=parseFloat(cs.getPropertyValue('--thumbW'))||196, h=parseFloat(cs.getPropertyValue('--thumbH'))||128;
  const gap=parseFloat(cs.columnGap)||12;
  const cols=Math.max(1,Math.floor((r.width+gap)/(w+gap)));
  const rows=Math.max(0,Math.floor((r.height+gap)/(h+gap)));   // a desk too short for a row holds none
  return cols*rows;
}

/** Room for `n` more on the desk: the oldest go first. */
function makeRoom(n){
  const cap=deskCapacity();
  if(cap===null) return;
  while(dispStrip.children.length+n>cap){
    // Prefer throwing a one-shot thumbnail away over a sticky desk window.
    const fall=[...dispStrip.children].find(c=>c.classList.contains('dcard') && !c._d.sticky);
    if(!fall) break;                           // only sticky windows left: keep them
    dropCard(fall,'aged-out');
  }
}

/* ---- the two views ----
   The windows and the orb want the same middle of the screen, so they take
   turns: folding the windows away parks the one being read in the corner the
   orb was using, and the orb grows back into the space. Neither view is lost,
   and the corner is the hinge between them -- which is why the click that folds
   and the click that unfolds are both in that corner. */
function collapseDisplay(){
  if(!mainEl.classList.contains('showing') || mainEl.classList.contains('collapsed')) return;
  /* With every window stepped down into the thumbnail row the stage is empty,
     and docking "the one being read" then docked nothing at all: the fold left
     the corner blank, so the switch back had nothing to point at. The newest
     thumbnail stands in -- it is the one that would come back first anyway --
     and it remembers where it came from, so unfolding puts it back in the row
     rather than promoting it to the stage behind your back. */
  const fromStrip=!dispStage.firstElementChild;
  const lead=dispStage.firstElementChild || lastThumb();
  if(lead){
    if(fromStrip) lead.dataset.fromStrip='1'; else delete lead.dataset.fromStrip;
  }
  const from=lead ? lead.getBoundingClientRect() : null;
  mainEl.classList.add('collapsed');
  if(lead) glide(lead, dispDock, from);
  setTimeout(sizeOrb, 520);
}

function expandDisplay(){
  if(!mainEl.classList.contains('collapsed')) return;
  const docked=dispDock.firstElementChild;
  const from=docked ? docked.getBoundingClientRect() : null;
  mainEl.classList.remove('collapsed');
  if(docked){
    const toStrip=!!docked.dataset.fromStrip;
    delete docked.dataset.fromStrip;
    if(toStrip){
      const topic=docked._d && docked._d.sticky ? docked._d.stickyTopic : '';
      const before=topic ? stickyInsertBefore(topic) : null;
      glide(docked, dispStrip, from, null, before);
    }else{
      glide(docked, dispStage, from);
    }
  }
  setTimeout(sizeOrb, 520);
}

function toggleDisplay(){
  if(!mainEl.classList.contains('showing')) return;
  if(mainEl.classList.contains('collapsed')) expandDisplay(); else collapseDisplay();
}

/* Clicking the orb is the switch. It only means anything while there is a
   second view to switch to, which is exactly when the orb is the small one in
   the corner or the big one that replaced the windows. */
$('#orb').addEventListener('click', toggleDisplay);
dispDock.addEventListener('click', expandDisplay);

/* ---- a minute of nothing puts the orb back ----
   The windows are for reading and the orb is for talking to, and a screen left
   on the windows stays on them all evening. A minute with no touch, no key and
   nothing being said is the difference between reading something and having
   walked away from it, and walking back should find the orb where it always is.
   It is the same fold the corner does, so what was being read waits there as a
   thumbnail and one click brings it back -- after which the minute starts
   again. Anything at all restarts it, so this can never fold a window away
   while it is being used. */
const IDLE_FOLD_MS=60000;
let idleFold=null;
function foldOnIdle(){
  if(!mainEl.classList.contains('showing')) return;
  if(mainEl.classList.contains('collapsed')) return;
  if(turn){ bumpIdle(); return; }              // still answering: not idle yet
  collapseDisplay();
}
function bumpIdle(){
  clearTimeout(idleFold);
  idleFold=setTimeout(foldOnIdle, IDLE_FOLD_MS);
}
for(const ev of ['pointerdown','pointermove','keydown','wheel','touchstart']){
  window.addEventListener(ev, bumpIdle, {passive:true});
}
bumpIdle();

const RENDER={image:renderImage, panel:renderPanel, chart:renderChart, text:renderNote, weather:renderWeather};
const pause=ms=>new Promise(r=>setTimeout(r,ms));

/* Windows go up one at a time. Each waits for the one before it to have been
   read for a moment, seen going down onto the desk, and lain there a beat --
   so two windows from one sentence are still two things happening, in order,
   and the desk is always a picture of what has been shown so far. */
let arrivals=Promise.resolve();

function showCard(m){
  const p=m.payload; if(!p || !RENDER[p.type]) return false;
  const gen=dispGen;
  arrivals=arrivals.then(()=>placeCard(m, gen)).catch(()=>{});
}

async function placeCard(m, gen){
  const sticky=stickyTopicOf(m.payload);
  const dismiss=sticky ? {mode:'manual'} : (m.dismiss||{mode:'next-turn'});
  // It waited its turn into the next question, and it was only ever for this one.
  if(gen!==dispGen && dismiss.mode==='next-turn'){
    if(m.id && connOk()) try{ ws.send(JSON.stringify({kind:'display_closed', id:m.id, reason:'next-turn'})); }catch(e){}
    return;
  }
  // Standing desk windows refresh in their fixed slot. Staging them used to
  // drop the old card and append a new one at the end, so an unchanged Mail
  // window slid into Weather's place whenever the sky updated.
  if(sticky){
    placeStickyQuiet({ ...m, dismiss:{ mode:'manual' } });
    bumpIdle();
    if(turn) startPump();
    setTimeout(sizeOrb, 520);
    return;
  }
  clearDisplay(m.id,'replaced');               // a replacement, not a second copy
  // The same window again under another id -- the mail list and then the mails
  // he picked out of it, both "Mail" -- is the newer one taking the older's
  // place, not a second Mail on the desk.
  for(const card of allCards()) if(sameWindow(card, m.payload)) dropCard(card,'replaced');
  // Something new to show outranks a fold: the windows come back on their own
  // rather than waiting to be asked, and what was docked goes onto the desk.
  if(mainEl.classList.contains('collapsed')){
    const docked=dispDock.firstElementChild;
    mainEl.classList.remove('collapsed');
    if(docked){
      delete docked.dataset.fromStrip;
      makeRoom(1);
      parkStickyOnStrip(docked);
    }
  }
  mainEl.classList.add('showing');
  sizeStage();                                 // the frame first, then what is in it
  const lead=dispStage.firstElementChild;
  if(lead && !REDUCED.matches){
    const read=performance.now()-(lead._d.shownAt||0);
    if(read<DWELL_MS) await pause(DWELL_MS-read);
    if(lead.parentElement===dispStage){        // still there: nobody closed it meanwhile
      await minimizeCard(lead);                // seen going down
      await pause(SETTLE_MS);                  // and lying there
    }
  }else if(lead){
    minimizeCard(lead);
  }
  const card=makeCard({ ...m, dismiss }, RENDER[m.payload.type](m.payload));
  dispStage.appendChild(card);
  bumpIdle();                                  // something to read: the minute starts over
  // A list that went up without waiting for a word still has rows to light as
  // he reaches them, and that is the tick's other job.
  if(turn) startPump();
  setTimeout(sizeOrb, 520);
}

/* Subject of a window title: "Agenda vandaag" and "Agenda" are one window.
   Exact title used to be required, and a briefing that named the same list
   two ways left both on the desk. First matching topic word wins; otherwise
   the first word of the title. */
let WINDOW_TOPICS={
  agenda:'agenda', calendar:'agenda', kalender:'agenda', afspraak:'agenda', afspraken:'agenda',
  mail:'mail', email:'mail', inbox:'mail',
  weer:'weather', weather:'weather', forecast:'weather', weersverwachting:'weather',
  huis:'house', house:'house',
  muziek:'music', music:'music', spotify:'music',
  telegram:'messages', message:'messages',
  televisie:'tv', netflix:'tv',
  werk:'work', work:'work', pull:'work', pulls:'work', request:'work', requests:'work',
  pr:'work', prs:'work',
  note:'notes', notes:'notes', notitie:'notes', notities:'notes'
};
function windowTopic(title){
  const t=String(title||'').trim().toLowerCase();
  if(!t) return '';
  const words=t.split(/[^a-z0-9]+/).filter(Boolean);
  for(const w of words){ if(WINDOW_TOPICS[w]) return WINDOW_TOPICS[w]; }
  return words[0]||'';
}
/* Is this card the same window as the payload: same kind, same subject? */
function sameWindow(card, p){
  const topic=stickyTopicOf(p) || windowTopic(p.title);
  const other=card._d.stickyTopic || windowTopic(card._d.title);
  return topic!=='' && card._d.type===p.type && other===topic;
}

/* ---- sticky desk windows ----
   Five windows stay on the desk: weather, agenda, mail, pull requests and
   notes. They survive the next question, a fold, and a reload. A newer
   reading of the same subject replaces the contents; nothing else clears
   them. localStorage holds the last payload so a restart of the page (or
   of the service) still shows what was there. */
const DESK_KEY='jarvis.desk.v1';
// Defaults until the brain sends kind:desk (core + packs). Packs append topics.
let STICKY_ORDER=['weather','agenda','mail','work','notes'];
// Set when the standing desk is rebuilt on load: the first-time tour card
// would cover the orb we just opened, so offer() skips itself in that case.
let deskRestoredAtBoot=false;
const STICKY_LABEL={
  weather:'Weer', agenda:'Agenda', mail:'Mail',
  work:'Pull requests', notes:'Notities'
};

function applyDeskSlots(slots){
  if(!Array.isArray(slots) || !slots.length) return;
  const order=[];
  for(const slot of slots){
    const topic=String(slot.topic||'').trim();
    if(!topic) continue;
    const label=String(slot.label||topic).trim()||topic;
    STICKY_LABEL[topic]=label;
    WINDOW_TOPICS[topic]=topic;
    order.push(topic);
  }
  if(!order.length) return;
  STICKY_ORDER=order;
  const have=new Set(allCards().filter(c=>c._d.sticky).map(c=>c._d.stickyTopic));
  const store=deskLoad();
  for(const topic of STICKY_ORDER){
    if(have.has(topic)) continue;
    const saved=store[topic];
    const payload=saved && saved.payload ? saved.payload : emptyStickyPayload(topic);
    placeStickyQuiet({ id:'sticky-'+topic, payload, dismiss:{ mode:'manual' } });
  }
  orderStickyStrip();
}

function stickyTopicOf(p){
  if(!p) return '';
  if(p.type==='weather') return 'weather';
  const fromTitle=windowTopic(p.title||'');
  if(STICKY_ORDER.includes(fromTitle)) return fromTitle;
  if(p.type==='text'){
    const t=windowTopic(p.title||'note');
    if(t==='notes' || !p.title) return 'notes';
  }
  return '';
}

function deskLoad(){
  try{
    const raw=localStorage.getItem(DESK_KEY);
    const parsed=raw ? JSON.parse(raw) : null;
    if(!parsed || typeof parsed!=='object') return {};
    const out={};
    for(const topic of STICKY_ORDER){
      const entry=parsed[topic];
      if(entry && entry.payload && typeof entry.payload==='object') out[topic]=entry;
    }
    return out;
  }catch(e){ return {}; }
}
function deskSave(store){
  try{ localStorage.setItem(DESK_KEY, JSON.stringify(store)); }catch(e){}
}
function deskRemember(topic, payload){
  if(!topic || !payload) return;
  const store=deskLoad();
  store[topic]={ payload, at:Date.now() };
  deskSave(store);
}

function emptyStickyPayload(topic){
  return {
    type:'panel',
    title:STICKY_LABEL[topic]||topic,
    quiet:true,
    rows:[{ label:'\u2014', value:'nog geen gegevens' }]
  };
}

function isEmptyPlaceholder(p){
  return !!(p && p.rows && p.rows.length===1 && p.rows[0].value==='nog geen gegevens');
}

/** Strip child that a sticky topic should sit before, by STICKY_ORDER. */
function stickyInsertBefore(topic){
  if(!topic) return null;
  const want=STICKY_ORDER.indexOf(topic);
  if(want<0) return null;
  for(const child of [...dispStrip.children]){
    let t='';
    if(child.classList.contains('dcard')) t=child._d && child._d.stickyTopic || '';
    else if(child.classList.contains('dslot')) t=child._for && child._for._d && child._for._d.stickyTopic || '';
    if(!t) continue;
    const at=STICKY_ORDER.indexOf(t);
    if(at>want) return child;
  }
  return null;
}

/** Park a card on the strip at its sticky slot (or append if it is not sticky). */
function parkStickyOnStrip(card){
  if(!card) return;
  const topic=card._d && card._d.sticky ? card._d.stickyTopic : '';
  const before=topic ? stickyInsertBefore(topic) : null;
  if(before) dispStrip.insertBefore(card, before);
  else dispStrip.appendChild(card);
}

/** Keep sticky thumbnails in STICKY_ORDER after a restore or slot change. */
function orderStickyStrip(){
  const byTopic=new Map();
  for(const child of [...dispStrip.children]){
    if(!child.classList.contains('dcard') || !child._d || !child._d.sticky) continue;
    byTopic.set(child._d.stickyTopic, child);
  }
  for(const topic of STICKY_ORDER){
    const card=byTopic.get(topic);
    if(card) dispStrip.appendChild(card);
  }
}

/** Put a sticky window on the desk without the arrival choreography. */
function placeStickyQuiet(m){
  const p=m.payload; if(!p || !RENDER[p.type]) return;
  const topic=stickyTopicOf(p);
  // Refresh in place when the slot is already filled: dropping and appending
  // used to shuffle the whole desk whenever one subject updated.
  const existing=topic
    ? allCards().find(c=>c._d && c._d.sticky && c._d.stickyTopic===topic)
    : null;
  let rendered;
  try { rendered = RENDER[p.type](p); }
  catch (err) {
    console.warn('sticky render failed', topic || p.type, err);
    return false;
  }
  if(existing){
    clearTimeout(existing._d.timer);
    clearInterval(existing._d.refresh);
    const body=existing.querySelector('.body');
    const h=existing.querySelector('h3');
    if(body) body.replaceChildren(rendered.node);
    if(h) h.textContent=rendered.title;
    existing._rows = rendered.rows || [];
    existing._subjects = rendered.subjects || existing._rows.map(row=>row.subject);
    existing._ordered = rendered.ordered===true;
    existing._d.type=p.type;
    existing._d.title=String(p.title||'').trim().toLowerCase();
    existing._d.refresh = rendered.after ? rendered.after() : null;
    existing._d.id=m.id || existing._d.id;
    if(topic && !isEmptyPlaceholder(p)) deskRemember(topic, p);
    return true;
  }
  for(const card of allCards()) if(sameWindow(card, p)) dropCard(card,'replaced');
  const card=makeCard({ ...m, dismiss:{ mode:'manual' } }, rendered);
  card._d.sticky=true;
  card._d.stickyTopic=topic;
  card._d.untilNextTurn=false;
  mainEl.classList.add('showing');
  makeRoom(1);
  parkStickyOnStrip(card);
  if(topic && !isEmptyPlaceholder(p)) deskRemember(topic, p);
  return true;
}

function restoreStickyDesk(){
  const store=deskLoad();
  for(const topic of STICKY_ORDER){
    const saved=store[topic];
    const payload=saved && saved.payload ? saved.payload : emptyStickyPayload(topic);
    const ok = placeStickyQuiet({
      id:'sticky-'+topic,
      payload,
      dismiss:{ mode:'manual' }
    });
    // A corrupt localStorage weather/chart payload used to throw inside render*
    // before esc existed and blank the whole HUD. Fall back to the empty slot.
    if(ok === false){
      placeStickyQuiet({
        id:'sticky-'+topic,
        payload: emptyStickyPayload(topic),
        dismiss:{ mode:'manual' }
      });
      try {
        const next = deskLoad();
        delete next[topic];
        deskSave(next);
      } catch (e) {}
    }
  }
  orderStickyStrip();
  deskRestoredAtBoot=true;
  // Fresh page: desk is restored, then the orb takes the middle so talking is
  // ready without a click. Expand once to read the standing windows.
  if(mainEl.classList.contains('showing') && !mainEl.classList.contains('collapsed')){
    collapseDisplay();
  }
  sizeOrb();
  setTimeout(sizeOrb, 520);
}

/* The briefing is over: the window still open goes down beside the others,
   after the same moment to read it, so what is left is the desk with every
   window on it and nothing over it. Queued behind whatever is still arriving. */
function settleDesk(){
  arrivals=arrivals.then(async()=>{
    const lead=dispStage.firstElementChild;
    if(!lead) return;
    if(!REDUCED.matches){
      const read=performance.now()-(lead._d.shownAt||0);
      if(read<DWELL_MS) await pause(DWELL_MS-read);
    }
    if(lead.parentElement===dispStage) await minimizeCard(lead);
  }).catch(()=>{});
}

/* An item arrives the moment its tool answered, which is a sentence or two
   before the subject comes up. `cue` says where it belongs: how far into the
   answer the tool was reached for, or a word to wait for. With nothing being
   said there is nothing to wait for, and it goes up straight away. */
let dispQueue=[], dispPump=null;

function onDisplay(m){
  if(!m.cue || !turn){ showCard(m); return; }
  dispQueue.push(m);
  startPump();
  pumpDisplays();
}

function startPump(){ if(!dispPump) dispPump=setInterval(pumpDisplays, 60); }

/* The cued windows that went up this turn: where each one's word was looked
   for from, and where it was found. The next window's word is looked for
   after the last one's, because he speaks in order -- and a window that is
   the same one again (the mail list, then the mails he picked out of it)
   looks from where the first did rather than after it. */
let released=[];

function slotFrom(m){
  const p=m.payload||{};
  const title=String(p.title||'').trim().toLowerCase();
  for(const r of released){
    if(r.id===m.id || (title!=='' && r.type===p.type && r.title===title)) return r.from;
  }
  return released.length ? released[released.length-1].end : 0;
}

function cueReached(cue, text, seen, m){
  const anchors=String(cue.anchor||'').split('|').map(a=>a.trim().toLowerCase()).filter(Boolean);
  if(anchors.length){
    const lower=text.toLowerCase();
    const from=m ? slotFrom(m) : 0;
    // Any one of them said releases it: "agenda" one morning, "calendar" the
    // next, depending on the language he is speaking. Not said yet: hold. If
    // none is ever said, the end of the turn releases it.
    //
    // Said in a sentence that has already named a row of a window on the
    // desk -- "X mails that the build failed on a PR", with the mail window
    // up -- it is that row's word and not this window's: skipped, and the
    // next time it is said is looked at instead. Only what comes before it
    // in the sentence counts: "your pull requests: one from X" is about the
    // pull requests, however many mails X also sent.
    let hit=-1;
    for(const anchor of anchors){
      let at=anchorAt(lower, anchor, from);
      while(at>=0 && (hit<0 || at<hit)){
        const end=at+anchor.length;
        if(seen<end) break;                    // not said yet: hold
        if(aboutARow(sentenceBefore(lower, at), m)){ at=anchorAt(lower, anchor, end); continue; }
        hit=at; break;
      }
    }
    if(hit<0) return false;
    if(m && m.id!==undefined){
      const p=m.payload||{};
      const ended=Math.max(...anchors.filter(a=>lower.startsWith(a, hit)).map(a=>hit+a.length), hit+1);
      released.push({id:m.id, type:p.type, title:String(p.title||'').trim().toLowerCase(), from, end:ended});
    }
    return true;
  }
  // Nothing goes up on the opening line. A window cued by how far the answer
  // had got belongs in the answer, and "I am looking that up" is not it.
  if(turn && !turn.answering) return false;
  return seen>=(cue.chars||0);
}

/* Where an anchor was said, or -1. A long one may start a word, so "mail" hears
   "mailtje"; a short one -- "PR" -- has to be a word of its own, because as a
   substring it is inside "problem" and "April". */
function anchorAt(lower, anchor, from){
  from=from||0;
  if(anchor.length>=4) return lower.indexOf(anchor, from);
  const safe=anchor.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('(^|[^a-z0-9])'+safe+'(?![a-z0-9])','g');
  re.lastIndex=from>0 ? from-1 : 0;            // the boundary before it may be the last character looked past
  const m=re.exec(lower);
  return m ? m.index+m[1].length : -1;
}

/* The sentence `at` falls in, up to `at`: from the end of the one before it. */
const SENTENCE_STOPS=/[.!?…]["'’”)\]]*(?=\s|$)/g;
function sentenceBefore(text, at){
  let start=0, m;
  SENTENCE_STOPS.lastIndex=0;
  while((m=SENTENCE_STOPS.exec(text))!==null){
    const stop=m.index+m[0].length;
    if(stop>at) break;
    start=stop;
  }
  return text.slice(start, at);
}

/* Does this much of a sentence name a row of a window already up -- one that
   is not the window `m` is (or replaces)? Then what follows is about that row. */
function aboutARow(sentence, m){
  const p=(m && m.payload)||{};
  const title=String(p.title||'').trim().toLowerCase();
  for(const card of allCards()){
    if(m && (card._d.id===m.id || (title!=='' && card._d.type===p.type && windowTopic(card._d.title)===windowTopic(title)))) continue;
    const subjects=card._subjects||[];
    if(!subjects.length) continue;
    const count=rowWordCount(card);
    for(const subject of subjects) if(mentionScore(sentence, subject, count)>0) return true;
  }
  return false;
}

/* Lighting the row he has reached. A row is lit once and never relit: `hot`
   is what says it already had its five breaths, so a subject he returns to
   later in the same answer does not start blinking again. */
function markRows(said){
  let waiting=false;
  // The sentence he is in, not the whole answer: a briefing is long, and by
  // its fourth minute every row of every list shares two words with something
  // said somewhere in it. A note from April lit while he spoke of last night.
  const recent=recentSaid(said);
  for(const card of allCards()){
    const count=rowWordCount(card);
    if(card._ordered){ if(walkRows(card, recent, count)) waiting=true; continue; }
    // One row per list per tick: the one the sentence names best. Two rows
    // that both fit -- a note from April and last night's, about the same
    // deployment -- would otherwise both light, and the wrong one may be
    // the one in view. The other, if it is truly named, is next tick's.
    let best=null, score=0;
    for(const row of card._rows||[]){
      if(row.tr.dataset.lit){ continue; }
      waiting=true;
      const s=mentionScore(recent, row.subject, count);
      if(s>score){ best=row; score=s; }
    }
    if(!best) continue;
    // Same clock as a context tile and as today's row. The card usually goes
    // away at the next question long before the fade fires.
    raiseRow(card, best.tr);
    lightRow(best.tr);
  }
  return waiting;
}

/* A list in the order it is spoken about -- the mails he chose -- is walked,
   not searched: the next unlit row is the one the sentence is about, and it
   lights when the sentence names it. Named a row further down instead, in
   words the rows between shared nothing with, those rows light on the way, a
   beat apart, so every row gets its one blink and in order. Returns whether a
   row is still waiting. */
function walkRows(card, recent, count){
  const rows=card._rows||[];
  const next=rows.findIndex(row=>!row.tr.dataset.lit);
  if(next<0) return false;
  let hit=-1, score=0;
  for(let i=next;i<rows.length;i++){
    const s=mentionScore(recent, rows[i].subject, count);
    if(i===next && s>0){ hit=i; break; }       // the one he should be on, and is
    if(s>score){ hit=i; score=s; }
  }
  if(hit<0) return true;
  const run=rows.slice(next, hit+1);
  run.forEach((row,i)=>{
    row.tr.dataset.lit='1';                    // spoken for, even before its beat comes
    setTimeout(()=>{ raiseRow(card, row.tr); lightRow(row.tr); }, i*ROW_WALK_MS);
  });
  return hit<rows.length-1;
}
const ROW_WALK_MS=700;                         // between two rows lit in one stride

/* The last two sentences of what has been spoken: the one he is in and the one
   before it, because a subject is often named in one and described in the
   next. Anything older is done with. */
function recentSaid(said){
  const ends=[];
  const re=/[.!?…]["'’”)\]]*(?=\s|$)/g;
  let m;
  while((m=re.exec(said))!==null) ends.push(m.index+m[0].length);
  if(ends.length<2) return said;
  // the last end may be the very end of what is spoken so far: then the
  // sentence he is in is the empty one after it, and the two before count
  const cut=ends.length>=2 && ends[ends.length-1]>=said.trimEnd().length
    ? ends[ends.length-3] ?? 0
    : ends[ends.length-2];
  return said.slice(cut);
}

/* In how many rows of this list each distinctive word occurs. A word that is
   in one row only names that row on its own: "Knijn" is enough, where "audit"
   in a list with three audit pipelines is not. Counted once per card. */
function rowWordCount(card){
  if(card._wordCount) return card._wordCount;
  const count=new Map();
  for(const subject of card._subjects||(card._rows||[]).map(row=>row.subject)){
    for(const w of new Set(ctxWords(subject))) count.set(w,(count.get(w)||0)+1);
  }
  card._wordCount=count;
  return count;
}

/* The rows he talks about move to the top of their list, in the order he
   comes to them: the first one named is the first row, the second the second.
   Out of twelve pull requests the two being discussed are then the two in
   view, lit, rather than the ninth and the eleventh somewhere below the fold.
   The other rows slide out of the way rather than jump. */
function raiseRow(card, tr){
  const table=tr.parentElement;
  if(!table) return;
  const n=card._raised||0;
  card._raised=n+1;
  // No lasting tint: gold lives only on `hot` while the row is the one being
  // spoken about. Raising still brings it into view at the top of the list.
  const target=table.children[n];
  if(!target || target===tr) return;
  const rows=[...table.children];
  const before=new Map(rows.map(r=>[r, r.getBoundingClientRect().top]));
  table.insertBefore(tr, target);
  const body=card.querySelector('.body');
  if(body) body.scrollTop=0;
  if(REDUCED.matches) return;
  for(const r of rows){
    const d=before.get(r)-r.getBoundingClientRect().top;
    if(!d) continue;
    r.style.transition='none';
    r.style.transform='translateY('+d+'px)';
  }
  void table.offsetWidth;
  for(const r of rows){
    r.style.transition='transform .45s cubic-bezier(.22,.61,.36,1)';
    r.style.transform='';
  }
}

function pumpDisplays(){
  if(!turn) return flushQueued();
  const s=turn.stream;
  if(!s) return;                               // the answer has not started yet
  const text=s.text||'', seen=s.revealed;
  const said=text.slice(0,seen);
  for(const m of dispQueue.slice()){
    if(!cueReached(m.cue, text, seen, m)) continue;
    dispQueue.splice(dispQueue.indexOf(m),1);
    showCard(m);
  }
  for(const entry of ctxQueue.slice()){
    if(!ctxCueReached(entry, said)) continue;
    ctxQueue.splice(ctxQueue.indexOf(entry),1);
    ctxApply(entry);
  }
  const rowsWaiting=markRows(said);
  if(!dispQueue.length && !ctxQueue.length && !rowsWaiting) stopPump();
}

/** The answer is over: whatever waited for a word it never got goes up now. */
function flushQueued(){
  const cards=dispQueue, blocks=ctxQueue;
  dispQueue=[]; ctxQueue=[]; stopPump();
  for(const m of cards) showCard(m);
  for(const entry of blocks) ctxApply(entry);
}
/* Kept under its old name: `onDone` calls it, and so does anything that ends a
   turn without one. */
const flushDisplays=flushQueued;

function dropDisplays(){ dispQueue=[]; released=[]; dropTiles(); stopPump(); }
function stopPump(){ clearInterval(dispPump); dispPump=null; }

/* ---- how big the windows are ----
   Ctrl+scroll is the browser's answer and it enlarges the header, the panels
   and the transcript as well. This is the windows on their own: one custom
   property, read back from the stylesheet so the starting point is whatever the
   screen's own breakpoint chose, and only written as an inline override once
   somebody has actually asked for a different size. */
const DS_KEY='jarvis.displayScale', DS_MIN=0.8, DS_MAX=2.4, DS_STEP=0.1;
const dzVal=$('#dzVal');

function dsNow(){
  const n=parseFloat(getComputedStyle(dispEl).getPropertyValue('--ds'));
  return Number.isFinite(n) ? n : 1.3;
}

function setDs(next, remember){
  const v=Math.round(clamp(next, DS_MIN, DS_MAX)*100)/100;
  dispEl.style.setProperty('--ds', String(v));
  dzVal.textContent=Math.round(v*100)+'%';
  if(remember){ try{ localStorage.setItem(DS_KEY, String(v)); }catch(e){} }
  // the orb shares the row with the windows, and the canvas is sized in pixels
  sizeStage();
  setTimeout(sizeOrb, 60);
}

function nudgeDs(by){ setDs(dsNow()+by, true); }

$('#dzIn').addEventListener('click', ()=>nudgeDs(DS_STEP));
$('#dzOut').addEventListener('click', ()=>nudgeDs(-DS_STEP));

(function restoreDs(){
  let stored=null;
  try{ stored=localStorage.getItem(DS_KEY); }catch(e){}
  const n=stored===null ? NaN : parseFloat(stored);
  // Nothing stored: leave the property alone so the breakpoint keeps deciding,
  // and only put the number the stylesheet chose on the label.
  if(Number.isFinite(n)) setDs(n, false);
  else dzVal.textContent=Math.round(dsNow()*100)+'%';
})();

/* ============================== orb ============================== */
const orb = $('#orb'), octx = orb.getContext('2d');
let OW=0, OH=0, DPR=1;

/* How tall a window may be, in pixels, measured rather than guessed. The
   windows are centred in `main`, so the state line along the bottom costs its
   own height twice over; a stylesheet would need that height as a number, and
   the number moves with the breakpoint -- which is how the mail window came to
   run straight through the state line on a 1280-wide screen. `--stageH` is only
   ever a cap: the vh and em in the rule still decide when there is room. */
const MIN_STAGE=120;             // below this a window says nothing at all

function sizeStage(){
  if(!mainEl.classList.contains('showing')) return;
  if(mainEl.classList.contains('collapsed')) return;
  const main=mainEl.getBoundingClientRect();
  const line=$('#stateText').getBoundingClientRect();
  if(!main.height || !line.height) return;
  // The desk ends where the stylesheet says, or higher when the state line has
  // grown taller than the stylesheet allowed for: a long sentence wraps.
  dispEl.style.removeProperty('--dispBottom');
  const styled=parseFloat(getComputedStyle(dispEl).getPropertyValue('--dispBottom'))||162;
  const reserve=Math.max(styled, (main.bottom-line.top)+12);
  if(reserve>styled) dispEl.style.setProperty('--dispBottom', Math.round(reserve)+'px');
  const top=dispEl.getBoundingClientRect().top-main.top;
  const room=main.height-reserve-top-24;        // the desk, less a margin over and under the window
  dispEl.style.setProperty('--stageH', Math.max(MIN_STAGE, Math.round(room))+'px');
  makeRoom(0);                                  // a smaller desk holds fewer
}

function sizeOrb(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const r = orb.getBoundingClientRect();
  OW=r.width; OH=r.height;
  orb.width=OW*DPR; orb.height=OH*DPR;
  octx.setTransform(DPR,0,0,DPR,0,0);
}

const particles = Array.from({length:70},()=>({
  a:Math.random()*Math.PI*2,
  r:0.55+Math.random()*0.45,
  s:(Math.random()*0.5+0.2)*(Math.random()<0.5?-1:1),
  z:Math.random()
}));

// arc-segment rings: [radius, segments, gapRatio, speed, width, alpha]
const RINGS = [
  [0.46, 3,  0.34, -0.22, 1.6, 1.00],
  [0.55, 5,  0.22,  0.31, 1.2, 0.78],
  [0.64, 2,  0.42, -0.14, 2.6, 1.15],
  [0.72, 9,  0.14,  0.19, 1.0, 0.60],
  [0.79, 1,  0.06,  0.07, 0.8, 0.42],
  [0.93, 4,  0.30, -0.09, 1.5, 0.72],
];

function drawOrb(dt){
  const cx=OW/2, cy=OH/2, R=Math.min(OW,OH)/2;
  const hue=S.hue;
  const amp=S.amp;
  const breathe = Math.sin(S.t*1.25)*0.5+0.5;
  const energy = S.mode==='idle' ? 0.26+breathe*0.14 : 0.35+amp*0.65;

  octx.clearRect(0,0,OW,OH);
  octx.globalCompositeOperation='lighter';

  /* --- core glow --- */
  const coreR = R*(0.30 + energy*0.13);
  let g = octx.createRadialGradient(cx,cy,0,cx,cy,coreR*2.6);
  g.addColorStop(0,   `hsla(${hue},100%,${72+energy*18}%,${0.42+energy*0.42})`);
  g.addColorStop(0.24,`hsla(${hue},100%,58%,${0.20+energy*0.26})`);
  g.addColorStop(0.55,`hsla(${hue},100%,50%,${0.06+energy*0.10})`);
  g.addColorStop(1,   `hsla(${hue},100%,50%,0)`);
  octx.fillStyle=g;
  octx.beginPath(); octx.arc(cx,cy,coreR*2.6,0,7); octx.fill();

  /* --- inner disc with soft edge --- */
  g = octx.createRadialGradient(cx,cy,coreR*0.1,cx,cy,coreR);
  g.addColorStop(0,   `hsla(${hue},95%,88%,${0.30+energy*0.35})`);
  g.addColorStop(0.7, `hsla(${hue},95%,62%,${0.10+energy*0.14})`);
  g.addColorStop(1,   `hsla(${hue},95%,55%,0)`);
  octx.fillStyle=g;
  octx.beginPath(); octx.arc(cx,cy,coreR,0,7); octx.fill();

  /* --- rotating arc rings --- */
  RINGS.forEach(([rr,segs,gap,spd,w,al],idx)=>{
    const spin = S.mode==='thinking' ? spd*4.2 : S.mode==='idle' ? spd*0.45 : spd*1.5;
    const rad = R*rr*(1 + (idx%2? amp*0.045 : -amp*0.02));
    const step = (Math.PI*2)/segs;
    const arc = step*(1-gap);
    octx.lineWidth=w*(1+amp*0.7);
    octx.lineCap='round';
    for(let i=0;i<segs;i++){
      const a0 = S.t*spin + i*step;
      const grad = octx.createLinearGradient(
        cx+Math.cos(a0)*rad, cy+Math.sin(a0)*rad,
        cx+Math.cos(a0+arc)*rad, cy+Math.sin(a0+arc)*rad);
      grad.addColorStop(0,   `hsla(${hue},100%,65%,0)`);
      grad.addColorStop(0.18,`hsla(${hue},100%,${66+energy*14}%,${al*(0.20+energy*0.40)})`);
      grad.addColorStop(0.5, `hsla(${hue},100%,${72+energy*16}%,${al*(0.55+energy*0.70)})`);
      grad.addColorStop(0.82,`hsla(${hue},100%,${66+energy*14}%,${al*(0.20+energy*0.40)})`);
      grad.addColorStop(1,   `hsla(${hue},100%,65%,0)`);
      octx.strokeStyle=grad;
      octx.beginPath(); octx.arc(cx,cy,rad,a0,a0+arc); octx.stroke();
    }
  });

  /* --- radial spectrum bars --- */
  const barIn = R*0.815;
  const TAU=Math.PI*2;
  for(let i=0;i<64;i++){
    const v = S.bins[i];
    const a = (i/64)*TAU - Math.PI/2;
    const len = R*0.022 + v*R*0.115*(S.mode==='idle'?0.55:1);
    const x1=cx+Math.cos(a)*barIn, y1=cy+Math.sin(a)*barIn;
    const x2=cx+Math.cos(a)*(barIn+len), y2=cy+Math.sin(a)*(barIn+len);
    octx.strokeStyle=`hsla(${hue+v*22},100%,${62+v*25}%,${0.22+v*0.7})`;
    octx.lineWidth=2.1;
    octx.beginPath(); octx.moveTo(x1,y1); octx.lineTo(x2,y2); octx.stroke();
    // mirrored inward tick
    const x3=cx+Math.cos(a)*(barIn-len*0.32), y3=cy+Math.sin(a)*(barIn-len*0.32);
    octx.strokeStyle=`hsla(${hue},100%,70%,${0.06+v*0.22})`;
    octx.lineWidth=1.2;
    octx.beginPath(); octx.moveTo(x1,y1); octx.lineTo(x3,y3); octx.stroke();
  }

  /* --- orbiting particles --- */
  particles.forEach(p=>{
    p.a += p.s*dt*(S.mode==='thinking'?1.9:0.5);
    const rad = R*p.r*(0.72 + amp*0.10);
    const x=cx+Math.cos(p.a)*rad, y=cy+Math.sin(p.a)*rad*0.985;
    const sz = 0.7+p.z*1.7+amp*1.1;
    octx.fillStyle=`hsla(${hue},100%,78%,${(0.13+p.z*0.30)*(0.45+energy)})`;
    octx.beginPath(); octx.arc(x,y,sz,0,7); octx.fill();
  });

  /* --- sweeping scan line (listening only) --- */
  if(S.mode==='listening'){
    const a=(S.t*1.7)%(Math.PI*2);
    const grad=octx.createLinearGradient(cx,cy,cx+Math.cos(a)*R,cy+Math.sin(a)*R);
    grad.addColorStop(0,`hsla(${hue},100%,70%,0)`);
    grad.addColorStop(1,`hsla(${hue},100%,78%,.34)`);
    octx.strokeStyle=grad; octx.lineWidth=1.6;
    octx.beginPath(); octx.moveTo(cx,cy); octx.lineTo(cx+Math.cos(a)*R*0.96, cy+Math.sin(a)*R*0.96); octx.stroke();
  }

  /* --- outer hairline ring + ticks --- */
  octx.globalCompositeOperation='source-over';
  octx.strokeStyle=`hsla(${hue},90%,60%,.40)`;
  octx.lineWidth=1;
  octx.beginPath(); octx.arc(cx,cy,R*0.985,0,7); octx.stroke();
  for(let i=0;i<72;i++){
    const a=(i/72)*Math.PI*2;
    const long = i%6===0;
    const r1=R*0.985, r2=R*(long?0.935:0.962);
    octx.strokeStyle=`hsla(${hue},90%,68%,${long?0.62:0.26})`;
    octx.lineWidth=long?1.5:1;
    octx.beginPath();
    octx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    octx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
    octx.stroke();
  }
}

/* ============================== waveform strip ============================== */
const wave=$('#wave'), wctx=wave.getContext('2d');
let WW=0,WH=0;
const history=new Float32Array(220);
let hi=0;

function sizeWave(){
  const r=wave.getBoundingClientRect();
  WW=r.width; WH=r.height;
  wave.width=WW*DPR; wave.height=WH*DPR;
  wctx.setTransform(DPR,0,0,DPR,0,0);
}

function drawWave(){
  history[hi]=S.amp; hi=(hi+1)%history.length;
  wctx.clearRect(0,0,WW,WH);
  const mid=WH/2, n=history.length, step=WW/n;
  wctx.lineWidth=2; wctx.lineCap='round';
  for(let i=0;i<n;i++){
    const v=history[(hi+i)%n];
    const x=i*step;
    const h=Math.max(1.2, v*WH*0.86);
    const fade=0.20+0.80*(i/n);
    wctx.strokeStyle=`hsla(${S.hue},100%,${58+v*28}%,${(0.14+v*0.78)*fade})`;
    wctx.beginPath();
    wctx.moveTo(x, mid-h/2);
    wctx.lineTo(x, mid+h/2);
    wctx.stroke();
  }
  wctx.strokeStyle=`hsla(${S.hue},80%,60%,.13)`;
  wctx.lineWidth=1;
  wctx.beginPath(); wctx.moveTo(0,mid); wctx.lineTo(WW,mid); wctx.stroke();
}

/* ============================== HUD data ============================== */
/* ---- is this what he is talking about? ----
   One matcher, used twice: to decide when a context block has come up, and to
   decide which row of a list on screen the current sentence is about. Both are
   the same question asked of different text, and both ask it of what has been
   *spoken* so far rather than of the whole answer -- the point is to light up on
   the word, not a paragraph early.

   Two distinctive words in common, or one long one, or one that no other row of
   the same list has. Below that it is not a mention, it is a coincidence: every
   mail in a list shares "van" and "de" with every sentence about any of them. */
const CTX_STOP=new Set(['de','het','een','van','voor','met','over','naar','aan','door','uit','bij',
  'dat','die','deze','daar','ook','maar','nog','wel','niet','zijn','haar','jouw','jij','wij',
  'er','en','of','is','was','wordt','worden','heeft','hebben','staat','the','and','for',
  'with','from','that','this','your','you','are','has','have','will','fwd','antw','onderwerp']);

function ctxNorm(s){
  return String(s==null?'':s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function ctxWords(s){
  return ctxNorm(s).split(' ').filter(w=>w.length>=4 && !CTX_STOP.has(w));
}
/** A whole word and whatever was suffixed onto it: "mail" also hears "mailtje".
    Both sides normalised the same way, so "Knijn" in the sentence is the
    "knijn" of the row: names are capitalised, and were never heard before. */
function saidWord(said,word){ return hasWord(ctxNorm(said), word); }
function hasWord(norm,word){
  const w=ctxNorm(word);
  if(w==='' || w.length<4) return false;
  return new RegExp('\\b'+w.replace(/ /g,'\\s+')+'[a-z]*\\b').test(norm);
}
/* How strongly the sentence names the subject: 0 is not at all. With `count`
   (how many rows of the list each word is in) one word is enough when it is in
   this row alone; without it, one long word is. Two words are always enough. */
function mentionScore(said,subject,count){
  const norm=ctxNorm(said), seen=new Set();
  let hits=0, longest=0, alone=false;
  for(const w of ctxWords(subject)){
    if(seen.has(w)) continue;
    seen.add(w);
    if(!hasWord(norm,w)) continue;
    hits++;
    longest=Math.max(longest,w.length);
    if(count ? count.get(w)===1 && w.length>=5 : w.length>=8) alone=true;
  }
  if(!alone && hits<2) return 0;
  return hits*10+longest;
}
function mentions(said,subject,count){ return mentionScore(said,subject,count)>0; }

/* ---- the context panel ----
   Whatever the packs doing the work say is worth knowing, one block per
   subject. It held eight invented readings until v0.8.0 -- a living room
   temperature on a machine that had never been told about a living room -- and
   one pack's figures at a time until now, so asking about the weather threw
   away what the mail had said a minute earlier.

   It is a standing sheet rather than a slot: the weather, the mail and the
   agenda sit under each other, each replaced only by a newer reading of itself.
   The sheet is written to localStorage, so closing the page and opening it
   again picks the conversation up where it was rather than at nothing. */
const CTX_KEY='jarvis.context.v1';
const CTX_MAX=6;                 // blocks kept at all; the panel may show fewer
/* One rhythm for every gold thing on the screen: five breaths and out. The
   breath is the CSS animation's own duration, so the count and the length are
   stated once here and once in `rowGlow`, and moving one without the other
   shows up immediately as a glow that stops mid-breath. */
const CTX_BREATH_MS=1700;        // one breath, as the keyframes are timed
const CTX_BLINKS=5;              // how many of them a new thing gets
const CTX_PULSE_MS=CTX_BREATH_MS*CTX_BLINKS;  // how long the arrival glow breathes
/* A row in a list is the exception: it blinks once, as `rowGlow` on `tr.hot`
   is repeated once, and then holds its gold. Five breaths on every mail of
   four was a window that never stopped flickering. */
const ROW_PULSE_MS=CTX_BREATH_MS;
const CTX_GLOW_MS=CTX_PULSE_MS;  // the fifth breath is where being new ends
const CTX_FADE_MS=2500;          // how long it takes to go out
const CTX_CUT_MS=380;            // and how fast, when another row takes the gold
let CTX=[];                      // [{topic,label,source,tiles,at}], newest first

function ctxLoad(){
  try{
    const raw=localStorage.getItem(CTX_KEY);
    const parsed=raw ? JSON.parse(raw) : null;
    if(!Array.isArray(parsed)) return;
    CTX=parsed
      .filter(g=>g && typeof g.topic==='string' && Array.isArray(g.tiles) && g.tiles.length)
      .slice(0,CTX_MAX)
      .map(g=>({topic:g.topic, label:g.label||g.topic, source:g.source||'',
                tiles:g.tiles, at:Number(g.at)||Date.now()}));
  }catch(e){ CTX=[]; }
}
function ctxSave(){
  try{ localStorage.setItem(CTX_KEY,JSON.stringify(CTX)); }catch(e){}
}

/** How long ago a block was written, in the words a glance wants. */
function ctxAgo(at){
  const m=Math.floor((Date.now()-at)/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.floor(m/60);
  if(h<24) return h+'u ago';
  return Math.floor(h/24)+'d ago';
}

function ctxTile(t){
  const el=document.createElement('div');
  /* Every tile is drawn the same. `on` was a pack saying "this is the notable
     figure" and the gold said "this has just landed"; on a standing sheet of
     figures both read as a highlight that never quite went away. The panel says
     one thing now -- what the figures are. What is worth pointing at is pointed
     at in the window, where it is a row of a list. */
  el.className='tile';
  const n=document.createElement('div'); n.className='n'; n.textContent=t.label;
  const v=document.createElement('div'); v.className='v'; v.textContent=t.value;
  el.append(n,v);
  return el;
}


/* The panel is not scrollable, so what does not fit is not kept: blocks come off
   the bottom until the sheet is inside its column. The newest is at the top, so
   what goes is always the thing furthest from what is being said now. */
function ctxFit(){
  const host=$('#ctxGroups');
  let guard=CTX_MAX;
  while(CTX.length>1 && guard-->0 && host.scrollHeight>host.clientHeight+1){
    CTX.pop();
    drawContext();
  }
}

function renderContext(){
  drawContext();
  ctxFit();
}

function drawContext(){
  const host=$('#ctxGroups');
  host.replaceChildren();
  if(!CTX.length){
    const empty=document.createElement('div');
    empty.id='ctxEmpty';
    empty.textContent='nothing yet \u2014 ask about the weather, the mail or the agenda and it lands here';
    host.appendChild(empty);
    return;
  }
  for(const g of CTX){
    const sec=document.createElement('section');
    sec.className='ctxgroup';
    sec.dataset.topic=g.topic;
    const head=document.createElement('div'); head.className='gh';
    const name=document.createElement('span'); name.textContent=g.label;
    const when=document.createElement('span'); when.className='when'; when.textContent=ctxAgo(g.at);
    head.append(name,when);
    const tiles=document.createElement('div'); tiles.className='tiles';
    for(const t of g.tiles) tiles.appendChild(ctxTile(t));
    sec.append(head,tiles);
    host.appendChild(sec);
  }
}

/** Only the ages, so a repaint every minute does not restart every animation. */
function ctxRetime(){
  const groups=$('#ctxGroups').children;
  for(let i=0;i<groups.length;i++){
    const when=groups[i].querySelector('.when');
    if(when && CTX[i]) when.textContent=ctxAgo(CTX[i].at);
  }
}

/** A block goes up: newest first, replacing its own subject rather than adding. */
function ctxApply(entry){
  /* Landing time, not the moment the tool answered: a block is held back until
     its subject is spoken, and in a briefing that is a minute later. It is the
     "2m ago" next to the heading that would otherwise be wrong. */
  entry.at=Date.now();
  const at=CTX.findIndex(g=>g.topic===entry.topic);
  if(at>=0) CTX.splice(at,1);
  CTX.unshift(entry);
  while(CTX.length>CTX_MAX) CTX.pop();
  ctxSave();
  renderContext();
}

/* The words that mean a subject has come up. A block whose own figures are not
   quoted out loud -- "Rain 40 %" against "het blijft droog" -- still belongs on
   screen the moment the weather is the subject, and that is what these are for.
   Four letters minimum: a two-letter anchor matches half the language. */
const TOPIC_ANCHORS={
  weather:['weer','weersverwachting','verwachting','weather','forecast','graden','regen',
           'zonnig','bewolkt','wind','temperatuur','buiten'],
  mail:['mail','email','inbox','bericht','afzender','postvak'],
  agenda:['agenda','afspraak','afspraken','kalender','calendar'],
  house:['huis','thuis','lamp','lampen','licht','kamer','woonkamer','keuken','verwarming','house'],
  music:['muziek','spotify','nummer','liedje','playlist','afspelen','music'],
  messages:['telegram','bericht','message'],
  tv:['televisie','netflix','film','serie','kijken'],
  work:['werk','pull','request','pipeline','build','repo','ticket']
};

/** Has this block's subject actually come up in what has been spoken so far? */
function ctxCueReached(entry,said){
  const anchors=TOPIC_ANCHORS[entry.topic]||[entry.topic,entry.label];
  for(const word of anchors) if(saidWord(said,word)) return true;
  return mentions(said, entry.tiles.map(t=>t.label+' '+t.value).join(' '));
}

/* Figures arrive the moment their tool answered, which is a sentence or two
   before the subject comes up -- the same offset a displayed window has, and
   answered the same way: hold the block until he says it, and put up whatever
   is still waiting when the answer ends. */
let ctxQueue=[];

function onTiles(m){
  const tiles=Array.isArray(m.tiles) ? m.tiles : [];
  if(!tiles.length) return;
  const entry={
    topic: m.topic || m.source || 'context',
    label: m.topicLabel || m.source || 'Context',
    source: m.source || '',
    tiles,
    at: Date.now()
  };
  if(!turn){ ctxApply(entry); return; }
  ctxQueue.push(entry);
  startPump();
  pumpDisplays();
}

function dropTiles(){ ctxQueue=[]; }

/* The panel is furniture rather than a pop-up: it is on screen before the first
   question, filled with whatever the last session left behind. */
ctxLoad();
renderContext();
setInterval(ctxRetime, 60000);
addEventListener('resize', renderContext);
// Standing desk windows: last briefing's weather / agenda / mail / PRs / notes,
// or an empty placeholder so the five slots are always there after a reload.
restoreStickyDesk();

/* What the brain actually measures about itself, pushed over the socket every
   few seconds. This panel used to animate invented numbers; a value that could
   not be read is now an em dash and an empty bar, never a zero somebody might
   believe. */
let METRICS = null;

const GB = 1024*1024*1024;
const nf = new Intl.NumberFormat(undefined,{maximumFractionDigits:1});

function meterRows(){
  const m = METRICS || {};
  const pct = v => v==null ? null : Math.max(0,Math.min(100,Math.round(v*100)));
  const dur = ms => {
    if(ms==null) return null;
    const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), mi=Math.floor(s%3600/60);
    return d>0 ? d+'d '+h+'u' : h>0 ? h+'u '+mi+'m' : mi+'m';
  };
  return [
    {n:'CPU',      v:pct(m.cpuShare), u:m.cpuShare==null?null:nf.format(m.cpuShare*100)+' %'},
    {n:'Memory',   v:m.rssBytes==null?null:Math.min(100,Math.round(m.rssBytes/GB*50)),
                   u:m.rssBytes==null?null:nf.format(m.rssBytes/GB)+' GB'},
    {n:'Disk',     v:pct(m.diskUsed), u:m.diskUsed==null?null:Math.round(m.diskUsed*100)+' %'},
    {n:'Uptime',   v:null, u:dur(m.uptimeMs)},
    {n:'Last turn',v:null, u:lastTurnMs==null?null:(lastTurnMs/1000).toFixed(1)+' s'},
  ];
}

function renderMeters(){
  $('#meters').innerHTML = meterRows().map(m=>
    `<div class="meter"><div class="lab"><span>${m.n}</span><b>${m.u===null?'—':esc(m.u)}</b></div>
     <div class="bar">${m.v===null?'':`<i style="width:${m.v}%"></i>`}</div></div>`).join('');
}

function onMetrics(metrics){ METRICS = metrics; renderMeters(); }

/* The plan the brain runs on, in the two windows it is metered in: session
   (five hours) and week. Both when both are known, else the one the API named
   as binding. The dot turns amber past eighty percent and red when the plan
   is spent; the reset times are in the tooltip, because they are the answer
   to the only question a red dot raises. */
function onUsage(u){
  const el=$('#planState'), dot=$('#dPlan'), pill=$('#planPill');
  if(!u){ el.textContent='—'; dot.className='dot off'; pill.title=''; return; }
  const pct=w=>w&&w.utilization!=null?Math.round(w.utilization):null;
  const s=pct(u.session), w=pct(u.week);
  const bound = u.binding==='session'?s:u.binding==='week'?w:Math.max(s??-1,w??-1);
  if(s!==null && w!==null) el.textContent=s+'% / '+w+'%';
  else if(bound!==null && bound>=0) el.textContent=bound+'%'+(u.binding==='session'?' session':u.binding==='week'?' week':'');
  else el.textContent=u.status==='rejected'?'spent':'—';
  const when=x=>x&&x.resetsAt?new Date(x.resetsAt).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'}):'?';
  pill.title='session '+(s===null?'—':s+'%')+', resets '+when(u.session)+'\nweek '+(w===null?'—':w+'%')+', resets '+when(u.week);
  dot.className = u.status==='rejected' ? 'dot err' : (u.status==='warning' || (bound!==null && bound>=80)) ? 'dot warn' : 'dot';
}

/* The one latency the HUD already measured for itself. */
let lastTurnMs = null;

/* ============================== transcript ============================== */
/* scrolled up to read history: leave the view alone; at the bottom: follow along */
function logPinned(log){ return log.scrollTop+log.clientHeight>=log.scrollHeight-40; }
function line(who,cls){
  const el=document.createElement('div');
  el.className='msg '+cls;
  const w=document.createElement('span'); w.className='who'; w.textContent=who;
  const t=document.createElement('span'); t.className='txt';
  el.appendChild(w); el.appendChild(t);
  const log=$('#log');
  const pinned=logPinned(log);
  log.appendChild(el);
  while(log.children.length>200) log.removeChild(log.firstChild);
  if(pinned) log.scrollTop=log.scrollHeight;
  return t;
}
function push(who,txt,cls){ line(who,cls).textContent=txt; }
/* antwoord komt in brokken binnen: regel nu neerzetten, tekst later bijwerken */
function aiLine(){
  const t=line('jarvis','ai');
  return s=>{
    const log=$('#log');
    const pinned=logPinned(log);
    t.textContent=s;
    if(pinned) log.scrollTop=log.scrollHeight;
  };
}
const sys = t => push('system',t,'sys');
const you = t => { push('user',t,'user'); S.turns++; $('#turnCount').textContent=S.turns+' turns'; };

/* pipeline steps */
function resetSteps(){ document.querySelectorAll('.step').forEach(s=>{s.className='step';s.querySelector('.ms').textContent='';}); }
function stepActive(k){
  document.querySelectorAll('.step').forEach(s=>{
    if(s.dataset.s===k) s.classList.add('active');
  });
}
function stepDone(k,ms){
  const s=document.querySelector(`.step[data-s="${k}"]`);
  if(!s) return;
  s.classList.remove('active'); s.classList.add('done');
  s.querySelector('.ms').textContent=ms+'ms';
}

const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ============================== speech ============================== */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, recActive=false;

/* Which language JARVIS is spoken to in. The brain owns the setting: it says
   which one on connecting and again after every switch, from this page or any
   other, and the page only follows. Until it has said, English, which is where
   a deployment starts. Both halves of speech read this: what the browser
   transcribes, and the voice it reads an answer with when the brain cannot
   speak. */
const LANG_TAGS={en:'en-GB', nl:'nl-NL'};
const LANG_NAMES={en:'English', nl:'Dutch'};
speechLang='en'; speechTag=LANG_TAGS.en;

/* True when this changed the language. */
function applyLang(lang){
  if(!LANG_TAGS[lang]) return false;
  const changed=lang!==speechLang;
  speechLang=lang; speechTag=LANG_TAGS[lang];
  /* A recogniser that already exists keeps the language it was built with,
     so it is told rather than left listening for the wrong one. */
  if(rec) try{ rec.lang=speechTag; }catch(e){}
  const btn=$('#langBtn');
  if(btn){
    btn.querySelectorAll('[data-lang]').forEach(s=>s.classList.toggle('on', s.dataset.lang===lang));
    const other=lang==='en'?'nl':'en';
    btn.title='Speaking '+LANG_NAMES[lang]+' \u2014 switch to '+LANG_NAMES[other];
  }
  return changed;
}

/* Asks, and waits to be told: the brain answers every open page with the new
   language, this one included, so there is one path by which a page learns it. */
$('#langBtn').addEventListener('click', ()=>{
  const next=speechLang==='en'?'nl':'en';
  if(!connOk()){ sys('brain unreachable \u2014 language not switched'); return; }
  ws.send(JSON.stringify({kind:'set_lang', lang:next}));
});

function initSR(){
  if(!SR) return null;
  const r=new SR();
  r.lang=speechTag; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
  r.onresult=e=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    if(interim){
      $('#liveText').innerHTML=interim+'<span class="ghost"> …</span>';
      // je bent begonnen: laat het venster niet middenin je zin dichtvallen
      if(listeningOn()) followUntil = Math.max(followUntil, Date.now()+HEARD_MS);
    }
    if(final) collect(final);
    if(interim || final) armSilence();
  };
  r.onerror=e=>{ if(e.error!=='no-speech') sys('stt error: '+e.error); stopListen(); };
  r.onend=()=>{
    recActive=false;
    // Web Speech stopt zelf na een stilte; binnen het venster meteen weer aan
    if(!turn && listeningOn() && followRestarts<12){
      followRestarts++;
      try{ r.start(); recActive=true; return; }catch(e){}
    }
    if(listeningOn()) { endFollowUp(); return; }
    if(S.mode==='listening'){ setMode('idle'); idleLine(); }
  };
  return r;
}

/* The sheet is only ever fixed on the phone breakpoint, so its position answers
   "is there a space bar here" without a second copy of the breakpoint. */
function onPhone(){
  const a=document.querySelector('aside');
  return !!a && getComputedStyle(a).position==='fixed';
}
function idleLine(){
  const how = onPhone() ? 'hold the button to talk' : 'press space to talk';
  $('#liveText').innerHTML='<span class="ghost">'+how+', or type below</span>';
}

/* ---------- keeping the microphone open afterwards ----------
   A conversation rarely ends tidily at the answer: there is usually an "oh, and
   also...". So the microphone stays open briefly after every answer, and longer
   when JARVIS asked something back. Hearing you start extends the window, so it
   never cuts you off halfway through a sentence. */
const FOLLOWUP_MS = 7000;     // after a statement
const REPLY_MS    = 15000;    // after a question back
const HEARD_MS    = 8000;     // extension once you start speaking
let followUntil = 0, followTimer = null, followRestarts = 0;

const listeningOn = () => Date.now() < followUntil;

function startFollowUp(ms){
  if(turn || !connOk()) return;
  if(document.activeElement === $('#ask')) return;       // je bent aan het typen
  if(!SR && !micUsable()) return;
  followUntil = Date.now() + ms;
  followRestarts = 0;
  setMode('listening');
  $('#liveText').innerHTML='<span class="ghost">still listening…</span>';
  beginCapture(false);
  armFollowTimer();
}

function armFollowTimer(){
  clearTimeout(followTimer);
  const left = followUntil - Date.now();
  followTimer = setTimeout(()=>{ if(!turn && !listeningOn()) endFollowUp(); else if(!turn) armFollowTimer(); },
                           Math.max(250, left+250));
}

function endFollowUp(){
  followUntil = 0;
  clearTimeout(followTimer); followTimer=null;
  stopListen();
  if(!turn){ setMode('idle'); idleLine(); }
}

let t0=0;
function startListen(){
  if(recActive || mic.active || S.mode==='thinking' || S.mode==='speaking') return;
  resetSteps();
  setMode('listening');
  stepActive('stt');
  t0=performance.now();
  pending='';
  $('#liveText').textContent='';
  beginCapture(true);
}
function stopListen(){
  // keep what has already been said; only stop the silence timer
  clearTimeout(silenceTimer); silenceTimer=null;
  if(rec&&recActive){ try{rec.stop();}catch(e){} }
  recActive=false;
  micStop();
}


/* ============================== microfoon-opname (brein-transcriptie) ==============================
   The brain has a better transcriber than the browser has, and it runs on its own
   side. When it says it is available we push raw microphone audio over the same
   websocket — signed 16-bit little-endian, mono, 16 kHz, base64, ~100 ms per
   message — and the transcripts that come back drive exactly the same sentence
   collection as Web Speech does: partials show as the live line, settled text goes
   into collect(), and the silence timer decides when the sentence is finished.
   Says the brain no, or does capture fail here, then the Web Speech path above
   takes over unchanged. Never both at once, and never while JARVIS is talking. */
const CAP_SR      = 16000;   // what the brain wants
const CAP_CHUNK   = 1600;    // samples per message: 100 ms at 16 kHz
const CAP_PREROLL = 20;      // chunks we hold on to while the answer is pending (2 s)
const CAP_ANSWER_MS = 2000;  // no answer to listen_start within this: browser speech

/* Runs on the audio thread and does nothing but hand every frame to the page.
   Inlined through a blob: URL — the page CSP allows those, and it saves a second
   file to deploy and a second request before the first word is spoken. */
const CAP_WORKLET = `
class MicTap extends AudioWorkletProcessor {
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if(ch && ch.length) this.port.postMessage(new Float32Array(ch));
    return true;
  }
}
registerProcessor('mic-tap', MicTap);
`;

const mic = {
  active:false,        // capture is running
  avail:null,          // brain answer: null = still waiting, true/false = decided
  gen:0,               // bumped on every stop so late async work can bail out
  blocked:false,       // capture failed on this machine: stop asking for it
  reason:'',           // last reason we reported, so we say it only once
  ctx:null, stream:null, src:null, node:null, sink:null, answerTimer:null,
  queue:[],            // base64 chunks recorded before the answer arrived
  partial:'',          // newest unsettled transcript
  acc:0, accN:0, phase:0, ratio:1, last:0,
  bytes:new Uint8Array(CAP_CHUNK*2), view:null, fill:0
};
mic.view = new DataView(mic.bytes.buffer);

function micUsable(){
  return !mic.blocked && connOk()
      && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      && !!(window.AudioContext||window.webkitAudioContext);
}

/* one line in the log, the reason in the tooltip of the mic pill — no more */
function micNote(reason){
  const dot=$('#dMic');
  if(dot && dot.parentElement) dot.parentElement.title = reason || 'streaming to the brain transcriber';
  if(reason && reason!==mic.reason) sys('streaming transcription off — '+reason+' · browser speech takes over');
  mic.reason = reason || '';
}

/* start listening: brain transcriber first, Web Speech as the fallback */
function beginCapture(announce){
  if(micUsable()){ micStart(); return; }
  startSR(announce);
}

function startSR(announce){
  if(!rec) rec=initSR();
  if(rec && !recActive){ try{ rec.start(); recActive=true; }catch(e){} }
  if(!rec && announce) sys('Web Speech API unavailable in this browser — use the text field');
}

async function micStart(){
  if(mic.active) return;
  mic.active=true; mic.avail=null; mic.partial='';
  mic.queue.length=0;
  mic.acc=0; mic.accN=0; mic.phase=0; mic.last=0; mic.fill=0;
  const gen=++mic.gen;
  try{ ws.send(JSON.stringify({kind:'listen_start'})); }catch(e){}
  // a brain that does not answer at all must not leave the microphone open
  clearTimeout(mic.answerTimer);
  mic.answerTimer=setTimeout(()=>{
    if(mic.active && mic.avail===null) onListen({available:false, reason:'no answer from the brain'});
  }, CAP_ANSWER_MS);
  try{
    const ms = await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true
    }});
    // stopped while the permission dialog was open: drop it again right away
    if(gen!==mic.gen || !mic.active){ for(const t of ms.getTracks()){ try{ t.stop(); }catch(e){} } return; }
    mic.stream=ms;

    const AC=window.AudioContext||window.webkitAudioContext;
    actx = actx || new AC();              // the same input context the level meter uses
    const ctx = mic.ctx = actx;
    if(ctx.state==='suspended'){ try{ await ctx.resume(); }catch(e){} }
    if(gen!==mic.gen || !mic.active) return;

    mic.ratio = ctx.sampleRate / CAP_SR;
    mic.src = ctx.createMediaStreamSource(ms);

    let node;
    if(await micAddWorklet(ctx)){
      if(gen!==mic.gen || !mic.active) return;
      node = new AudioWorkletNode(ctx,'mic-tap',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
      node.port.onmessage = e => micFrames(e.data, gen);
    }else{
      // browser without AudioWorklet: then on the main thread after all
      node = ctx.createScriptProcessor(4096,1,1);
      node.onaudioprocess = e => micFrames(e.inputBuffer.getChannelData(0), gen);
    }
    mic.node=node;
    // a tap is only pulled when it reaches the destination, so it ends in a muted sink
    mic.sink = ctx.createGain();
    mic.sink.gain.value = 0;
    mic.src.connect(node);
    node.connect(mic.sink);
    mic.sink.connect(ctx.destination);
    micNote('');
  }catch(e){
    const why = (e && e.name==='NotAllowedError') ? 'microphone permission denied' : 'microphone capture failed';
    const listening = S.mode==='listening' || listeningOn();
    mic.blocked=true;
    micStop();
    micNote(why);
    if(listening) startSR(true);
  }
}

async function micAddWorklet(ctx){
  if(ctx.micTapReady) return true;                                  // one module per context
  if(!ctx.audioWorklet || typeof AudioWorkletNode!=='function') return false;
  const url=URL.createObjectURL(new Blob([CAP_WORKLET],{type:'text/javascript'}));
  try{ await ctx.audioWorklet.addModule(url); ctx.micTapReady=true; return true; }
  catch(e){ return false; }
  finally{ URL.revokeObjectURL(url); }
}

/* native rate -> 16 kHz. Every output sample is the average of the input samples
   inside its window: that is the low-pass a decimation needs, and it copes with
   44.1 kHz where the ratio is not a whole number. */
function micFrames(f32, gen){
  if(gen!==mic.gen || !mic.active || !f32 || !f32.length) return;
  if(turn || S.mode==='speaking' || S.mode==='thinking') return;    // never record over his voice
  const r=mic.ratio;
  for(let i=0;i<f32.length;i++){
    mic.acc+=f32[i]; mic.accN++; mic.phase++;
    while(mic.phase>=r){
      mic.phase-=r;
      let v = mic.accN ? mic.acc/mic.accN : mic.last;
      if(mic.accN){ mic.last=v; mic.acc=0; mic.accN=0; }
      v = v<-1 ? -1 : v>1 ? 1 : v;
      mic.view.setInt16(mic.fill*2, Math.round(v*32767), true);     // little-endian, explicitly
      if(++mic.fill>=CAP_CHUNK) micFlush();
    }
  }
}

function micFlush(){
  if(!mic.fill) return;
  const data=micB64(mic.bytes, mic.fill*2);
  mic.fill=0;
  if(mic.avail===false) return;                       // brain said no: throw it away
  if(mic.avail===null){                               // answer still pending: hold a little
    if(mic.queue.length<CAP_PREROLL) mic.queue.push(data);
    return;
  }
  if(!connOk()){ stopListen(); return; }              // socket gone: let go of the mic
  ws.send(JSON.stringify({kind:'listen_audio',data}));
}

function micB64(u8,len){
  let s='';
  for(let i=0;i<len;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,Math.min(len,i+0x8000)));
  return btoa(s);
}

/* the one door out: every path that ends listening comes through stopListen() */
function micStop(){
  const was=mic.active;
  clearTimeout(mic.answerTimer); mic.answerTimer=null;
  if(was && mic.avail===true) micFlush();             // the tail is still worth sending
  mic.gen++;
  mic.active=false; mic.avail=null; mic.partial='';
  mic.queue.length=0;
  mic.fill=0; mic.acc=0; mic.accN=0; mic.phase=0; mic.last=0;
  if(mic.node){
    try{ if(mic.node.port) mic.node.port.onmessage=null; }catch(e){}
    try{ mic.node.onaudioprocess=null; }catch(e){}
    try{ mic.node.disconnect(); }catch(e){}
    mic.node=null;
  }
  if(mic.src){ try{ mic.src.disconnect(); }catch(e){} mic.src=null; }
  if(mic.sink){ try{ mic.sink.disconnect(); }catch(e){} mic.sink=null; }
  if(mic.stream){
    for(const t of mic.stream.getTracks()){ try{ t.stop(); }catch(e){} }
    mic.stream=null;                                  // here the recording indicator goes out
  }
  mic.ctx=null;
  if(was && connOk()) ws.send(JSON.stringify({kind:'listen_stop'}));
}

/* ---------- answers from the brain ---------- */
function onListen(m){
  if(!mic.active) return;                             // answer to a session we already closed
  clearTimeout(mic.answerTimer); mic.answerTimer=null;
  if(m.available===true){
    mic.avail=true;
    micNote('');
    if(connOk()) for(const d of mic.queue) ws.send(JSON.stringify({kind:'listen_audio',data:d}));
    mic.queue.length=0;
    return;
  }
  const why=(typeof m.reason==='string' && m.reason) ? m.reason : 'no transcriber on the brain';
  const listening = S.mode==='listening' || listeningOn();
  mic.avail=false;
  micStop();                                          // releases the mic and closes the brain side
  micNote(why);
  if(listening) startSR(true);
}

function onTranscript(m){
  if(!mic.active || mic.avail!==true) return;
  const text = typeof m.text==='string' ? m.text.trim() : '';
  if(!text) return;
  if(m.final){
    mic.partial='';
    collect(text);
  }else{
    mic.partial=text;
    $('#liveText').innerHTML=esc(text)+'<span class="ghost"> …</span>';
    // je bent begonnen: laat het venster niet middenin je zin dichtvallen
    if(listeningOn()) followUntil = Math.max(followUntil, Date.now()+HEARD_MS);
  }
  armSilence();      // dezelfde stiltetimer beslist wanneer de zin af is
}


/* ============================== brein-verbinding ============================== */
const WS_PATH='/ws';
let ws=null, wsRetry=0, wsTimer=null, wsWasOpen=false, sessionId=null;

function connOk(){ return !!ws && ws.readyState===WebSocket.OPEN; }

function setConn(kind,label){
  $('#dWs').className = kind==='online' ? 'dot' : kind==='connecting' ? 'dot warn' : 'dot off';
  $('#wsState').textContent=label;
}

function connect(){
  clearTimeout(wsTimer);
  setConn('connecting','connecting…');
  const proto = location.protocol==='https:' ? 'wss://' : 'ws://';
  let sock;
  try{ sock=new WebSocket(proto+location.host+WS_PATH); }
  catch(e){ scheduleReconnect(); return; }
  ws=sock;

  sock.onopen=()=>{ wsRetry=0; wsWasOpen=true; setConn('online','online'); };
  sock.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m && typeof m.kind==='string') onBrainMessage(m);
  };
  sock.onerror=()=>{};
  sock.onclose=()=>{
    if(ws!==sock) return;
    ws=null;
    if(wsWasOpen){ wsWasOpen=false; sys('lost connection to the brain'); }
    failTurn('no connection');
    scheduleReconnect();
  };
}

/* exponentiële backoff: 1s, 2s, 4s … max 30s */
function scheduleReconnect(){
  const delay=Math.min(30000, 1000*Math.pow(2,wsRetry++));
  setConn('offline','offline · retrying in '+Math.round(delay/1000)+'s');
  wsTimer=setTimeout(connect,delay);
}

/* ============================== beurten ============================== */
const STAGE_STEP={ stt:'stt', llm:'llm', memory:'llm', tool:'act', tts:'tts' };
const STAGE_MODE={ stt:'listening', llm:'thinking', memory:'thinking', tool:'thinking', tts:'speaking' };

let turn=null;          // the turn in progress, or null
let errTimer=null;

function onBrainMessage(m){
  if(m.kind==='ready'){
    sessionId = (m.sessionId===undefined) ? null : m.sessionId;
    /* The version comes from the brain. It used to sit in the markup, where it
       drifted three releases behind what was actually running. */
    if(m.version) $('#brandSub').textContent = 'v'+m.version+' \u00b7 local pipeline';
    setConn('online','online');
    sys('brain connected'+(sessionId?' · session '+sessionId:''));
    greetOnArrival();
    document.dispatchEvent(new Event('jarvis:ready'));
    return;
  }
  if(m.kind==='error'){
    if(m.turnId && (!turn || m.turnId!==turn.id)) return;   // fout van een oude beurt
    brainError(m.message||'unknown error');
    return;
  }
  if(m.kind==='health'){ onHealth(m.checks||[]); return; }
  if(m.kind==='metrics'){ onMetrics(m.metrics||{}); return; }
  if(m.kind==='usage'){ onUsage(m.usage||null); return; }
  if(m.kind==='desk'){ applyDeskSlots(m.slots||[]); return; }
  if(m.kind==='tiles'){ onTiles(m); return; }
  if(m.kind==='display_clear'){ clearDisplay(m.id); return; }
  if(m.kind==='listen'){ onListen(m); return; }
  if(m.kind==='transcript'){ onTranscript(m); return; }
  if(m.kind==='announce'){ speakUnprompted(m.text, m.lang); return; }
  if(m.kind==='lang'){
    if(applyLang(m.lang)) sys('speaking '+LANG_NAMES[m.lang]);
    return;
  }
  if(!turn || m.turnId!==turn.id) return;                   // late brok van een afgebroken beurt
  if(m.kind==='display') onDisplay(m);
  else if(m.kind==='voice') onVoice(m);
  else if(m.kind==='audio') onAudio(m);
  else if(m.kind==='audio_done') onAudioDone(m);
  else if(m.kind==='activity') onActivity(m);
  else if(m.kind==='text') onText(m);
  else if(m.kind==='done') onDone(m);
}

/* The probes are also the only honest answer to "what can you do", which the
   tour asks for at its last step. Kept here rather than recomputed there: a
   promise assembled anywhere else is a promise nothing measured. */
let lastChecks=[];
window.jarvisHealth=()=>lastChecks;

/* The real probe results. A roll call of every server by name is a lot of log
   for the ordinary answer, which is that they all replied -- and the log holds
   eight lines, so it pushes the greeting off the top to say nothing. So the
   ordinary answer is one line, and only what is actually wrong is named: a
   cross and the reason per broken server, a dot per one that was never
   configured. */
function onHealth(checks){
  lastChecks=checks;
  const down = checks.filter(c=>c.state==='down');
  const off  = checks.filter(c=>c.state==='off');
  if(!down.length && !off.length){
    sys('All servers online');
  } else {
    down.forEach(c=>sys('✗ '+c.server+' — '+c.detail+(c.ms!==undefined?' ('+c.ms+' ms)':'')));
    off.forEach(c=>sys('· '+c.server+' — not configured'));
    /* Said only when there is something left to say it about: with one server
       configured and that one down, "all other servers online" is a line about
       nothing. */
    if(checks.length - down.length - off.length > 0) sys('All other servers online');
  }
  housePill(checks.find(c=>c.server==='ha'));
}

/* The pill used to say ONLINE unconditionally, house or no house. It now says
   what the probe said: answered, did not answer, or not configured. No row at
   all means no house pack was loaded, which reads the same as not configured. */
function housePill(check){
  const dot=$('#dHa'), label=$('#haState');
  const state = check ? check.state : 'off';
  const words = { ok:'online', down:'unreachable', off:'not configured' };
  label.textContent = words[state] || 'unknown';
  dot.className = 'dot' + (state==='ok' ? '' : ' off');
  dot.title = check && check.detail ? check.detail : '';
}

/* mcp__ha__get_state -> "reading values": the status line exists to show what it
   is doing, not to repeat an identifier out of the source. */
const TOOL_TEXT={
  ha__get_state:'reading values',
  ha__search:'finding the entity',
  ha__history:'looking back',
  ha__area:'checking the room',
  ha__template:'working it out',
