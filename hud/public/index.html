  memory__recall:'checking memory',
  memory__remember:'remembering this',
  memory__forget:'forgetting this',
  display__show_image:'putting an image on screen',
  display__show_camera:'fetching the camera',
  display__show_panel:'putting the overview on screen',
  display__show_chart:'drawing the chart',
  display__show_note:'putting the note on screen',
  'weather__get_weather_forecast':'fetching the forecast',
  'mail__get_recent_mail':'reading recent mail',
  insight__anomalies:'checking for anything unusual'
};
function toolText(label){
  const key=String(label).replace(/^mcp__/,'');
  if(TOOL_TEXT[key]) return TOOL_TEXT[key];
  if(key.includes('__')) return key.split('__').slice(1).join(' ').replace(/_/g,' ');
  return null;                      // 'thinking' and the like: the state label already says that
}

/* `turn.answering` is set by the first word of the answer proper. A line the
   brain says to fill a silence ("Momentje.") arrives as text too, but flagged
   as an opening, and does not count: the pipeline is still fetching and this
   panel goes on saying what. Before that flag existed the opening line put the
   turn in "responding" and every tool call after it went unshown. */
function onActivity(m){
  const step=STAGE_STEP[m.stage];
  const mode=STAGE_MODE[m.stage];
  if(mode && !turn.answering) setMode(mode);
  if(step && step!==turn.step){
    if(turn.step) stepDone(turn.step, Math.round(performance.now()-turn.stepAt));
    turn.step=step; turn.stepAt=performance.now();
    stepActive(step);
  }
  const doing = m.label ? toolText(m.label) : null;
  if(doing && !turn.answering) $('#liveText').innerHTML='<span class="ghost">'+esc(doing)+'…</span>';
  keepVoiceAlive();
}

function onText(m){
  if(typeof m.text!=='string' || !m.text) return;
  if(!turn.stream){
    // The first words of the turn, opening or answer: one line in the log, one
    // stream to the voice, and the voice's window starts now.
    turn.render=aiLine();
    turn.stream=createSpeechStream(turn.render);
    if(turn.voiceOk) attachVoiceStream(turn.stream);
    armVoiceFallback();
  }
  if(m.opening!==true && !turn.answering){
    turn.answering=true;
    if(turn.step && turn.step!=='tts') stepDone(turn.step, Math.round(performance.now()-turn.stepAt));
    turn.step='tts'; turn.stepAt=performance.now(); stepActive('tts');
    setMode('speaking');
    $('#liveText').textContent='';
  }
  keepVoiceAlive();
  turn.stream.push(m.text);
}

async function onDone(m){
  const t=turn;
  const dur = typeof m.durationMs==='number' ? m.durationMs : performance.now()-t.t0;
  $('#lat').textContent=(dur/1000).toFixed(1)+'s';
  lastTurnMs = dur; renderMeters();
  if(t.stream){ t.stream.close(); await t.stream.done; }
  flushDisplays();                           // niets laten wachten op een woord dat niet meer komt
  if(m.briefing===true) settleDesk();        // the briefing is over: everything down on the desk
  if(turn!==t) return;                       // ondertussen afgebroken of vervangen
  voiceStop();
  if(t.step){ stepDone(t.step, Math.round(performance.now()-t.stepAt)); t.step=null; }
  if(!t.stream) sys('no answer received');
  turn=null;
  await wait(400);
  if(turn) return;
  startFollowUp(m.expectsReply ? REPLY_MS : FOLLOWUP_MS);
  if(!listeningOn()){ setMode('idle'); idleLine(); }
}

function brainError(message){
  voiceStop();
  dropDisplays();
  if(turn){ if(turn.stream) turn.stream.abort(); turn=null; }
  resetSteps();
  sys('error: '+message);
  setMode('error');
  $('#liveText').innerHTML='<span class="ghost">'+esc(message)+'</span>';
  clearTimeout(errTimer);
  errTimer=setTimeout(()=>{ if(S.mode==='error' && !turn){ setMode('idle'); idleLine(); } },2600);
}

/* beurt sneuvelt zonder antwoord (socket weg) */
function failTurn(reason){
  voiceStop();
  dropDisplays();
  if(!turn) return;
  if(turn.stream) turn.stream.abort();
  turn=null;
  resetSteps();
  sys('turn abandoned — '+reason);
  setMode('idle'); idleLine();
}

/* gebruiker onderbreekt */
function cancelTurn(){
  if(!turn) return;
  if(connOk()) ws.send(JSON.stringify({kind:'cancel',turnId:turn.id}));
  voiceStop();
  dropDisplays();
  if(turn.stream) turn.stream.abort();
  turn=null;
  resetSteps();
  setMode('idle'); idleLine();
}

function sendUtterance(text,keepSteps){
  text=(text||'').trim();
  if(!text) return;
  if(!connOk()){
    sys('brain unreachable — nothing sent');
    resetSteps();
    setMode('idle'); idleLine();
    return;
  }
  if(turn) cancelTurn();
  voiceStop();
  followUntil=0; clearTimeout(followTimer); followTimer=null;
  clearTransientDisplay();   // whatever was there belonged to the previous question
  clearTimeout(errTimer);
  if(!keepSteps) resetSteps();
  const id=crypto.randomUUID();
  turn={ id, t0:performance.now(), step:null, stepAt:0, stream:null, render:null, voiceOk:false, answering:false };
  you(text);
  $('#liveText').textContent='';
  setMode('thinking');
  turn.step='llm'; turn.stepAt=performance.now(); stepActive('llm');
  ws.send(JSON.stringify({kind:'utterance',text,turnId:id}));
}

/* Have JARVIS say something of his own accord: no question, no model, just the
   voice. English carries the echo effect and Dutch stays dry — the brain decides
   which. */
function announce(text,lang){
  text=(text||'').trim();
  if(!text) return null;
  if(!connOk()){ sys('brain unreachable — nothing spoken'); return null; }
  if(turn) cancelTurn();
  voiceStop();
  followUntil=0; clearTimeout(followTimer); followTimer=null;
  clearTransientDisplay();
  clearTimeout(errTimer);
  resetSteps();
  const id=crypto.randomUUID();
  turn={ id, t0:performance.now(), step:null, stepAt:0, stream:null, render:null, voiceOk:false, answering:false };
  $('#liveText').textContent='';
  setMode('speaking');
  turn.step='tts'; turn.stepAt=performance.now(); stepActive('tts');
  ws.send(JSON.stringify(LANG_TAGS[lang] ? {kind:'say',text,turnId:id,lang} : {kind:'say',text,turnId:id}));
  return id;
}
window.jarvisAnnounce=announce;

/* The brain has something to say while nobody asked (a fix that fell over).
   That may be spoken, but not straight through an answer in progress:
   announce() cancels the turn, and a failed build is not worth cutting somebody
   off mid-sentence for. So it waits for the turn to finish — and not forever,
   because a turn that hangs would swallow the notice for good. The written
   channel has it either way. */
const ANNOUNCE_WAIT_MS=60000, ANNOUNCE_POLL_MS=300;
let announceTimer=null;
function speakUnprompted(text,lang){
  text=(text||'').trim();
  if(!text) return;
  clearInterval(announceTimer);
  if(!turn){ announce(text,lang); return; }
  const until=performance.now()+ANNOUNCE_WAIT_MS;
  announceTimer=setInterval(()=>{
    if(turn && performance.now()<until) return;
    clearInterval(announceTimer); announceTimer=null;
    if(!turn) announce(text,lang);
    else sys('not spoken (a turn was still running): '+text);
  },ANNOUNCE_POLL_MS);
}

/* ---------- greeting on arrival ----------
   Open the HUD with ?greet=1 and JARVIS says hello by himself. Ten lines that
   mean the same thing, picked at random, so unlocking the laptop twice in a row
   does not sound like a recording. English, so the voice gets its echo.
   No model is asked anything: this is the `say` path, straight to the voice. */
const GREETINGS=[
  'All systems online. Ready for your command.',
  'All systems nominal. Ready when you are, sir.',
  'Everything is running. Standing by, sir.',
  'Systems check complete. At your service.',
  'Online and listening. What can I do for you?',
  'All green across the board. Ready when you are.',
  'Back with you, sir. Everything is in order.',
  'Systems are up. Awaiting your instructions.',
  'Welcome back, sir. All systems steady.',
  'Powered up and standing by, sir.'
];

const WANTS_GREETING = new URLSearchParams(location.search).has('greet');
let greeted=false;

/* Only on the first connect of the page: a reconnect after a dropped socket is
   not a new arrival, and being greeted again mid-conversation is worse than
   silence. */
function greetOnArrival(){
  if(!WANTS_GREETING || greeted) return;
  greeted=true;
  setTimeout(()=>{
    if(turn) return;                      // someone was faster than the timer
    announce(GREETINGS[Math.floor(Math.random()*GREETINGS.length)],'en');
  },600);
}

/* The HUD window stays open across a lock, so the page is not reloaded on the
   next unlock and the arrival greeting above would only ever fire once. Coming
   back to a window that has been away long enough is an arrival too: locking
   the screen hides the window, alt-tabbing away blurs it, and either counts.
   The minute of absence is what keeps clicking back into the HUD silent. */
const AWAY_MS=60000;
let awaySince=0;

function markAway(){ if(!awaySince) awaySince=Date.now(); }

function markBack(){
  if(!WANTS_GREETING) return;
  const away=awaySince ? Date.now()-awaySince : 0;
  awaySince=0;
  if(away<AWAY_MS || turn) return;
  greeted=false;
  greetOnArrival();
}

document.addEventListener('visibilitychange',()=>{ document.hidden ? markAway() : markBack(); });
window.addEventListener('blur',markAway);
window.addEventListener('focus',markBack);

/* ---------- waiting until you have actually finished ----------
   The Web Speech API closes a phrase the moment you draw breath, so the pieces
   are collected first and only go to the brain after a silence. When the tail
   sounds like half a sentence ("and...", "so...") it waits longer. The pattern
   is Dutch because the speech is. */
const SILENCE_MS = 1500;
const SILENCE_UNFINISHED_MS = 2600;
const UNFINISHED = /(,|(en|of|maar|dus|want|omdat|zodat|die|dat|als|met|voor|naar|om|te|bij|in|op)\s*)$/i;

let pending='', silenceTimer=null;

function collect(fragment){
  pending = (pending + ' ' + fragment).replace(/\s+/g,' ').trim();
}

function armSilence(){
  clearTimeout(silenceTimer);
  const wait = UNFINISHED.test(pending) ? SILENCE_UNFINISHED_MS : SILENCE_MS;
  silenceTimer = setTimeout(flushUtterance, wait);
}

function flushUtterance(){
  clearTimeout(silenceTimer); silenceTimer=null;
  // the brain may still be sitting on an unsettled transcript: use what we heard
  if(!pending && mic.partial) collect(mic.partial);
  mic.partial='';
  const text = pending.trim();
  pending='';
  if(!text){
    followUntil=0;
    stopListen();
    if(!turn){ setMode('idle'); idleLine(); }
    return;
  }
  stopListen();
  stepDone('stt', Math.round(performance.now()-t0));
  sendUtterance(text,true);
}

let ttsPulse=false;
let speakSeq=0;

/* voices load asynchronously; getVoices() is empty on the first call */
function voicesReady(){
  return new Promise(res=>{
    if(speechSynthesis.getVoices().length) return res();
    let settled=false;
    const done=()=>{ if(settled) return; settled=true; speechSynthesis.onvoiceschanged=null; res(); };
    speechSynthesis.onvoiceschanged=done;
    setTimeout(done,1000);
  });
}

function pickVoice(){
  const vs=speechSynthesis.getVoices();
  const tag=speechTag, short=tag.split('-')[0];
  return vs.find(v=>v.lang===tag&&v.localService) || vs.find(v=>v.lang.startsWith(short)) || null;
}

/* Chrome silently stops an utterance after ~15s, so speak in shorter chunks */
function splitForTTS(text,max=180){
  const parts=[]; let buf='';
  const push=s=>{ s=s.trim(); if(s) parts.push(s); };
  for(const sentence of text.split(/(?<=[.!?…])\s+/)){
    if((buf+' '+sentence).trim().length<=max){ buf=(buf?buf+' ':'')+sentence; continue; }
    push(buf); buf='';
    let rest=sentence;
    while(rest.length>max){
      let cut=rest.lastIndexOf(',',max);
      if(cut<40) cut=rest.lastIndexOf(' ',max);
      if(cut<40) cut=max;
      push(rest.slice(0,cut));
      rest=rest.slice(cut).replace(/^[,\s]+/,'');
    }
    buf=rest;
  }
  push(buf);
  return parts;
}

/* rough speaking speed, only used until a boundary event corrects it */
const TTS_CPS=15;

/* resolves when the whole text has been spoken, or when a newer speak() supersedes it.
   onProgress(charIndex) reports how far into `text` the voice is. */
async function speak(text,onProgress){
  if(!window.speechSynthesis) return false;
  const seq=++speakSeq;
  speechSynthesis.cancel();
  speechSynthesis.resume();          // clears a stuck paused state
  await voicesReady();
  if(seq!==speakSeq) return false;

  const chunks=splitForTTS(text);
  const voice=pickVoice();
  // chunks are trimmed, so map each one back onto its position in the full text
  let cur=0;
  const offs=chunks.map(c=>{ const at=text.indexOf(c,cur); const p=at<0?cur:at; cur=p+c.length; return p; });
  const report=n=>{ if(onProgress&&seq===speakSeq) onProgress(Math.min(text.length,n)); };

  // drive the orb from TTS timing when there is no mic signal
  if(!analyser) ttsPulse=true;

  await new Promise(resolve=>{
    let i=0, tick=null;
    const stopTick=()=>{ clearInterval(tick); tick=null; };
    const next=()=>{
      stopTick();
      if(seq!==speakSeq) return resolve();     // superseded, leave state to the new call
      if(i>=chunks.length){ ttsPulse=false; report(text.length); return resolve(); }
      const ci=i++, chunk=chunks[ci], base=offs[ci];
      const u=new SpeechSynthesisUtterance(chunk);
      u.lang=speechTag; u.rate=1.03; u.pitch=0.92;
      if(voice) u.voice=voice;
      u.onstart=()=>{
        const t=performance.now();
        // estimate progress inside the chunk; boundary events override it when supported
        tick=setInterval(()=>report(base+Math.min(chunk.length,(performance.now()-t)/1000*TTS_CPS*u.rate)),40);
      };
      u.onboundary=e=>{ stopTick(); report(base+(e.charIndex||0)); };
      u.onend=()=>{ report(base+chunk.length); next(); };
      u.onerror=next;
      speechSynthesis.speak(u);
    };
    next();
  });
  return true;
}


/* ---------- streaming answer ----------
   Text arrives in chunks. A sentence is spoken the moment it is complete, and
   the typewriter on the live line is paced by the voice (onboundary) exactly as
   it would be for an answer that arrived all at once. */
const SENTENCE_END=/[.!?…]["'’”)\]]*(\s|$)/;

function createSpeechStream(render, fallbackSpeed=30){
  render('');
  let full='', spoken=0, target=0, shown=0;
  let closed=false, aborted=false, wake=null, settle=null;
  /* brain voice: the reveal is paced by the audio player instead of speechSynthesis */
  let voiceMode=false, voiceDone=false;

  const iv=setInterval(()=>{
    if(shown>=target) return;
    shown=Math.min(target, shown+Math.max(1,Math.ceil((target-shown)/6)));
    render(full.slice(0,shown));
  },30);

  /* the next chunk that is safe to speak, or null to wait a moment longer */
  function takeSegment(){
    const rest=full.slice(spoken);
    if(!rest.trim()) return null;
    const m=SENTENCE_END.exec(rest);
    // a full stop right at the end may still be inside a number or an abbreviation,
    // so it only counts once whitespace follows it or the stream has closed
    if(m && (m[1] || closed)) return rest.slice(0, m.index+m[0].length);
    if(closed) return rest;
    if(rest.length>200){                       // heel lange zin: knip op een spatie
      const cut=rest.lastIndexOf(' ',200);
      if(cut>40) return rest.slice(0,cut+1);
    }
    return null;
  }

  /* geen TTS beschikbaar: gewoon uittypen */
  async function typeOut(to){
    while(target<to && !aborted){
      target=Math.min(to,target+1);
      await wait(fallbackSpeed);
    }
  }

  async function run(){
    for(;;){
      if(aborted) break;
      if(voiceMode){
        // the brain speaks this turn: voiceProgress() moves `target`, nothing to say here
        if(closed && voiceDone) break;
        await new Promise(r=>{ wake=r; });
        continue;
      }
      const seg=takeSegment();
      if(seg===null){
        if(closed) break;
        await new Promise(r=>{ wake=r; });     // wacht op nieuwe tekst of close()
        continue;
      }
      const base=spoken;
      spoken+=seg.length;
      const spoke=await speak(seg, n=>{ if(base+n>target) target=base+n; });
      if(aborted) break;
      if(!spoke) await typeOut(spoken);
      else if(!voiceMode && target<spoken) target=spoken;
    }
    clearInterval(iv);
    if(!aborted){ target=shown=full.length; render(full); }
    settle();
  }

  const done=new Promise(r=>{ settle=r; });
  run().catch(()=>{ clearInterval(iv); settle(); });

  const kick=()=>{ if(wake){ const w=wake; wake=null; w(); } };

  const api = {
    push(t){ if(aborted||closed) return; full+=t; kick(); },
    close(){ closed=true; kick(); },
    abort(){
      if(aborted) return;
      aborted=true; closed=true;
      speakSeq++; ttsPulse=false;
      try{ speechSynthesis.cancel(); }catch(e){}
      detachVoiceStream(api);
      clearInterval(iv);
      kick();
    },
    /* the brain has a voice for this turn: silence the browser voice, wait for audio */
    useVoice(){
      if(aborted||voiceMode) return;
      voiceMode=true;
      speakSeq++; ttsPulse=false;
      try{ speechSynthesis.cancel(); }catch(e){}
      kick();
    },
    /* audio never showed up: hand the turn back to speechSynthesis */
    dropVoice(){
      if(!voiceMode) return;
      voiceMode=false; voiceDone=false;
      kick();
    },
    /* reveal up to character `n` of the answer */
    voiceProgress(n){
      if(!voiceMode||aborted) return;
      const v=clamp(Math.round(n),0,full.length);
      if(v>target) target=v;
    },
    voiceFinished(){ if(!voiceMode) return; voiceDone=true; kick(); },
    get usingVoice(){ return voiceMode; },
    get text(){ return full; },
    /* how much of the answer is on screen, which is what the display waits for */
    get revealed(){ return shown; },
    done
  };
  return api;
}

/* tekst die al compleet is: zelfde motor, in één keer gevoerd */
function speakTyped(text,render,fallbackSpeed=30){
  const s=createSpeechStream(render??(()=>{}),fallbackSpeed);
  s.push(text); s.close();
  return s.done;
}


/* ============================== brein-stem (ElevenLabs / Fish Audio) ==============================
   The brain streams raw PCM over the same websocket: signed 16-bit little-endian,
   mono, 16 kHz, base64 per chunk. Chunks are scheduled back to back on one
   AudioContext so they play gapless, and the per-character alignment that comes
   with them (ElevenLabs sends it, Fish does not) paces the typewriter on the
   transcript line. Without it the reveal is paced by the audio's length at a
   speaking rate learnt from the turns before it, and when the last chunk is in,
   whatever is still unrevealed is spread over the audio still to play, so the
   last word shows as it is heard. Everything below falls back to
   speechSynthesis the moment the brain says it cannot speak. */
const VOICE_SR       = 16000;
const VOICE_LEAD     = 0.12;    // jitter buffer before the first chunk of a turn
const VOICE_FIRST_MS = 9000;    // no audio at all within this -> browser voice
                                // (a cold agent session takes six seconds to
                                //  its first word, and speaking the answer in
                                //  the wrong voice is worse than waiting)
/* the speaking rate assumed for audio that came without timings, in
   characters of transcript per second of sound. The default is a guess; the
   rate measured on each finished turn is folded into what the page remembers
   per language, so a voice that speaks faster than the guess is caught up with
   in a turn or two rather than putting every later word late. */
const VOICE_CPS_DEFAULT = 17;
const VOICE_CPS_MIN     = 8;
const VOICE_CPS_MAX     = 30;
const VOICE_CPS_LEARN   = 0.4;  // weight of the latest turn against what was remembered
const VOICE_STALL_MS = 20000;   // stream died mid-answer -> reveal the rest
                                // (an answer that speaks a line, fetches for
                                //  half a minute and then speaks the rest is
                                //  silent in between by design; the timer is
                                //  re-armed on every sign of life, so this only
                                //  has to outlast the slowest single tool)

/* the echo: a short delay whose repeats darken as they fade, mixed in beside the
   dry voice. Nothing is baked into the audio -- the brain sends the same PCM
   either way and the browser decides how the room sounds. */
const ECHO_DELAY   = 0.105;   // seconds; short enough to read as a room, not a canyon
const ECHO_FEEDBACK= 0.24;    // how much of each repeat feeds the next
const ECHO_DAMP    = 3200;    // Hz; every repeat loses its top end
const ECHO_WET     = 0.30;    // level of the repeats against the dry voice
const ECHO_RAMP    = 0.06;    // seconds; fade the wet path rather than clicking it

/* the timbre: what turns a stock voice into something that belongs on a
   bridge. The brain sends the same PCM either way -- this is entirely the
   browser's doing, so it costs no credit and no latency, and JARVIS_VOICE_TIMBRE
   decides how far it goes. Every value below scales off that one number, so
   0 is literally the dry voice and 100 is a machine that has given up on
   sounding human. */
const TIMBRE_HP     = [120, 360];   // Hz, at 0 and at 100: the chest goes first
const TIMBRE_PEAK   = 2600;         // Hz; the consonant band a small speaker pushes
const TIMBRE_PEAK_DB= 8;            // dB at 100
const TIMBRE_COMB   = 0.0075;       // seconds; short enough to read as metal, not echo
const TIMBRE_COMB_FB= 0.45;         // at 100
const TIMBRE_TAIL   = 0.085;        // seconds; the room the comb sits in
const TIMBRE_TAIL_FB= 0.35;         // at 100
const TIMBRE_TAIL_LP= 3500;         // Hz; the tail loses its top end
const TIMBRE_WET    = 0.55;         // at 100
const TIMBRE_RING   = 42;           // Hz; slow enough to buzz rather than whistle
const TIMBRE_RING_DEPTH = 0.25;     // at 100
const TIMBRE_RAMP   = 0.08;         // seconds; never step a gain

const voice = {
  ctx:null, gain:null, an:null, freq:null, echo:null, fx:'none',
  timbre:null, timbreAmount:0,
  turnId:null, ok:false, done:false, blocked:false, gapWarned:false, armed:false,
  stream:null,                  // the speech stream whose text we are pacing
  sources:new Set(),            // scheduled buffer sources, for a hard stop
  nextStart:0,                  // running schedule cursor, in context time
  playing:false,
  timeline:[],                  // {at: contextTime, n: characters revealed}
  charCursor:0, lastN:0, lastSeq:null,
  estimated:false,              // some chunk came without timings: the pace is guessed
  audioSec:0,                   // sound scheduled this turn, for the rate it turns out to have
  firstTimer:null, stallTimer:null, ticker:null
};

function setVoiceState(kind,label,reason){
  const dot=$('#dVoice'), lab=$('#voiceState');
  if(!dot||!lab) return;
  dot.className = kind==='brain' ? 'dot' : kind==='blocked' ? 'dot warn' : 'dot off';
  lab.textContent=label;
  if(dot.parentElement) dot.parentElement.title = reason || '';
}

function ensureVoiceCtx(){
  if(voice.ctx) return voice.ctx;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ voice.ctx=new AC({sampleRate:VOICE_SR}); }
  catch(e){ try{ voice.ctx=new AC(); }catch(e2){ return null; } }
  voice.gain=voice.ctx.createGain();
  voice.gain.gain.value=1;
  voice.an=voice.ctx.createAnalyser();
  voice.an.fftSize=512;
  voice.an.smoothingTimeConstant=0.7;
  voice.freq=new Uint8Array(voice.an.frequencyBinCount);
  voice.gain.connect(voice.an);
  voice.an.connect(voice.ctx.destination);
  buildEcho(voice.ctx);
  buildTimbre(voice.ctx);
  return voice.ctx;
}

/* dry path stays untouched; the wet path hangs beside it and is silent until a
   turn asks for it, so a Dutch answer sounds exactly as it did before. */
function buildEcho(ctx){
  if(voice.echo) return;
  try{
    const delay=ctx.createDelay(1);
    delay.delayTime.value=ECHO_DELAY;
    const fb=ctx.createGain();
    fb.gain.value=ECHO_FEEDBACK;
    const damp=ctx.createBiquadFilter();
    damp.type='lowpass';
    damp.frequency.value=ECHO_DAMP;
    const wet=ctx.createGain();
    wet.gain.value=0;
    voice.gain.connect(delay);
    delay.connect(damp);
    damp.connect(fb);
    fb.connect(delay);            // the loop that makes it a tail instead of one slap
    delay.connect(wet);
    wet.connect(voice.an);
    voice.echo={delay,fb,damp,wet};
  }catch(e){ voice.echo=null; }
}

/* The chain is always built and always in the dry path, wired for silence: at
   amount 0 every wet gain is zero and the filters sit outside the voice's own
   band, so it is the untouched voice going through more nodes. That is on
   purpose -- the alternative is rebuilding the graph while audio is scheduled
   on it, and a click in the middle of a sentence is worse than four idle
   nodes. Only the numbers move. */
function buildTimbre(ctx){
  if(voice.timbre) return;
  try{
    const hp=ctx.createBiquadFilter();
    hp.type='highpass'; hp.frequency.value=TIMBRE_HP[0];
    const peak=ctx.createBiquadFilter();
    peak.type='peaking'; peak.frequency.value=TIMBRE_PEAK; peak.Q.value=1.1; peak.gain.value=0;

    const dry=ctx.createGain(); dry.gain.value=1;
    const wet=ctx.createGain(); wet.gain.value=0;

    const comb=ctx.createDelay(0.05); comb.delayTime.value=TIMBRE_COMB;
    const combFb=ctx.createGain(); combFb.gain.value=0;
    const tail=ctx.createDelay(0.5); tail.delayTime.value=TIMBRE_TAIL;
    const tailFb=ctx.createGain(); tailFb.gain.value=0;
    const tailLp=ctx.createBiquadFilter();
    tailLp.type='lowpass'; tailLp.frequency.value=TIMBRE_TAIL_LP;

    // ring modulation is an oscillator writing into a gain, not a node type of
    // its own: the carrier rides on the output level, which is what gives the
    // buzz under the voice instead of beside it.
    const ring=ctx.createGain(); ring.gain.value=1;
    const osc=ctx.createOscillator(); osc.frequency.value=TIMBRE_RING;
    const depth=ctx.createGain(); depth.gain.value=0;
    osc.connect(depth); depth.connect(ring.gain); osc.start();

    voice.gain.disconnect(voice.an);
    voice.gain.connect(hp);
    hp.connect(peak);
    peak.connect(dry);
    peak.connect(comb);
    comb.connect(combFb); combFb.connect(comb);
    comb.connect(tail); tail.connect(tailLp); tailLp.connect(tailFb); tailFb.connect(tail);
    comb.connect(wet); tailLp.connect(wet);
    dry.connect(ring); wet.connect(ring);
    ring.connect(voice.an);

    voice.timbre={hp,peak,dry,wet,combFb,tailFb,depth};
    setVoiceTimbre(voice.timbreAmount);
  }catch(e){ voice.timbre=null; }
}

/* amount is 0-100; everything below is that number in another unit */
function setVoiceTimbre(amount){
  const a=Math.max(0,Math.min(100,Number(amount)||0))/100;
  voice.timbreAmount=a*100;
  const chain=voice.timbre, ctx=voice.ctx;
  if(!chain||!ctx) return;
  const at=ctx.currentTime;
  const ramp=(param,value)=>{
    try{
      param.cancelScheduledValues(at);
      param.setTargetAtTime(value, at, TIMBRE_RAMP);
    }catch(e){ param.value=value; }
  };
  ramp(chain.hp.frequency, TIMBRE_HP[0] + (TIMBRE_HP[1]-TIMBRE_HP[0])*a);
  ramp(chain.peak.gain,    TIMBRE_PEAK_DB*a);
  ramp(chain.dry.gain,     1 - 0.45*a);
  ramp(chain.wet.gain,     TIMBRE_WET*a);
  ramp(chain.combFb.gain,  TIMBRE_COMB_FB*a);
  ramp(chain.tailFb.gain,  TIMBRE_TAIL_FB*a);
  ramp(chain.depth.gain,   TIMBRE_RING_DEPTH*a);
}

/* The deployment decides how coloured the voice is, so the page asks rather
   than assumes. It arrives long before the first answer; if it somehow does
   not, the chain is already there at zero and the next update simply moves it. */
fetch('/api/config').then(r=>r.json()).then(cfg=>{
  if(cfg && cfg.speechLang) applyLang(cfg.speechLang);
  const amount=Number(cfg && cfg.voiceTimbre);
  if(!Number.isFinite(amount)) return;
  voice.timbreAmount=amount;
  setVoiceTimbre(amount);
}).catch(()=>{});

/* 'echo' for the English system lines, 'none' for everything else */
function setVoiceFx(kind){
  voice.fx = kind==='echo' ? 'echo' : 'none';
  const e=voice.echo, ctx=voice.ctx;
  if(!e||!ctx) return;
  const target = voice.fx==='echo' ? ECHO_WET : 0;
  try{
    e.wet.gain.cancelScheduledValues(ctx.currentTime);
    e.wet.gain.setTargetAtTime(target, ctx.currentTime, ECHO_RAMP);
  }catch(err){ e.wet.gain.value=target; }
}

/* browsers keep the context suspended until the user has touched the page */
function resumeVoiceCtx(){
  const ctx=voice.ctx;
  if(!ctx || ctx.state!=='suspended') return;
  ctx.resume().then(()=>{
    if(voice.blocked){ voice.blocked=false; setVoiceState(voice.ok?'brain':'off', voice.ok?'brain':'local'); }
  }).catch(()=>{});
}

function noteAudioBlocked(){
  const ctx=voice.ctx;
  if(!ctx || ctx.state!=='suspended' || voice.blocked) return;
  voice.blocked=true;
  setVoiceState('blocked','tap','click anywhere to allow audio playback');
  sys('audio playback is blocked — click anywhere to allow sound');
}

/* base64 -> Float32, via signed 16-bit little-endian samples */
function pcm16ToFloat32(b64){
  const bin=atob(b64);
  const n=bin.length>>1;
  const out=new Float32Array(n);
  for(let i=0;i<n;i++){
    let v=(bin.charCodeAt(i*2+1)<<8)|bin.charCodeAt(i*2);
    if(v>=0x8000) v-=0x10000;
    out[i]=v/32768;
  }
  return out;
}

/* char timings -> reveal marks on the same clock the audio is scheduled on */
function pushVoiceTimeline(start,duration,alignment){
  const chars=alignment&&Array.isArray(alignment.chars)?alignment.chars:null;
  if(chars&&chars.length){
    const st=Array.isArray(alignment.startMs)?alignment.startMs:[];
    const du=Array.isArray(alignment.durMs)?alignment.durMs:[];
    for(let i=0;i<chars.length;i++){
      const a=Number(st[i])||0, d=Number(du[i])||0;
      voice.timeline.push({ at:start+(a+d)/1000, n:voice.charCursor+i+1 });
    }
    voice.charCursor+=chars.length;
    return;
  }
  // no alignment: pace the reveal by elapsed audio time at the learnt rate
  voice.estimated=true;
  const total=Math.max(1,Math.round(duration*voiceCps()));
  for(let i=1;i<=total;i++){
    voice.timeline.push({ at:start+duration*(i/total), n:voice.charCursor+i });
  }
  voice.charCursor+=total;
}

/* characters per second this language's voice is assumed to speak */
function voiceCps(){
  try{
    const v=parseFloat(localStorage.getItem('voiceCps.'+speechLang));
    if(v>=VOICE_CPS_MIN && v<=VOICE_CPS_MAX) return v;
  }catch(e){}
  return VOICE_CPS_DEFAULT;
}

/* the turn has been heard to the end: what rate did it turn out to have? Only
   a turn that was paced by guesswork teaches anything, and only a turn long
   enough for the silences between sentences to average out. */
function learnVoiceCps(){
  const s=voice.stream;
  if(!s||!voice.estimated||!voice.done||voice.audioSec<4) return;
  const chars=s.text.length;
  if(chars<60) return;
  const seen=clamp(chars/voice.audioSec, VOICE_CPS_MIN, VOICE_CPS_MAX);
  const next=voiceCps()*(1-VOICE_CPS_LEARN)+seen*VOICE_CPS_LEARN;
  try{ localStorage.setItem('voiceCps.'+speechLang, next.toFixed(2)); }catch(e){}
}

/* the last chunk is in and the answer is fully written: whatever the guessed
   pace has not revealed yet is spread over the sound still to play, so the
   transcript reaches its last word as the voice does rather than seconds
   after. A turn paced on real timings needs none of this. */
function repaceVoiceTail(){
  const ctx=voice.ctx, s=voice.stream;
  if(!ctx||!s||!voice.estimated) return;
  const now=ctx.currentTime;
  let n=voice.lastN;
  while(voice.timeline.length && voice.timeline[0].at<=now) n=voice.timeline.shift().n;
  voice.timeline.length=0;
  const total=s.text.length, left=total-n, span=voice.nextStart-now;
  if(left<=0 || span<=0.05){ voice.timeline.push({ at:now, n:total }); return; }
  for(let i=1;i<=left;i++) voice.timeline.push({ at:now+span*(i/left), n:n+i });
}

function voiceEnqueue(pcm,alignment){
  const ctx=ensureVoiceCtx();
  if(!ctx) return;
  resumeVoiceCtx();
  noteAudioBlocked();
  let buf;
  try{
    buf=ctx.createBuffer(1,pcm.length,VOICE_SR);
    buf.copyToChannel(pcm,0);
  }catch(e){ return; }
  const src=ctx.createBufferSource();
  src.buffer=buf;
  src.connect(voice.gain);
  const now=ctx.currentTime;
  // keep a running cursor so consecutive chunks butt up against each other
  const start = voice.nextStart>now+0.01 ? voice.nextStart : now+VOICE_LEAD;
  try{ src.start(start); }catch(e){ return; }
  voice.sources.add(src);
  src.onended=()=>{ voice.sources.delete(src); try{ src.disconnect(); }catch(e){} };
  voice.nextStart=start+buf.duration;
  voice.playing=true;
  voice.audioSec+=buf.duration;
  pushVoiceTimeline(start,buf.duration,alignment);
  startVoiceTicker();
}

function startVoiceTicker(){
  if(!voice.ticker) voice.ticker=setInterval(voiceTick,40);
}

function voiceTick(){
  const ctx=voice.ctx;
  if(!ctx) return;
  const t=ctx.currentTime;
  let n=-1;
  while(voice.timeline.length && voice.timeline[0].at<=t) n=voice.timeline.shift().n;
  if(n>=0){
    voice.lastN=n;
    if(voice.stream) voice.stream.voiceProgress(n);
  }
  if(t>=voice.nextStart-0.01){
    voice.playing=false;
    if(voice.done && !voice.timeline.length) voiceFinish();
  }
}

/* everything played: let the transcript settle on the full answer */
function voiceFinish(){
  const s=voice.stream;
  learnVoiceCps();
  voiceStop();
  if(s) s.voiceFinished();
}

/* hard stop: nothing of this turn may reach the speakers any more */
function voiceStop(){
  clearTimeout(voice.firstTimer); voice.firstTimer=null;
  clearTimeout(voice.stallTimer); voice.stallTimer=null;
  clearInterval(voice.ticker);    voice.ticker=null;
  for(const src of voice.sources){
    try{ src.onended=null; src.stop(); }catch(e){}
    try{ src.disconnect(); }catch(e){}
  }
  voice.sources.clear();
  voice.timeline.length=0;
  voice.turnId=null; voice.ok=false; voice.done=false; voice.gapWarned=false;
  voice.stream=null; voice.nextStart=0; voice.playing=false;
  voice.charCursor=0; voice.lastN=0; voice.lastSeq=null;
  voice.estimated=false; voice.audioSec=0;
  setVoiceFx('none');
  if(!voice.blocked) setVoiceState('off','local');
}

function attachVoiceStream(stream){
  if(!voice.ok||!stream) return;
  voice.stream=stream;
  stream.useVoice();
  if(voice.lastN>0) stream.voiceProgress(voice.lastN);
}

function detachVoiceStream(stream){
  if(voice.stream===stream) voiceStop();
}

function armVoiceStall(){
  clearTimeout(voice.stallTimer);
  voice.stallTimer=setTimeout(()=>{
    if(!voice.ok||voice.done) return;
    sys('voice stream stalled — showing the rest of the answer');
    voiceFinish();
  },VOICE_STALL_MS);
}

/* the turn is still going: text or a tool call means the silence is work, not a
   dead stream. Only re-arms a timer that is already running, so nothing here can
   start the stall clock before the first chunk of audio has been heard. */
function keepVoiceAlive(){
  if(voice.stallTimer!==null) armVoiceStall();
}

/* ---------- messages from the brain ---------- */
function onVoice(m){
  voiceStop();
  turn.voiceOk = m.available===true;
  if(!turn.voiceOk){
    const why=typeof m.reason==='string'&&m.reason ? m.reason : 'no voice for this answer';
    setVoiceState('off','local',why);
    sys('brain voice unavailable — '+why);
    if(turn.stream) turn.stream.dropVoice();
    return;
  }
  voice.turnId=turn.id;
  voice.ok=true;
  setVoiceState('brain','brain');
  ensureVoiceCtx();
  resumeVoiceCtx();
  setVoiceFx(m.fx);
  if(turn.stream) attachVoiceStream(turn.stream);
  // the countdown starts at the first word, not here: the brain says it will
  // speak as soon as its socket is up, and everything between that and the
  // first word is thinking -- a tool call, a cold session -- which is not the
  // voice being slow. Arming here made a long answer fall back before it had
  // begun.
  voice.armed=false;
}

/* the answer has started; give the voice its window */
function armVoiceFallback(){
  if(!voice.ok || voice.armed) return;
  voice.armed=true;
  clearTimeout(voice.firstTimer);
  voice.firstTimer=setTimeout(()=>{
    const s=voice.stream;
    voiceStop();
    setVoiceState('off','local','no audio arrived from the brain');
    sys('no audio from the brain — local voice takes over');
    if(s) s.dropVoice();
  },VOICE_FIRST_MS);
}

function onAudio(m){
  if(!voice.ok || m.turnId!==voice.turnId) return;      // superseded turn: never play it
  if(typeof m.data!=='string' || !m.data) return;
  clearTimeout(voice.firstTimer); voice.firstTimer=null;
  if(typeof m.seq==='number'){
    if(voice.lastSeq!==null && m.seq!==voice.lastSeq+1 && !voice.gapWarned){
      voice.gapWarned=true;
      sys('gap in the voice stream — audio may skip');
    }
    voice.lastSeq=m.seq;
  }
  let pcm;
  try{ pcm=pcm16ToFloat32(m.data); }catch(e){ return; }
  if(!pcm.length) return;
  voiceEnqueue(pcm,m.alignment);
  armVoiceStall();
}

function onAudioDone(m){
  if(!voice.ok || m.turnId!==voice.turnId) return;
  clearTimeout(voice.firstTimer); voice.firstTimer=null;
  clearTimeout(voice.stallTimer); voice.stallTimer=null;
  voice.done=true;
  repaceVoiceTail();
  startVoiceTicker();
  voiceTick();
}

/* the orb runs on the real playback level while the brain is talking */
function readVoiceLevel(){
  const ctx=voice.ctx;
  if(!ctx||!voice.an||!voice.playing) return false;
  if(ctx.currentTime>voice.nextStart+0.05){ voice.playing=false; return false; }
  voice.an.getByteFrequencyData(voice.freq);
  const N=voice.freq.length;
  let sum=0;
  for(let i=0;i<64;i++){
    const lo=Math.floor(Math.pow(i/64,1.7)*N*0.7);
    const hi=Math.max(lo+1,Math.floor(Math.pow((i+1)/64,1.7)*N*0.7));
    let mx=0; for(let j=lo;j<hi;j++) mx=Math.max(mx,voice.freq[j]);
    const v=mx/255;
    S.bins[i]=lerp(S.bins[i],v,0.35);
    sum+=v;
  }
  const level=clamp((sum/64)*2.4,0,1);
  S.amp=lerp(S.amp,level,level>S.amp?0.5:0.12);
  return true;
}

/* ============================== loop ============================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  S.t+=dt;
  S.hue = lerp(S.hue, S.targetHue, 0.06);
  document.documentElement.style.setProperty('--hue', S.hue.toFixed(1));

  readAudio();
  if(!readVoiceLevel() && ttsPulse && !analyser){
    S.amp = lerp(S.amp, 0.35+Math.abs(Math.sin(S.t*9))*0.45, 0.25);
  }
  drawOrb(dt);
  drawWave();
  requestAnimationFrame(frame);
}

/* ============================== clock ============================== */
function tick(){
  const d=new Date();
  $('#clockT').textContent=d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  $('#clockD').textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(tick,1000); tick();


/* ============================== wiring ============================== */
$('#btnMic').onclick=()=>enableMic();

const askForm=$('#askForm'), askInput=$('#ask');
askForm.addEventListener('submit',e=>{
  e.preventDefault();
  const v=askInput.value;
  askInput.value='';
  stopListen();
  sendUtterance(v);
});

addEventListener('keydown',e=>{
  const el=e.target;
  if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return;   // niet in het tekstveld
  if(e.code==='Space'){
    e.preventDefault();
    if(S.mode==='listening') flushUtterance();
    else if(turn) cancelTurn();
    else startListen();
  }
  if(e.key==='1') setMode('idle');
  if(e.key==='2') setMode('listening');
  if(e.key==='3') setMode('thinking');
  if(e.key==='4') setMode('speaking');
});

/* ============================== phone ==============================
   A phone has no space bar, so the button below is what the space bar is:
   hold to listen, let go to send. Both handlers here are pointer-driven and
   hang off elements the phone breakpoint is the only thing that sizes, so on a
   wider screen neither of them is reachable. */
const btnTalk=$('#btnTalk');
let holding=false;

btnTalk.addEventListener('pointerdown',async e=>{
  e.preventDefault();
  if(holding) return;
  holding=true;
  btnTalk.classList.add('held');
  try{ btnTalk.setPointerCapture(e.pointerId); }catch(err){}
  resumeVoiceCtx();
  if(turn) cancelTurn();                 // holding it while I talk interrupts me
  if(!S.micOn) await enableMic();         // the first hold is also the permission prompt
  if(holding) startListen();              // unless it was let go while the prompt was up
});
function talkEnd(){
  if(!holding) return;
  holding=false;
  btnTalk.classList.remove('held');
  if(S.mode==='listening') flushUtterance();
}
btnTalk.addEventListener('pointerup',talkEnd);
btnTalk.addEventListener('pointercancel',talkEnd);
btnTalk.addEventListener('contextmenu',e=>e.preventDefault());

/* The transcript sheet. Drag distance decides open or shut; a press that moved
   less than a few pixels was a tap, and a tap toggles. */
const sheet=document.querySelector('aside'), grip=$('#sheetGrip');
let sheetDrag=null;

function setSheet(open){
  document.body.classList.toggle('sheet-open',open);
  grip.setAttribute('aria-expanded',open?'true':'false');
}
grip.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const span=Math.max(1,sheet.getBoundingClientRect().height-grip.offsetHeight);
  sheetDrag={y:e.clientY,span,at:null,moved:false,
             open:document.body.classList.contains('sheet-open')};
  sheet.classList.add('dragging');
  try{ grip.setPointerCapture(e.pointerId); }catch(err){}
});
grip.addEventListener('pointermove',e=>{
  if(!sheetDrag) return;
  const dy=e.clientY-sheetDrag.y;
  if(Math.abs(dy)>5) sheetDrag.moved=true;
  sheetDrag.at=clamp((sheetDrag.open?0:sheetDrag.span)+dy,0,sheetDrag.span);
  sheet.style.setProperty('--sheet-y',sheetDrag.at+'px');
});
function sheetEnd(){
  if(!sheetDrag) return;
  const d=sheetDrag; sheetDrag=null;
  sheet.classList.remove('dragging');
  sheet.style.removeProperty('--sheet-y');
  setSheet(d.moved ? d.at<d.span/2 : !d.open);
}
grip.addEventListener('pointerup',sheetEnd);
grip.addEventListener('pointercancel',sheetEnd);

addEventListener('pointerdown',resumeVoiceCtx);
addEventListener('keydown',resumeVoiceCtx);

<script>
'use strict';
/* A walk across the screen, scripted here and nowhere else: no model is asked
   anything, so it says the same seven things on a machine with no packs, no
   house, no microphone and no API key — which is exactly the machine most
   likely to need it. What it claims about the install it reads off the same
   probes the pills do. */
(function(){

/* Storage that throws (private mode, a browser with cookies off) counts as
   "already seen": asking on every single load is worse than never asking. */
const SEEN='jarvis.tour.v1';
function seen(){ try{ return localStorage.getItem(SEEN)==='1'; }catch(e){ return true; } }
function markSeen(){ try{ localStorage.setItem(SEEN,'1'); }catch(e){} }

/* Browsers hand out no microphone outside a secure origin, and a self-signed
   certificate is only trusted on the machine that installed it. That is the
   whole of the difference between "the mic button is broken" and "this page is
   on http". */
const micPossible = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

function say(line){
  if(line && typeof window.jarvisAnnounce==='function') window.jarvisAnnounce(line,'en');
}

function checks(){
  const got = typeof window.jarvisHealth==='function' ? window.jarvisHealth() : null;
  return Array.isArray(got) ? got : [];
}
/* Packs only. The two rows core always contributes are no answer to "what can
   you do here": an install that reaches nothing still has a display and a
   memory. */
function packs(state){
  return checks().filter(c=>c.pack===true && c.state===state).map(c=>c.server);
}

/* The phone layout has no space bar and no left-hand column, so the first two
   steps would otherwise describe furniture that is not there. onPhone comes
   from the main script, which this block already leans on for the voice. */
const phone = onPhone;

const STEPS=[
  {
    at:'main',
    title:'Talking to me',
    say:()=>phone()
      ? 'Start here. Hold the round button at the bottom and talk to me, or type in the field beside it.'
      : 'Start here. Press the space bar and talk to me, or type in the field at the bottom.',
    text:()=>(phone()
        ? 'Holding the round button listens and letting go sends; hold it while I am talking and I stop '+
          'and listen instead. The field beside it sends whatever you type. '
        : 'Space starts listening; press it again while I am talking and I stop. Enter sends '+
          'whatever you typed. ')+
      'The orb shows which of the two is happening. '+
      (micPossible
        ? (phone()
            ? 'The first hold is also where your browser asks about the microphone.'
            : 'The button at the bottom right asks your browser for the microphone.')
        : 'The microphone will stay unavailable here: your browser only grants one on an origin it '+
          'trusts, and this page is not on one. Typing works regardless.')
  },
  {
    at:'#logPanel',
    title:'What was said',
    say:()=>'Everything either of us says lands in the transcript '+
      (phone() ? 'in the sheet at the bottom.' : 'on the left.'),
    text:()=>(phone() ? 'Drag the bar along the bottom of the screen to pull it up or push it away. ' : '')+
      'Your words and mine in order, with the occasional line from the machine itself. It keeps '+
      'the last two hundred, and scrolling up stops it following along until you scroll back down.'
  },
  {
    at:'#pipePanel',
    title:'Where the time goes',
    say:'Under it, the four stages every question passes through, and what each one cost.',
    text:()=>'Speech to text, working out what you meant, doing it, and speaking back. The milliseconds '+
      'are measured on this machine rather than estimated, and a stage that did not run stays blank.'
  },
  {
    at:'#contextPanel',
    // The whole column is missing on a narrow screen: skip the step rather than
    // describe furniture nobody can see.
    on:'aside:last-of-type',
    title:'What we are talking about',
    say:()=> CTX.length
      ? 'One block per subject, and each lights up gold at the moment I get to it.'
      : 'One block per subject appears here as I get to it, and stays until I read that subject again.',
    text:()=>'The weather, the mail, the agenda: each gets its own block, and each is replaced only '+
      'by a newer reading of itself — asking about the weather no longer throws away what the mail '+
      'said. A block goes up on the word rather than when its tool answered, and glows gold while it '+
      'is new. The figures come out of that pack’s own code, never out of something I said, and '+
      'the sheet survives closing this page.'
  },
  {
    at:'#systemPanel',
    title:'How I am doing',
    say:'Below that, five readings about me rather than about your house.',
    text:()=>'CPU is my share of one core, memory is what the process holds, disk is the volume the data '+
      'sits on, uptime is how long I have been running, and last turn is what your previous question '+
      'took end to end. An em dash means the figure could not be read — never a zero you might believe.'
  },
  {
    at:'header .pills',
    title:'The row along the top',
    say:'The pills at the top are the short version: house, microphone, brain, voice, latency.',
    text:()=>'Every one of them is a probe result rather than a hope. The transcript carries the same thing '+
      'per server: a tick means it answered, a cross means it is broken and says why, and a middle dot '+
      'means it was never configured.'
  },
  {
    at:null,
    title:'What I can do right now',
    say:()=>{
      const up=packs('ok');
      return up.length
        ? 'Right now I can reach '+up.join(', ')+'. Ask for those in your own words.'
        : 'Nothing is loaded, so for now all I can do is talk.';
    },
    text:()=>{
      const up=packs('ok'), down=packs('down');
      if(!up.length){
        return 'No pack answered, so talking is the whole of it — packs are what give me hands. '+
          'examples/pack in this repository is the smallest one that loads: copy it into packs/, '+
          'restart me, and it turns up in the row above.'+
          (down.length ? ' Loaded but not answering: '+down.join(', ')+'.' : '');
      }
      return 'Answering: '+up.join(', ')+'. Ask for those in your own words — you never have to name '+
        'them, or name a tool.'+(down.length ? ' Loaded but not answering: '+down.join(', ')+'.' : '');
    }
  }
];

let card=null, eyebrow=null, title=null, body=null, back=null, next=null;
let at=-1, here=null;

function build(){
  card=document.createElement('div');
  card.id='tourCard';
  card.hidden=true;
  card.setAttribute('role','dialog');
  card.setAttribute('aria-live','polite');

  const close=document.createElement('button');
  close.id='tourClose'; close.type='button';
  close.setAttribute('aria-label','end the tour');
  close.textContent='×';
  close.addEventListener('click',stop);

  eyebrow=document.createElement('div'); eyebrow.className='eyebrow';
  title=document.createElement('h4');
  body=document.createElement('p');

  back=document.createElement('button');
  back.id='tourBack'; back.className='btn'; back.type='button'; back.textContent='Back';
  next=document.createElement('button');
  next.id='tourNext'; next.className='btn primary'; next.type='button'; next.textContent='Next';

  const row=document.createElement('div');
  row.className='row'; row.append(back,next);
  card.append(close,eyebrow,title,body,row);
  document.body.appendChild(card);
}

function onScreen(selector){
  const node=document.querySelector(selector);
  return !!node && node.getBoundingClientRect().width>0;
}

function spot(selector){
  if(here){ here.classList.remove('tour-here'); here=null; }
  if(!selector || !onScreen(selector)) return;
  here=document.querySelector(selector);
  /* On a phone the transcript sits in a sheet parked off the bottom of the
     screen. Ringing a step that is parked rings nothing at all. */
  if(phone() && here.closest('aside')){
    document.body.classList.add('sheet-open');
    document.querySelector('#sheetGrip').setAttribute('aria-expanded','true');
  }
  here.classList.add('tour-here');
}

const read = v => typeof v==='function' ? v() : v;

/* Fixed when the tour starts rather than per step: the narrow layout drops a
   whole column, and a tour that renumbers itself halfway is worse than one
   that decided up front. */
let plan=STEPS;

function show(i){
  at=i;
  const step=plan[i];
  spot(step.at);
  eyebrow.textContent='Tour · '+(i+1)+' of '+plan.length;
  title.textContent=step.title;
  body.textContent=read(step.text);
  back.disabled = i===0;
  back.textContent='Back';
  next.textContent = i===plan.length-1 ? 'Done' : 'Next';
  card.hidden=false;
  say(read(step.say));
}

function stop(){
  markSeen();
  spot(null);
  at=-1;
  if(card) card.hidden=true;
}

function start(){
  markSeen();
  if(!card) build();
  plan=STEPS.filter(step=>!step.at || onScreen(step.on||step.at));
  back.onclick=()=>{ if(at>0) show(at-1); };
  next.onclick=()=>{ at<plan.length-1 ? show(at+1) : stop(); };
  show(0);
}

/* The offer is silent on purpose. No browser plays audio before the page has
   been touched, so a first visitor would be asked out loud a question they
   cannot hear. From the button onwards there has been a click, and the voice
   works. */
function offer(){
  if(seen()) return;
  // Standing desk already filled the screen: do not cover the open orb.
  if(typeof deskRestoredAtBoot!=='undefined' && deskRestoredAtBoot) return;
  if(!card) build();
  spot(null);
  eyebrow.textContent='J.A.R.V.I.S';
  title.textContent='Shall I show you around?';
  body.textContent='It looks like your first time on this screen. In about a minute I can walk you '+
    'through what the panels are, what the numbers mean, and what I can actually do here. Say no and '+
    'I will not ask again — the button at the top starts it whenever you want.';
  back.disabled=false;
  back.textContent='Not now';
  next.textContent='Show me';
  back.onclick=stop;
  next.onclick=start;
  card.hidden=false;
}

const button=document.createElement('button');
button.className='tour-open'; button.type='button'; button.textContent='Tour';
button.addEventListener('click',()=>{ if(at<0) start(); else stop(); });
const pills=document.querySelector('header .pills');
if(pills) pills.appendChild(button);

addEventListener('keydown',e=>{ if(e.key==='Escape' && card && !card.hidden) stop(); });

/* Only once the brain has answered: the tour says what this install can do, and
   before the socket is up the honest answer is "nothing", which is a lie about
   ten seconds later. */
document.addEventListener('jarvis:ready',()=>setTimeout(offer,1200),{once:true});

})();
</script>

<script>
'use strict';
/* Memory panel — reads /api/config, /api/memory; edits via PATCH/DELETE.
   Everything lives in this IIFE; nothing outside this block is referenced. */
(function(){

const API_CONFIG = '/api/config';
const API_MEMORY = '/api/memory';
const LIMIT       = 200;
const DEBOUNCE_MS = 250;

let mode = 'off';            // 'off' | 'read' | 'edit'
let open = false;
let counts = {facts:0, core:0, turns:0};
let listSeq = 0;             // guards against out-of-order search responses
let searchAbort = null;
let searchTimer = null;
let lastFocus = null;

/* ---------- tiny helpers ---------- */
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
};
const fmtDate = iso => {
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
};
const sourceLabel = src => src === 'jarvis' ? 'concluded' : 'told';

async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---------- markup (built once, only when the flag allows it) ---------- */
let overlay, panel, listNode, searchNode, countNodes, openBtn, openCount;

function buildEntry(){
  openBtn = el('button','mem-open');
  openBtn.type = 'button';
  openBtn.setAttribute('aria-haspopup','dialog');
  openBtn.append(el('i'), document.createTextNode('Memory '));
  openCount = el('b','', String(counts.facts));
  openBtn.append(openCount);
  openBtn.addEventListener('click', openPanel);
  const pills = document.querySelector('header .pills');
  if(pills) pills.appendChild(openBtn);
}

function buildOverlay(){
  overlay = el('div'); overlay.id = 'memOverlay'; overlay.hidden = true;

  panel = el('div'); panel.id = 'memPanel';
  panel.setAttribute('role','dialog');
  panel.setAttribute('aria-modal','true');
  panel.setAttribute('aria-label','Memory');

  const frame = el('div','mem-frame');
  frame.append(el('span'),el('span'),el('span'),el('span'));

  const head = el('div','mem-head');
  head.appendChild(el('h2','','Memory'));
  const cts = el('div','mem-counts');
  countNodes = {};
  for(const key of ['facts','core','turns']){
    const wrap = el('span','', '');
    const b = el('b','', '0');
    wrap.append(b, document.createTextNode(' ' + key));
    countNodes[key] = b;
    cts.appendChild(wrap);
  }
  const closeBtn = el('button','', '×');
  closeBtn.id = 'memClose'; closeBtn.type = 'button';
  closeBtn.setAttribute('aria-label','Close memory');
  closeBtn.title = 'Close (Esc)';
  closeBtn.addEventListener('click', closePanel);
  head.append(cts, closeBtn);

  const tools = el('div','mem-tools');
  searchNode = el('input');
  searchNode.id = 'memSearch';
  searchNode.type = 'search';
  searchNode.spellcheck = false;
  searchNode.setAttribute('aria-label','Search remembered facts');
  searchNode.placeholder = 'search memory…';
  searchNode.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => load(searchNode.value), DEBOUNCE_MS);
  });
  tools.appendChild(searchNode);

  listNode = el('div'); listNode.id = 'memList';

  panel.append(frame, head, tools, listNode);
  overlay.appendChild(panel);
  overlay.addEventListener('mousedown', e => { if(e.target === overlay) closePanel(); });
  document.body.appendChild(overlay);

  /* Capture phase on window runs before the HUD's own keydown listener, so while
     the overlay is open space / 1-4 never reach it. */
  addEventListener('keydown', e => {
    if(!open) return;
    if(e.key === 'Escape'){
      e.preventDefault();
      e.stopPropagation();
      const row = overlay.querySelector('.mem-fact[data-confirm="1"]');
      if(row) resetConfirm(row); else closePanel();
      return;
    }
    e.stopPropagation();        // HUD shortcuts stay silent while we are open
  }, true);
}

/* ---------- open / close ---------- */
function openPanel(){
  if(mode === 'off' || open) return;
  open = true;
  lastFocus = document.activeElement;
  overlay.hidden = false;
  searchNode.focus();
  load(searchNode.value);
}

function closePanel(){
  if(!open) return;
  open = false;
  clearTimeout(searchTimer);
  if(searchAbort){ searchAbort.abort(); searchAbort = null; }
  overlay.hidden = true;
  if(lastFocus && lastFocus.isConnected) lastFocus.focus();
  else if(openBtn) openBtn.focus();
}

/* ---------- list ---------- */
function status(text, bad){
  const n = el('div','mem-status' + (bad ? ' bad' : ''), text);
  listNode.replaceChildren(n);
}

function setCounts(c){
  counts = Object.assign({facts:0,core:0,turns:0}, c || {});
  if(openCount) openCount.textContent = String(counts.facts);
  if(countNodes){
    for(const key of ['facts','core','turns']) countNodes[key].textContent = String(counts[key]);
  }
}

async function load(query){
  const seq = ++listSeq;
  if(searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  if(!listNode.firstChild) status('loading…');
  try{
    const url = API_MEMORY + '?query=' + encodeURIComponent(query || '') + '&limit=' + LIMIT;
    const data = await api(url, {signal: searchAbort.signal});
    if(seq !== listSeq) return;
    setCounts(data.counts);
    const facts = Array.isArray(data.facts) ? data.facts : [];
    if(!facts.length){
      status(query ? 'nothing matches “' + query + '”' : 'nothing remembered yet');
      return;
    }
    listNode.replaceChildren(...facts.map(row));
  }catch(err){
    if(err && err.name === 'AbortError') return;
    if(seq !== listSeq) return;
    status('could not load memory — ' + err.message, true);
  }
}

/* ---------- one fact ---------- */
function row(f){
  const node = el('div','mem-fact' + (f.core ? ' core' : ''));
  node.dataset.id = f.id;

  const top = el('div','mem-top');
  top.appendChild(el('div','mem-subject', f.subject || '—'));
  top.appendChild(el('span','mem-tag', f.kind || ''));
  top.appendChild(el('span','mem-tag src', sourceLabel(f.source)));

  const actions = el('div','mem-actions');
  const note = el('div','mem-note');
  note.hidden = true;

  if(mode === 'edit'){
    const coreBtn = el('button','mem-tag', 'core');
    coreBtn.type = 'button';
    coreBtn.setAttribute('aria-pressed', f.core ? 'true' : 'false');
    coreBtn.title = 'Mark as a core fact';
    coreBtn.addEventListener('click', () => toggleCore(node, f, coreBtn, note));
    actions.appendChild(coreBtn);

    const delBtn = el('button','mem-tag danger', 'delete');
    delBtn.type = 'button';
    delBtn.addEventListener('click', () => askDelete(node, f, delBtn, note));
    actions.appendChild(delBtn);
  }else if(f.core){
    actions.appendChild(el('span','mem-tag', 'core'));
  }
  if(actions.childNodes.length) top.appendChild(actions);
  node.appendChild(top);

  /* body: read-only text, or an editable field in edit mode */
  const saveWrap = el('div','mem-save');
  saveWrap.hidden = true;

  if(mode === 'edit'){
    const ta = el('textarea','mem-body');
    ta.value = f.body || '';
    ta.rows = 1;
    ta.spellcheck = false;
    ta.setAttribute('aria-label','Fact text');
    const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    const dirty = () => ta.value !== (node.dataset.saved ?? '');
    node.dataset.saved = f.body || '';
    ta.addEventListener('input', () => { grow(); saveWrap.hidden = !dirty(); note.hidden = true; });
    ta.addEventListener('blur', () => { if(dirty()) saveBody(node, f, ta, saveWrap, note); });
    ta.addEventListener('keydown', e => {
      if(e.key === 'Escape'){
        e.stopPropagation();
        ta.value = node.dataset.saved ?? '';
        saveWrap.hidden = true; grow(); ta.blur();
      }
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); ta.blur(); }
    });
    node.appendChild(ta);
    requestAnimationFrame(grow);

    const saveBtn = el('button','mem-tag','save');
    saveBtn.type = 'button';
    saveBtn.addEventListener('mousedown', e => e.preventDefault());   // keep focus, blur would double-fire
    saveBtn.addEventListener('click', () => saveBody(node, f, ta, saveWrap, note));
    saveWrap.appendChild(saveBtn);
  }else{
    node.appendChild(el('div','mem-body', f.body || ''));
  }

  const foot = el('div','mem-foot');
  const bits = [];
  if(f.updatedAt) bits.push('updated ' + fmtDate(f.updatedAt));
  else if(f.createdAt) bits.push('added ' + fmtDate(f.createdAt));
  if(Number.isFinite(f.hits) && f.hits > 0){
    bits.push(f.hits + '× used' + (f.lastUsedAt ? ', last ' + fmtDate(f.lastUsedAt) : ''));
  }else if(Number.isFinite(f.hits)){
    bits.push('never used');
  }
  foot.appendChild(el('div','mem-meta', bits.join(' · ')));
  foot.append(note, saveWrap);
  node.appendChild(foot);

  return node;
}

function say(note, text, bad){
  note.textContent = text;
  note.className = 'mem-note' + (bad ? ' bad' : '');
  note.hidden = false;
  if(!bad) setTimeout(() => { if(note.textContent === text) note.hidden = true; }, 2200);
}

/* ---------- mutations (edit mode only) ---------- */
async function saveBody(node, f, ta, saveWrap, note){
  const value = ta.value.trim();
  const previous = node.dataset.saved ?? '';
  if(value === previous){ saveWrap.hidden = true; return; }
  if(!value){
    ta.value = previous;
    saveWrap.hidden = true;
    say(note, 'a fact cannot be empty', true);
    return;
  }
  node.classList.add('busy');
  ta.disabled = true;
  try{
    const updated = await api(API_MEMORY + '/' + encodeURIComponent(f.id),
      {method:'PATCH', body: JSON.stringify({body: value})});
    const saved = (updated && typeof updated.body === 'string') ? updated.body : value;
    node.dataset.saved = saved;
    ta.value = saved;
    f.body = saved;
    saveWrap.hidden = true;
    say(note, 'saved');
  }catch(err){
    ta.value = previous;                       // never show what did not save
    saveWrap.hidden = true;
    say(note, 'save failed — ' + err.message, true);
  }finally{
    ta.disabled = false;
    node.classList.remove('busy');
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }
}

async function toggleCore(node, f, btn, note){
  const next = !f.core;
  btn.disabled = true;
  node.classList.add('busy');
  btn.setAttribute('aria-pressed', next ? 'true' : 'false');
  node.classList.toggle('core', next);
  try{
    const updated = await api(API_MEMORY + '/' + encodeURIComponent(f.id),
      {method:'PATCH', body: JSON.stringify({core: next})});
    const value = (updated && typeof updated.core === 'boolean') ? updated.core : next;
    f.core = value;
    btn.setAttribute('aria-pressed', value ? 'true' : 'false');
    node.classList.toggle('core', value);
    setCounts(Object.assign({}, counts, {core: Math.max(0, counts.core + (value ? 1 : -1))}));
  }catch(err){
    btn.setAttribute('aria-pressed', f.core ? 'true' : 'false');   // roll the optimism back
    node.classList.toggle('core', !!f.core);
    say(note, 'could not change core — ' + err.message, true);
  }finally{
    btn.disabled = false;
    node.classList.remove('busy');
  }
}

function resetConfirm(node){
  const btn = node.querySelector('.mem-tag.danger');
  const cancel = node.querySelector('.mem-tag.mem-cancel');
  delete node.dataset.confirm;
  if(cancel) cancel.remove();
  if(btn) btn.textContent = 'delete';
}

function askDelete(node, f, btn, note){
  if(node.dataset.confirm !== '1'){
    node.dataset.confirm = '1';
    btn.textContent = 'confirm delete';
    const cancel = el('button','mem-tag mem-cancel','cancel');
    cancel.type = 'button';
    cancel.addEventListener('click', () => resetConfirm(node));
    btn.after(cancel);
    say(note, 'this removes the fact for good', true);
    return;
  }
  doDelete(node, f, btn, note);
}

async function doDelete(node, f, btn, note){
  btn.disabled = true;
  node.classList.add('busy');
  try{
    await api(API_MEMORY + '/' + encodeURIComponent(f.id), {method:'DELETE'});
    node.remove();
    setCounts(Object.assign({}, counts, {
      facts: Math.max(0, counts.facts - 1),
      core:  Math.max(0, counts.core - (f.core ? 1 : 0))
    }));
    if(!listNode.firstChild) status('nothing remembered yet');
  }catch(err){
    resetConfirm(node);
    say(note, 'delete failed — ' + err.message, true);
  }finally{
    btn.disabled = false;
    node.classList.remove('busy');
  }
}

/* ---------- boot: the flag decides whether any of this exists ---------- */
(async function init(){
  let cfg = null;
  try{ cfg = await api(API_CONFIG); }catch(e){ cfg = null; }
  const flag = cfg && cfg.memoryPanel;
  if(flag !== 'read' && flag !== 'edit') return;   // 'off', unknown, or unreachable
  mode = flag;
  buildEntry();
  buildOverlay();
  try{
    const data = await api(API_MEMORY + '?query=&limit=1');
    setCounts(data.counts);
  }catch(e){ /* count stays at 0 until the panel is opened */ }
})();

})();
</script>
<!-- ══════════════ MEMORY PANEL — END ══════════════ -->
