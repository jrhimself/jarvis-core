name: FAT

# Every commit that lands on main gets the full acceptance run. Nothing here
# touches the house: the suite is deterministic and needs no Home Assistant, no
# tokens and no network.
on:
  push:
    branches: [main]
  # Also on every pull request: a branch that cannot be merged without review
  # is a branch whose suite has to have run before the review, not after it.
  pull_request:
  workflow_dispatch:

# A push on top of a running job makes that job irrelevant, not worth finishing.
concurrency:
  group: fat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fat:
    runs-on: ubuntu-latest
    # Declared so the token cannot grow if the repository default changes.
    # The suite only reads the tree.
    permissions:
      contents: read
    steps:
      # Hash pins: the security workflow's zizmor job requires them. These
      # are the commits the v7 tags already pointed at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci

      # Builds first, then runs the suite: the tests import from dist.
      - run: npm test

      - run: npm run test:types
