# Weekly update proposals. Monday morning in Amsterdam, before the day starts.
# Minor and patch updates are one pull request per ecosystem; a major stays on
# its own, because that one can change behaviour. Security updates are
# Dependabot's separate channel and are not grouped here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: deps
      prefix-development: deps
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Brain runs on Node 22. @types/node tracks that runtime's major, so a
    # major bump is the types for a different Node and is not proposed.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
